<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardar Dinheiro — Hub de Performance</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.30.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ═══ DESIGN SYSTEM — GUARDAR DINHEIRO PREMIUM ═══ */
:root{
  --primary:#16C79A;--primary-dark:#008B8B;--primary-light:#BFEFE8;
  --navy:#0B2239;--bg:#F5F7F9;--card:#FFFFFF;
  --text-primary:#0B2239;--text-secondary:#7A8797;
  --success:#22C55E;--warning:#F59E0B;--danger:#EF4444;
  --radius:24px;--radius-sm:16px;--radius-xs:10px;
  --shadow:0 8px 30px rgba(0,0,0,.08);--shadow-hover:0 16px 48px rgba(0,0,0,.14);
  --grad:linear-gradient(135deg,#16C79A 0%,#008B8B 100%);
  --sidebar-w:260px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text-primary);min-height:100vh;font-size:15px}

/* ── SHELL ── */
.app-shell{display:flex;min-height:100vh}
.main-wrap{flex:1;display:flex;flex-direction:column;margin-left:var(--sidebar-w);min-height:100vh}
.page-body{flex:1;padding:28px 32px;max-width:1400px;width:100%}

/* ── SIDEBAR ── */
.sidebar{width:var(--sidebar-w);background:var(--navy);position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;z-index:100;overflow-y:auto}
.sb-logo{padding:24px 20px 16px;border-bottom:1px solid rgba(255,255,255,.06)}
.sb-logo-row{display:flex;align-items:center;gap:10px}
.sb-logo-ico{width:36px;height:36px;background:var(--grad);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sb-logo-mark{width:42px;height:42px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(255,255,255,.04);border-radius:10px}
.sb-logo-mark img{height:34px;width:auto;display:block}
.sb-logo-name{font-size:14px;font-weight:700;color:#fff;letter-spacing:-.3px}
.sb-logo-tag{font-size:10px;color:rgba(255,255,255,.4);margin-top:1px}
.sb-nav{flex:1;padding:16px 12px}
.sb-section{font-size:9px;font-weight:700;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:1px;padding:12px 8px 6px;margin-top:8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:var(--radius-xs);cursor:pointer;font-size:13px;font-weight:500;color:rgba(255,255,255,.6);border:none;background:none;width:100%;text-align:left;font-family:inherit;transition:all .2s;margin-bottom:2px}
.nav-item:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.9)}
.nav-item.active{background:var(--grad);color:#fff;font-weight:600;box-shadow:0 4px 16px rgba(22,199,154,.3)}
.nav-item i{font-size:17px;flex-shrink:0}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.sb-footer{padding:16px 12px;border-top:1px solid rgba(255,255,255,.06)}
.sb-user{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--radius-xs);background:rgba(255,255,255,.04)}
.sb-avatar{width:34px;height:34px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0}
.sb-user-name{font-size:12px;font-weight:600;color:#fff}
.sb-user-email{font-size:10px;color:rgba(255,255,255,.4)}
.ze-card{margin:12px;background:linear-gradient(135deg,rgba(22,199,154,.12),rgba(0,139,139,.12));border:1px solid rgba(22,199,154,.2);border-radius:var(--radius-sm);padding:12px}
.ze-card-title{font-size:11px;font-weight:700;color:#16C79A;display:flex;align-items:center;gap:5px;margin-bottom:4px}
.ze-card-text{font-size:10px;color:rgba(255,255,255,.5);line-height:1.5}

/* ── TOP HEADER ── */
.top-header{background:var(--card);border-bottom:1px solid rgba(0,0,0,.06);padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;gap:16px}
.header-greet .greet-main{font-size:16px;font-weight:700;color:var(--text-primary)}
.header-greet .greet-sub{font-size:12px;color:var(--text-secondary);margin-top:1px}
.header-right{display:flex;align-items:center;gap:10px}
.period-sel{padding:7px 12px;border-radius:var(--radius-xs);border:1.5px solid rgba(0,0,0,.08);background:var(--bg);color:var(--text-primary);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;outline:none}
.period-sel:focus{border-color:var(--primary)}
.btn-outline{padding:7px 14px;border-radius:var(--radius-xs);border:1.5px solid rgba(0,0,0,.08);background:transparent;color:var(--text-primary);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.notif-btn{width:36px;height:36px;border-radius:var(--radius-xs);border:1.5px solid rgba(0,0,0,.08);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;color:var(--text-secondary)}
.notif-btn:hover{border-color:var(--primary);color:var(--primary)}

/* ── PAGE HEADER ── */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px}
.page-title{font-size:26px;font-weight:700;color:var(--text-primary);letter-spacing:-.5px}
.page-sub{font-size:13px;color:var(--text-secondary);margin-top:3px}
.page-actions{display:flex;align-items:center;gap:8px}

/* ── KPI GRID ── */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:28px}
.kpi-card{background:var(--card);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);transition:all .3s ease;cursor:default;position:relative;overflow:hidden;animation:fadeUp .4s ease both}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad)}
.kpi-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover)}
.kpi-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.kpi-icon{width:40px;height:40px;border-radius:12px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;color:var(--primary-dark);font-size:20px}
.kpi-value{font-size:32px;font-weight:700;color:var(--text-primary);letter-spacing:-1px;margin-bottom:4px;line-height:1}
.kpi-label{font-size:13px;color:var(--text-secondary);font-weight:500;margin-bottom:12px}
.kpi-hint{font-size:10px;color:var(--text-secondary);opacity:.6}
.kpi-empty .kpi-value{font-size:28px;color:var(--text-secondary);opacity:.4}

/* ── SPARKLINE ── */
.spark{display:flex;align-items:flex-end;gap:3px;height:32px;margin-top:8px}
.spark-bar{flex:1;background:var(--primary-light);border-radius:3px;transition:all .3s;min-height:2px}
.kpi-card:hover .spark-bar{background:var(--primary)}

/* ── BADGES ── */
.badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;display:inline-flex;align-items:center;gap:3px}
.badge-success{background:rgba(34,197,94,.1);color:#16a34a}
.badge-danger{background:rgba(239,68,68,.1);color:#dc2626}
.badge-neutral{background:rgba(122,135,151,.1);color:var(--text-secondary)}

/* ── CHART ROW ── */
.chart-row{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:28px}
.flex-2{grid-column:1}
.chart-card{background:var(--card);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);animation:fadeUp .4s ease .1s both}
.chart-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.chart-title{font-size:16px;font-weight:700;color:var(--text-primary)}
.chart-sub{font-size:12px;color:var(--text-secondary);margin-top:2px}
.chart-summary{display:flex;gap:24px;margin-top:16px;padding-top:16px;border-top:1px solid rgba(0,0,0,.04)}
.chart-stat{display:flex;flex-direction:column;gap:2px}
.stat-label{font-size:11px;color:var(--text-secondary)}
.stat-value{font-size:15px;font-weight:700;color:var(--text-primary)}
.empty-chart{padding:48px;text-align:center;color:var(--text-secondary)}
.empty-chart i{font-size:32px;opacity:.2;display:block;margin-bottom:8px}
.empty-chart p{font-size:13px}

/* ── INSIGHT CARD ── */
.insight-card{background:linear-gradient(135deg,rgba(22,199,154,.06),rgba(0,139,139,.06));border:1px solid rgba(22,199,154,.15);border-radius:var(--radius);padding:24px;display:flex;flex-direction:column;gap:16px;animation:fadeUp .4s ease .15s both}
.insight-header{display:flex;align-items:center;gap:12px}
.insight-avatar{font-size:32px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:var(--primary-light);border-radius:14px;flex-shrink:0}
.insight-name{font-size:15px;font-weight:700;color:var(--text-primary)}
.insight-role{font-size:12px;color:var(--text-secondary)}
.insight-list{display:flex;flex-direction:column;gap:10px;flex:1}
.insight-item{display:flex;align-items:flex-start;gap:9px;font-size:12px;line-height:1.5;color:var(--text-primary)}
.insight-item i{font-size:16px;flex-shrink:0;margin-top:1px}
.insight-item.green i{color:var(--success)}
.insight-item.blue i{color:#3b82f6}
.insight-item.amber i{color:var(--warning)}
.btn-insight{background:var(--grad);color:#fff;border:none;padding:10px 16px;border-radius:var(--radius-xs);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .2s}
.btn-insight:hover{opacity:.9}

/* ── BOTTOM CARDS ── */
.cards-row{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:28px}
.bottom-card{background:var(--card);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);animation:fadeUp .4s ease .2s both}
.card-title{font-size:14px;font-weight:700;color:var(--text-primary);margin-bottom:16px;display:flex;align-items:center;gap:7px}
.card-title i{color:var(--primary)}
.empty-sm{padding:24px;text-align:center;color:var(--text-secondary)}
.empty-sm i{font-size:24px;opacity:.2;display:block;margin-bottom:6px}
.empty-sm p{font-size:12px}
.meta-ring-wrap{position:relative;display:flex;align-items:center;justify-content:center;margin:8px 0}
.meta-ring-center{position:absolute;text-align:center}
.meta-pct{font-size:22px;font-weight:700;color:var(--text-primary)}
.meta-sub{font-size:11px;color:var(--text-secondary)}
.empty-hint{font-size:11px;color:var(--text-secondary);text-align:center;margin-top:8px}
.alert-list{display:flex;flex-direction:column;gap:8px}
.alert-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg);border-radius:var(--radius-xs);font-size:12px;color:var(--text-secondary)}
.alert-item i{font-size:16px;opacity:.5}

/* ── PLATFORM TABS ── */
.plat-tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.plat-btn{padding:7px 16px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid rgba(0,0,0,.08);background:var(--card);color:var(--text-secondary);font-family:inherit;transition:all .2s;display:flex;align-items:center;gap:6px}
.plat-btn:hover{border-color:var(--primary);color:var(--primary)}
.plat-btn.active{background:var(--grad);color:#fff;border-color:transparent}

/* ── IMPORT BANNER ── */
.import-banner{background:linear-gradient(135deg,#0B2239,#1a3a5c);color:#fff;border-radius:var(--radius);padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.import-left{display:flex;align-items:center;gap:14px}
.import-left strong{font-size:14px;display:block;margin-bottom:3px}
.import-left p{font-size:12px;opacity:.65}
.import-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ── BUTTONS ── */
.btn-primary{background:var(--grad);color:#fff;border:none;padding:9px 18px;border-radius:var(--radius-xs);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;transition:opacity .2s}
.btn-primary:hover{opacity:.9}
.btn-outline-w{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);padding:9px 14px;border-radius:var(--radius-xs);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.btn-outline-w:hover{background:rgba(255,255,255,.2)}
.btn-ghost{background:transparent;color:var(--text-secondary);border:1.5px solid rgba(0,0,0,.08);padding:6px 12px;border-radius:var(--radius-xs);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .2s;display:inline-flex;align-items:center;gap:5px}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn-primary-sm{background:var(--grad);color:#fff;border:none;padding:6px 12px;border-radius:var(--radius-xs);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;transition:opacity .2s}
.btn-primary-sm:hover{opacity:.9}
.btn-danger-sm{background:rgba(239,68,68,.08);color:#dc2626;border:1.5px solid rgba(239,68,68,.2);padding:6px 12px;border-radius:var(--radius-xs);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;transition:all .2s}
.btn-danger-sm:hover{background:rgba(239,68,68,.15)}

/* ── ENTRY BAR ── */
.entry-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border-radius:var(--radius-sm);padding:14px 20px;margin-bottom:20px;box-shadow:var(--shadow)}
.entry-label{font-size:12px;font-weight:600;color:var(--text-primary);flex:1;min-width:120px;display:flex;align-items:center;gap:6px}
.entry-label i{color:var(--primary)}

/* ── DATA SECTION ── */
.data-section{background:var(--card);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:20px}
.data-section-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid rgba(0,0,0,.05)}
.data-section-info h3{font-size:15px;font-weight:700;color:var(--text-primary);display:flex;align-items:center;gap:7px}
.data-section-info p{font-size:12px;color:var(--text-secondary);margin-top:2px}
.data-section-badge{font-size:11px;padding:4px 10px;border-radius:6px;font-weight:600}
.data-section-badge.has-data{background:rgba(34,197,94,.1);color:#16a34a}
.data-section-badge.no-data{background:rgba(122,135,151,.08);color:var(--text-secondary)}
.data-section-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.section-actions{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:24px}
.year-sel-wrap{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary)}

/* ── AREA WRAP (areaBlock styling) ── */
.area-wrap{background:var(--card);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.area-wrap .S{margin-bottom:20px}
.area-wrap .ST{font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:12px;display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0}
.area-wrap .ind{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:16px}
.area-wrap .ic{background:var(--bg);border-radius:var(--radius-xs);padding:14px;border:none}
.area-wrap .iv{font-size:22px;font-weight:700;color:var(--text-primary)}
.area-wrap .il{font-size:11px;color:var(--text-secondary);display:flex;align-items:center;gap:4px;margin-bottom:4px}
.area-wrap .is{font-size:11px;color:var(--text-secondary);margin-top:2px}
.area-wrap .tpc{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.area-wrap .fsel{padding:6px 10px;border-radius:var(--radius-xs);border:1.5px solid rgba(0,0,0,.08);background:var(--bg);font-size:12px;color:var(--text-primary);font-family:inherit}
.area-wrap svg text{font-family:'Inter',sans-serif}
.hwrap{border-radius:var(--radius-xs);overflow:hidden;border:1px solid rgba(0,0,0,.06)}
.htbl th{background:var(--bg);color:var(--text-secondary)}
.hin:focus{background:var(--primary);color:#fff;border-radius:4px}

/* ── ORIGINAL CLASSES UPDATED ── */
.D{background:var(--bg);border-radius:var(--radius-xs);padding:14px;border:none}
.D .L{font-size:11px;color:var(--text-secondary);margin-bottom:6px;font-weight:500}
.D .R,.D .M{font-size:20px;font-weight:700;color:var(--text-primary)}
.D .Su{font-size:11px;color:var(--text-secondary);margin-top:2px}
.G{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.mb{padding:6px 14px;border-radius:var(--radius-xs);font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid rgba(0,0,0,.08);background:var(--card);color:var(--text-secondary);transition:all .2s;font-family:inherit}
.mb:hover{border-color:var(--primary);color:var(--primary)}
.mb.a{background:var(--grad);color:#fff;border-color:transparent}
.mb .p{font-size:9px;opacity:.7;margin-left:2px}
.ptb{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid rgba(0,0,0,.08);background:var(--card);color:var(--text-secondary);font-family:inherit}
.ptb.a{background:var(--grad);color:#fff;border-color:transparent}
.mn{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.S{margin-bottom:1.2rem}
.ST{font-size:12px;font-weight:700;color:var(--text-secondary);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.T{width:100%;border-collapse:collapse;font-size:12px}
.T th{text-align:left;padding:8px 12px;font-size:11px;font-weight:600;color:var(--text-secondary);border-bottom:1px solid rgba(0,0,0,.06);background:var(--bg)}
.T th:not(:first-child){text-align:right}
.T td{padding:10px 12px;border-bottom:1px solid rgba(0,0,0,.04)}
.T td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
.T tr:hover{background:rgba(0,0,0,.02)}
.T .un{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.PB{display:flex;align-items:center;gap:10px;margin-bottom:.6rem;padding:12px 16px;border-radius:var(--radius-xs);background:var(--card);box-shadow:var(--shadow)}
.PI{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;background:var(--primary-light)}
.PF .PN{font-size:13px;font-weight:600}.PF .PD{font-size:11px;color:var(--text-secondary)}
.PW{display:flex;align-items:center;gap:8px;margin-top:6px}.PWB{flex:1;height:4px;background:rgba(0,0,0,.06);border-radius:2px;overflow:hidden}.PWF{height:100%;border-radius:2px;transition:width .5s}.PWP{font-size:10px;color:var(--text-secondary);font-weight:600}
.cd{border-radius:var(--radius-xs);padding:6px;min-height:80px;cursor:pointer;background:var(--card);border:1.5px solid rgba(0,0,0,.06);transition:all .2s}
.cd:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow)}
.cd.sl{border-color:var(--primary);border-width:2px}
.cd .cn{font-size:9px;font-weight:600;margin-bottom:3px;color:var(--text-secondary)}
.cd .ct{font-size:7px;padding:2px 5px;border-radius:4px;display:inline-block;margin-bottom:2px;font-weight:600}
.cg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:1rem}
.ch{font-size:9px;font-weight:700;color:var(--text-secondary);text-align:center;padding:4px 0;text-transform:uppercase;letter-spacing:.4px}
.ce{opacity:.25;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;border-style:dashed}
.ce:hover{opacity:.5;border-color:var(--primary)}
.dp{border-radius:var(--radius-xs);background:var(--card);padding:16px;margin-bottom:.6rem;box-shadow:var(--shadow)}
.dp h3{font-size:14px;font-weight:600;margin-bottom:3px}
.dp .dd{font-size:11px;color:var(--text-secondary);margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid rgba(0,0,0,.05)}
.cl{list-style:none}
.cl li{display:flex;align-items:flex-start;gap:8px;padding:6px 0;font-size:12px;border-bottom:1px solid rgba(0,0,0,.04)}
.cl li:last-child{border-bottom:none}

.an-exec-ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:11px;background:var(--primary-light);color:var(--primary-dark)}
.an-exec-lbl{font-size:11px;color:var(--text-secondary);font-weight:600;margin-bottom:4px}
.an-exec-val{font-size:19px;font-weight:700;color:var(--navy);letter-spacing:-.3px;line-height:1.1}
.an-exec-sub{font-size:11px;color:var(--text-secondary);margin-top:4px;font-weight:500}
/* ── Cards de métrica (semáforo) ── */
.an-metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px}
.an-mcard{background:var(--card);border:1px solid rgba(11,34,57,.06);border-radius:var(--radius-sm);padding:17px;transition:all .2s;box-shadow:0 3px 14px rgba(11,34,57,.04)}
.an-mcard:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.an-mcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:12px;min-height:32px}
.an-mcard-lbl{font-size:11.5px;color:var(--text-secondary);font-weight:600;line-height:1.35}
.an-mcard-tools{display:flex;align-items:center;gap:7px;flex-shrink:0}
.an-edit{border:none;background:transparent;color:var(--text-secondary);cursor:pointer;padding:3px;border-radius:7px;display:flex;align-items:center;opacity:0;transition:all .15s;font-size:13px}
.an-mcard:hover .an-edit{opacity:.65}
.an-edit:hover{opacity:1!important;background:var(--primary-light);color:var(--primary-dark)}
.an-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:3px}
.an-mcard-val{font-size:24px;font-weight:700;color:var(--navy);letter-spacing:-.5px;line-height:1}
.an-mcard-foot{display:flex;align-items:center;gap:7px;margin-top:13px;flex-wrap:wrap}
.an-pill{font-size:10.5px;color:var(--text-secondary);background:var(--bg);border-radius:6px;padding:4px 8px;font-weight:600;white-space:nowrap}
.an-pill b{color:var(--navy);font-weight:700}
.an-var{font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:3px;padding:4px 8px;border-radius:6px;margin-left:auto}
.an-var.up{color:#15803d;background:rgba(34,197,94,.12)}
.an-var.down{color:#b91c1c;background:rgba(239,68,68,.12)}
.an-var.flat{color:#b45309;background:rgba(245,158,11,.14)}
/* ── Card genérico ── */
.an-card{background:var(--card);border:1px solid rgba(11,34,57,.06);border-radius:var(--radius);padding:22px;margin-bottom:20px;box-shadow:0 4px 18px rgba(11,34,57,.04)}
.an-card-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.an-card-ttl{font-size:14px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:8px}
.an-card-ttl i{color:var(--primary);font-size:17px}
.an-card-sub{font-size:12px;color:var(--text-secondary);font-weight:500}
/* ── Barra de entrada de dados ── */
.an-entry{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:20px;background:var(--card);border:1px solid rgba(11,34,57,.06);border-radius:var(--radius-sm);padding:12px 16px}
.an-entry .lbl{font-size:12px;color:var(--text-secondary);font-weight:600;display:flex;align-items:center;gap:7px;margin-right:auto}
.an-entry .lbl i{color:var(--primary);font-size:15px}
.an-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:10px;border:1.5px solid rgba(11,34,57,.1);background:var(--card);color:var(--text-primary);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .18s}
.an-btn:hover{border-color:var(--primary);color:var(--primary-dark)}
.an-btn.prim{background:var(--grad);color:#fff;border-color:transparent}
.an-btn.prim:hover{opacity:.92;color:#fff}
.an-btn:disabled{opacity:.45;cursor:not-allowed}
.an-btn i{font-size:14px}
/* ── Gráfico ── */
.an-chart{width:100%;overflow:hidden}
.an-chart-svg{width:100%;height:auto;display:block}
.an-bar{transition:opacity .15s}
.an-bar-g:hover .an-bar{opacity:.8}
.an-bar-val{font-size:9px;font-weight:700;fill:var(--text-secondary)}
.an-axis{font-size:10px;fill:var(--text-secondary);font-weight:500}
/* ── Legenda / comparação ── */
.an-legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.an-leg{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-secondary);font-weight:600;cursor:pointer;opacity:.4;transition:opacity .16s;border:1.5px solid rgba(11,34,57,.08);border-radius:999px;padding:5px 11px;background:var(--card)}
.an-leg.on{opacity:1;border-color:rgba(11,34,57,.16)}
.an-leg i{width:13px;height:4px;border-radius:2px;display:inline-block}
/* ── Anotações ── */
.an-note-month{margin-bottom:16px}
.an-note-month:last-child{margin-bottom:0}
.an-note-mh{font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.an-note-mh .tag{font-size:10px;font-weight:700;color:var(--primary-dark);background:var(--primary-light);border-radius:6px;padding:3px 9px}
.an-note-li{display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--bg);border-radius:11px;margin-bottom:7px;font-size:12.5px;color:var(--text-primary)}
.an-note-li .ndot{width:6px;height:6px;border-radius:50%;background:var(--primary);flex-shrink:0}
.an-note-li .ntxt{flex:1;line-height:1.4}
.an-note-li .acts{display:flex;gap:3px;opacity:0;transition:.15s}
.an-note-li:hover .acts{opacity:1}
.an-ic-btn{background:none;border:none;cursor:pointer;color:var(--text-secondary);padding:4px;border-radius:7px;font-size:14px;display:inline-flex;align-items:center;justify-content:center;transition:all .15s}
.an-ic-btn:hover{background:rgba(11,34,57,.06);color:var(--navy)}
.an-ic-btn.del:hover{color:var(--danger);background:rgba(239,68,68,.08)}
/* ── Drawer lateral ── */
.an-drawer-ov{position:fixed;inset:0;background:rgba(11,34,57,.4);z-index:1200;backdrop-filter:blur(3px);opacity:0;transition:opacity .2s}
.an-drawer-ov.on{opacity:1}
.an-drawer{position:fixed;top:0;right:0;height:100vh;width:410px;max-width:94vw;background:var(--card);z-index:1201;box-shadow:-14px 0 44px rgba(11,34,57,.18);transform:translateX(100%);transition:transform .26s cubic-bezier(.3,.7,.3,1);display:flex;flex-direction:column;overflow-y:auto}
.an-drawer.on{transform:translateX(0)}
.an-dr-hd{padding:24px 24px 18px;border-bottom:1px solid rgba(11,34,57,.07);position:relative}
.an-dr-eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--primary-dark)}
.an-dr-title{font-size:18px;font-weight:700;color:var(--navy);margin-top:3px}
.an-dr-val{font-size:32px;font-weight:700;color:var(--navy);letter-spacing:-.6px;margin-top:10px;line-height:1}
.an-dr-vlbl{font-size:12px;color:var(--text-secondary);font-weight:500;margin-top:3px}
.an-dr-body{padding:20px 24px 32px}
.an-dr-close{position:absolute;top:20px;right:20px;width:32px;height:32px;border-radius:9px;border:none;background:var(--bg);color:var(--text-secondary);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.an-dr-close:hover{background:rgba(239,68,68,.08);color:var(--danger)}
.an-dr-mrow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(11,34,57,.05);font-size:12.5px}
.an-dr-mrow .k{color:var(--text-secondary);font-weight:500}
.an-dr-mrow .v{font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.an-dr-sec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-secondary);margin:22px 0 12px;display:flex;align-items:center;justify-content:space-between}
/* ── Estado vazio ── */
.an-empty{text-align:center;padding:34px 16px;color:var(--text-secondary)}
.an-empty i{font-size:32px;opacity:.18;display:block;margin-bottom:10px}
.an-empty p{font-size:13.5px;font-weight:600;margin-bottom:3px;color:var(--text-primary)}
.an-empty span{font-size:12px;opacity:.8}
/* ── Responsivo ── */
@media(max-width:1100px){.an-exec{grid-template-columns:repeat(3,1fr)}.an-metrics{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.an-exec{grid-template-columns:repeat(2,1fr)}.an-metrics{grid-template-columns:1fr}.an-seg{width:100%}.an-seg-btn{flex:1;justify-content:center}.an-drawer{width:100%}.an-entry{flex-direction:column;align-items:stretch}.an-entry .lbl{margin-bottom:4px}}
/* destaque do % ao lado do número */
.an-mcard-valrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.an-mcard-valrow .an-var{margin-left:0;font-size:12.5px;padding:3px 9px}
/* meta do mês — progresso */
.an-gp{padding:16px 18px}
.an-gp-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.an-gp-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.an-gp-controls .fsel{max-width:210px}
.an-gp-bar{height:12px;border-radius:8px;background:var(--bg);overflow:hidden;border:1px solid rgba(11,34,57,.06)}
.an-gp-fill{height:100%;border-radius:8px;min-width:2px;transition:width .5s ease}
.an-gp-nums{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:13px}
.an-gp-pair{display:flex;flex-direction:column;gap:2px}
.an-gp-pair span{font-size:10px;color:var(--text-secondary);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.an-gp-pair b{font-size:16px;color:var(--navy);font-weight:700}
.an-gp-pct{margin-left:auto;font-size:26px;font-weight:800;letter-spacing:-1px}
/* histórico por métrica (um gráfico grande por métrica) */
.an-hcharts{display:grid;grid-template-columns:repeat(auto-fit,minmax(460px,1fr));gap:18px}
.an-hchart{background:var(--bg);border:1px solid rgba(11,34,57,.05);border-radius:var(--radius-sm);padding:15px 17px 8px}
.an-hchart-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
.an-hchart-ttl{font-size:12px;color:var(--text-secondary);font-weight:600}
.an-hchart-val{font-size:22px;font-weight:700;color:var(--navy);letter-spacing:-.5px;line-height:1.1;margin-top:2px}
.an-hchart-hd .an-var{margin-left:0;flex-shrink:0}
@media(max-width:900px){.an-hcharts{grid-template-columns:1fr}}
/* badge de dia nas anotações */
.an-note-day{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--primary-dark);background:var(--primary-light);border-radius:6px;padding:3px 7px;flex-shrink:0}
.an-note-day i{font-size:12px}
/* origem da campanha */
.an-camp-ctrl{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 16px}
.an-camp-ctrl-l,.an-camp-ctrl-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.an-camp-cl{font-size:11px;color:var(--text-secondary);font-weight:600}
.an-rk{display:flex;align-items:center;gap:12px;padding:7px 0}
.an-rk-name{width:150px;min-width:120px;font-size:12px;font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.an-rk-track{flex:1;height:14px;background:var(--bg);border-radius:8px;overflow:hidden;border:1px solid rgba(11,34,57,.05)}
.an-rk-fill{height:100%;border-radius:8px;min-width:2px;transition:width .5s ease}
.an-rk-val{width:128px;text-align:right;font-size:12.5px;font-weight:700;color:var(--navy)}
.an-rk-share{color:var(--text-secondary);font-weight:600;font-size:11px}
.an-camp-tblw{overflow-x:auto;margin:0 -2px}
.an-camp-tbl{width:100%;border-collapse:collapse;font-size:12px}

.an-camp-tbl th{font-size:10.5px;color:var(--text-secondary);font-weight:600;text-transform:uppercase;letter-spacing:.2px;position:sticky;top:0;background:var(--card)}
.an-camp-tbl tbody tr:hover{background:var(--bg)}

.an-camp-pivot .an-na{color:var(--text-secondary);opacity:.6}
.an-camp-tot td{border-top:2px solid rgba(11,34,57,.12);font-weight:700;color:var(--navy)}
.an-camp-tot td.stick{background:var(--card)}
.an-sortable{cursor:pointer;user-select:none;white-space:nowrap}
.an-ads-best{margin-top:10px;font-size:11px;color:var(--text-secondary);display:flex;align-items:center;gap:5px;border-top:1px solid rgba(11,34,57,.05);padding-top:9px}
.an-ads-best i{color:var(--warning);font-size:13px}
.an-ads-best b{color:var(--navy)}
.an-hint{display:flex;align-items:flex-start;gap:8px;background:var(--primary-light);color:var(--primary-dark);border-radius:var(--radius-sm);padding:12px 15px;font-size:12.5px;line-height:1.5;margin-bottom:18px;font-weight:500}
.an-hint i{font-size:16px;flex-shrink:0;margin-top:1px}
.an-camp-tbl td.an-ads-bestcell{background:rgba(245,158,11,.1);color:var(--navy);font-weight:700}
.an-rev-rpm td{background:var(--primary-light)!important;color:var(--primary-dark);font-weight:700}
.an-dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
@media(max-width:900px){.an-dash-grid{grid-template-columns:1fr}}
.an-alert-list{display:flex;flex-direction:column;gap:8px}
.an-alert{display:flex;align-items:center;gap:11px;padding:10px 12px;background:var(--bg);border-radius:var(--radius-xs);border-left:3px solid var(--text-secondary)}
.an-alert>i{font-size:19px;flex-shrink:0}
.an-alert-tx{flex:1;min-width:0}
.an-alert-tx b{font-size:13px;color:var(--navy)}
.an-alert-sec{font-size:10px;color:var(--text-secondary);background:rgba(11,34,57,.06);padding:1px 6px;border-radius:6px;margin-left:6px}

.an-alert-var{font-weight:800;font-size:14px;flex-shrink:0}
.an-opp{display:flex;align-items:flex-start;gap:11px;padding:12px;border-bottom:1px solid rgba(11,34,57,.05)}
.an-opp:last-child{border-bottom:none}
.an-opp>i{font-size:19px;color:var(--primary);margin-top:1px;flex-shrink:0}
.an-opp-tx{flex:1;font-size:12.5px;color:var(--text-primary);line-height:1.55}
.an-opp-type{display:inline-block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--primary-dark);background:var(--primary-light);padding:2px 7px;border-radius:6px;margin-right:6px;vertical-align:middle}

.an-meta-row{padding:11px 0;border-bottom:1px solid rgba(11,34,57,.05)}

.an-meta-top{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--navy);margin-bottom:6px}
.an-meta-sub{font-size:11px;color:var(--text-secondary);margin-top:4px}
.an-meta-badge{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;border:1px solid;border-radius:6px;padding:1px 6px}
.tm-wrap{display:grid;grid-template-columns:330px 1fr;gap:18px}
@media(max-width:920px){.tm-wrap{grid-template-columns:1fr}}
.tm-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.tm-cal .wd{font-size:10px;font-weight:700;color:var(--text-secondary);text-align:center;padding:2px 0}
.tm-day{aspect-ratio:1;border:1px solid rgba(11,34,57,.08);border-radius:10px;background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--navy);position:relative}

.tm-sched{display:flex;flex-direction:column;gap:3px}

.seg-ins-t{font-weight:700;font-size:12.5px;color:var(--navy);margin-bottom:2px}
.seg-ins-x{font-size:11.5px;color:var(--text-secondary);line-height:1.5}
.seg-d{font-size:10px;font-weight:700;white-space:nowrap}
.tm-hrow{display:flex;gap:8px;padding:5px 6px;border-radius:9px;background:var(--bg);align-items:flex-start}

.tm-additem:hover{color:var(--primary-dark);border-color:var(--primary)}
.tl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:980px){.tl-grid{grid-template-columns:1fr}}
.tl-row{display:flex;align-items:center;gap:6px;padding:6px 7px;border-radius:9px;background:var(--bg);border-left:3px solid transparent;margin-bottom:5px;flex-wrap:wrap}
.tl-item{flex:1;min-width:120px;border:1px solid rgba(11,34,57,.1);border-radius:7px;padding:6px 8px;font-size:12.5px;font-family:inherit;background:var(--card);color:var(--text-primary)}
.tl-h{width:54px;border:1px solid rgba(11,34,57,.1);border-radius:7px;padding:6px 4px;font-size:12px;font-family:inherit;text-align:center;background:var(--card);color:var(--text-primary)}
.tl-item:focus,.tl-h:focus{outline:none;border-color:var(--primary)}
.tl-clsbtns{display:flex;gap:3px}
.tl-del{border:none;background:none;color:var(--text-secondary);cursor:pointer;font-size:14px;padding:2px 4px;line-height:1}
.tl-del:hover{color:var(--danger)}
.tl-sub{font-size:11.5px;color:var(--text-secondary)}
.tl-total{color:var(--navy)}
.tl-add{font-size:12px;color:var(--primary-dark);background:var(--primary-light);border:none;border-radius:9px;padding:8px 10px;cursor:pointer;font-weight:600;width:100%;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:5px}
.tl-add:hover{filter:brightness(.97)}
.tl-bar{height:14px;border-radius:7px;background:rgba(11,34,57,.08);overflow:hidden;margin:4px 0 2px}
.tl-bar-fill{height:100%;border-radius:7px;transition:width .3s}
.an-sortable:hover{color:var(--primary-dark)}
.an-camp-tbl th.sorted{color:var(--primary-dark)}
.T th.tp-sort{user-select:none}
.T th.tp-sort:hover{color:var(--primary-dark)}
.T th.tp-sort.on{color:var(--primary-dark)}
@media(max-width:700px){.an-rk-name{width:100px;min-width:90px}.an-rk-val{width:92px}}
</style>

    const pj=proj(v,dE,tD);

    return`<div class="D"><div class="L">${l} <span class="E" onclick="sM('${l}',${v},v=>{sA(${cM},'${k}',v)})"><i class="ti ti-edit"></i></span></div><div class="V"><span class="R">${fN(v)}</span>${dlP(v,prevFull)}</div><div class="Bp">Proj: ${fN(pj)} · ${antBtn}</div></div>`;
  }
  function kpiPct(l,k,v,prevFull){ // % rate: sem projeção, comparação direta
    const antBtn=`<span class="E ant-edit" onclick="sM('${l} — mês anterior',${prevFull},v=>{sA(${pvEff},'${k}',v)})">Ant: ${prevFull?prevFull.toFixed(1)+'%':'—'} <i class="ti ti-edit" style="font-size:9px;opacity:.45"></i></span>`;
    return`<div class="D"><div class="L">${l} <span class="E" onclick="sM('${l}',${v},v=>{sA(${cM},'${k}',v)})"><i class="ti ti-edit"></i></span></div><div class="V"><span class="R">${v.toFixed(1)}%</span>${dlPA(v,prevFull)}</div><div class="Bp">${antBtn}</div></div>`;
  }
  // --- Sessões por canal ---
  function rChs(pfx){
    const chs=['organic_search','direct','unassigned','referral','social'];
    const chL={organic_search:'Organic Search',direct:'Direct',unassigned:'Unassigned',referral:'Referral',social:'Social'};
    const pre=pfx?pfx+'_':'';
    let h=`<div class="S"><div class="ST"><i class="ti ti-route" style="font-size:13px"></i> Sessões por canal</div><div class="rg">`;
    chs.forEach(c=>{
      const k=pre+'ch_'+c,v=gA(cM,k),p=gA(pvEff,k),pj=proj(v,dE,tD);
      h+=`<div class="rc"><div class="rl">${chL[c]} <span class="E" onclick="sM('${chL[c]}',${v},v=>{sA(${cM},'${k}',v)})"><i class="ti ti-edit"></i></span></div><div class="rv">${fN(v)} ${dlP(v,p)}</div><div style="font-size:9px;color:var(--tx3)">Proj: ${fN(pj)} · <span class="E ant-edit" onclick="sM('${chL[c]} — mês ant.',${p},v=>{sA(${pvEff},'${k}',v)})">Ant: ${p?fN(p):'—'} <i class="ti ti-edit" style="font-size:9px;opacity:.45"></i></span></div></div>`;
    });
    return h+`</div></div>`;
  }
  // --- Search Console ---
  function rSC(site){
    const scK=['cliques','impressoes','ctr','posicao'];
    const scL={cliques:'Cliques',impressoes:'Impressões',ctr:'CTR Média',posicao:'Posição Média'};
    const pfx=site+'_sc';
    let h=`<div class="S"><div class="ST"><i class="ti ti-search" style="font-size:13px"></i> Search Console</div><div style="overflow-x:auto"><table class="T"><thead><tr><th>Métrica</th><th>Mês anterior</th><th>${m.n} (atual)</th><th>Últimas 24h</th></tr></thead><tbody>`;
    scK.forEach(k=>{
      const vCur=gA(cM,pfx+'_'+k),vPrev=gA(pvEff,pfx+'_'+k),v24=ac['24h_'+site+'_sc_'+k]||0;
      const isCtr=k==='ctr',isPos=k==='posicao';
      const fmtV=v=>isCtr?v.toFixed(1)+'%':isPos?v.toFixed(1):fN(v);
      const sem=isPos?dlPPos(vCur,vPrev):isCtr?dlPA(vCur,vPrev):dlP(vCur,vPrev);
      h+=`<tr><td>${scL[k]}</td>`;
      h+=`<td style="cursor:pointer;text-align:right" onclick="sM('${scL[k]} — mês ant.',${vPrev},v=>{sA(${pvEff},'${pfx}_${k}',v)})">${fmtV(vPrev)}</td>`;
      h+=`<td style="cursor:pointer;font-weight:500;text-align:right" onclick="sM('${scL[k]} — ${m.n}',${vCur},v=>{sA(${cM},'${pfx}_${k}',v)})">${fmtV(vCur)} ${sem}</td>`;
      h+=`<td style="cursor:pointer;text-align:right" onclick="sM('${scL[k]} — 24h',${v24},v=>{ac['24h_${site}_sc_${k}']=v;sv()})">${fmtV(v24)}</td></tr>`;
    });
    return h+`</tbody></table></div></div>`;
  }
  // --- Indexação ---
  function rIdx(site){
    const iK=['indexed','notindexed'];
    const iL={indexed:'Indexadas',notindexed:'Não indexadas'};
    let h=`<div class="S"><div class="ST"><i class="ti ti-list-check" style="font-size:13px"></i> Indexação</div><div class="rg">`;
    iK.forEach(k=>{
      const v=gA(cM,site+'_'+k),p=gA(pvEff,site+'_'+k);
      const sem=k==='notindexed'?dlPPos(v,p):dlP(v,p);
      h+=`<div class="rc"><div class="rl">${iL[k]} <span class="E" onclick="sM('${iL[k]}',${v},v=>{sA(${cM},'${site}_${k}',v)})"><i class="ti ti-edit"></i></span></div><div class="rv">${fN(v)} ${sem}</div><div style="font-size:9px;color:var(--tx3)"><span class="E ant-edit" onclick="sM('${iL[k]} — mês ant.',${p},v=>{sA(${pvEff},'${site}_${k}',v)})">Ant: ${p?fN(p):'—'} <i class="ti ti-edit" style="font-size:9px;opacity:.45"></i></span></div></div>`;
    });
    return h+`</div></div>`;
  }
  // --- Top páginas ---
  function rTP(site){
    const sL2={gd:'Guardar Dinheiro (principal)',blog:'Blog Guardar Dinheiro',cora:'CoraCora News'};
    const urls=gU(cM,site);
    // Módulo 2 — ordenação dinâmica (instantânea, sem novo upload)
    const sval=u=>{const p30=proj(u.cur||0,dE,tD),vr=u.prev?((p30-u.prev)/u.prev*100):0;
      if(tpSort.by==='prev')return u.prev||0;if(tpSort.by==='p30')return p30;
      if(tpSort.by==='var')return vr;if(tpSort.by==='name')return(u.n||'').toLowerCase();return u.cur||0;};
    const sortedIdx=urls.map((u,i)=>({u,i})).sort((a,b)=>{const va=sval(a.u),vb=sval(b.u);
      if(typeof va==='string')return tpSort.dir==='asc'?va.localeCompare(vb):vb.localeCompare(va);
      return tpSort.dir==='asc'?va-vb:vb-va;});
    const sortOpts=[['var','Variação (%)'],['cur','Sessões atuais'],['prev','Sessões mês ant.'],['p30','Projeção 30d'],['name','Nome (A–Z)']];
    let h=`<div class="S"><div class="ST"><i class="ti ti-world" style="font-size:13px"></i> Top páginas — ${sL2[site]} <span style="font-weight:400;text-transform:none;margin-left:auto;font-size:10px;color:var(--tx3)">${urls.length} página${urls.length===1?'':'s'}</span></div>`;
    if(urls.length){
      h+=`<div class="tpc"><span style="font-size:10px;color:var(--tx3)">Ordenar por:</span><select class="fsel" onchange="tpSort.by=this.value;R()">${sortOpts.map(([v,l])=>`<option value="${v}" ${tpSort.by===v?'selected':''}>${l}</option>`).join('')}</select>`;
      h+=`<button class="dirb" onclick="tpSort.dir=tpSort.dir==='asc'?'desc':'asc';R()" title="Inverter direção">${tpSort.dir==='asc'?'<i class="ti ti-sort-ascending"></i> Crescente':'<i class="ti ti-sort-descending"></i> Decrescente'}</button>`;
      h+=`<button class="dirb dgr" style="margin-left:auto" onclick="delAllPages(${cM},'${site}','${sL2[site]}')"><i class="ti ti-trash"></i> Excluir todas as páginas</button></div>`;
    }
    h+=`<div style="overflow-x:auto"><table class="T"><thead><tr><th>Página</th><th>Mês ant.</th><th>${m.n} (${dE}d)</th><th>Proj 30d</th><th>Var (proj vs ant)</th><th></th></tr></thead><tbody>`;
    sortedIdx.forEach(({u,i})=>{
      const p30=proj(u.cur||0,dE,tD),vr=u.prev?((p30-u.prev)/u.prev*100):0;
      const vc=vr>=5?'var(--grn)':vr>=-5?'var(--amb)':'var(--red)',ar=vr>=0?'▲':'▼';
      h+=`<tr><td class="un" onclick="eU(${cM},'${site}',${i},'n')" style="cursor:pointer">${u.n}</td><td onclick="eU(${cM},'${site}',${i},'prev')" style="cursor:pointer">${fN(u.prev||0)}</td><td onclick="eU(${cM},'${site}',${i},'cur')" style="cursor:pointer;font-weight:500">${fN(u.cur||0)}</td><td>${fN(p30)}</td><td style="color:${vc};font-weight:600">${u.prev?(vr>=0?'+':'')+vr.toFixed(0)+'% '+ar:'—'}</td><td><span class="E" onclick="rU(${cM},'${site}',${i})" style="cursor:pointer"><i class="ti ti-trash" style="font-size:11px"></i></span></td></tr>`;
    });
    h+=`</tbody></table></div><div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:4px">`;
    h+=`<button class="ab" style="flex:1;min-width:130px" onclick="aU(${cM},'${site}')"><i class="ti ti-plus" style="font-size:11px"></i> Adicionar página</button>`;
    h+=`<button class="ab" style="flex:1;min-width:130px" onclick="importCSV(${cM},'${site}','prev')"><i class="ti ti-calendar-minus" style="font-size:11px"></i> Importar Mês Anterior</button>`;
    h+=`<button class="ab" style="flex:1;min-width:130px" onclick="importCSV(${cM},'${site}','cur')"><i class="ti ti-file-import" style="font-size:11px"></i> Importar Mês Atual</button>`;
    return h+`</div></div>`;
  }
  // =========== RENDER =============
  let h=mN();
  // Product tabs
  h+=`<div class="ptabs">
    <button class="ptb ${cP==='gd'?'a':''}" onclick="cP='gd';R()"><i class="ti ti-home-2" style="font-size:11px;margin-right:3px"></i>GD Principal</button>
    <button class="ptb ${cP==='blog'?'a':''}" onclick="cP='blog';R()"><i class="ti ti-news" style="font-size:11px;margin-right:3px"></i>Blog GD</button>
    <button class="ptb ${cP==='cora'?'a':''}" onclick="cP='cora';R()"><i class="ti ti-heart" style="font-size:11px;margin-right:3px"></i>CoraCora</button>
    <button class="ptb ${cP==='fin'?'a':''}" onclick="cP='fin';R()"><i class="ti ti-cash" style="font-size:11px;margin-right:3px"></i>Financeiro</button>
  </div>`;
  if(cP==='gd'){
    h+=`<div class="S"><div class="ST"><i class="ti ti-chart-bar" style="font-size:13px"></i> KPIs — Guardar Dinheiro <span style="font-weight:400;text-transform:none;margin-left:4px;font-size:10px">${dE}/${tD} dias</span></div><div class="G">`;
    h+=kpi('Sessões (GA)','acessos',gA(cM,'acessos'),m.tgt.acessos,gA(pvEff,'acessos'),false);
    h+=kpi('Leads','leads',gA(cM,'leads'),m.tgt.leads,gA(pvEff,'leads'),false);
    h+=kpiS('Eng. orgânico','engajamento',gA(cM,'engajamento'),gA(pvEff,'engajamento'));
    h+=kpiPct('% Engajamento','eng_pct',gA(cM,'eng_pct'),gA(pvEff,'eng_pct'));
    h+=`</div></div>`;
    h+=rChs('');
    h+=rSC('gd');
    h+=rIdx('gd');
    h+=areaBlock('gsc');
    h+=areaBlock('ga');
    h+=areaBlock('aquis');
    h+=rTP('gd');
  }else if(cP==='blog'){
    h+=`<div class="S"><div class="ST"><i class="ti ti-news" style="font-size:13px"></i> KPIs — Blog Guardar Dinheiro <span style="font-weight:400;text-transform:none;margin-left:4px;font-size:10px">${dE}/${tD} dias</span></div><div class="G">`;
    h+=kpiS('Sessões (GA)','blog_acessos',gA(cM,'blog_acessos'),gA(pvEff,'blog_acessos'));
    h+=kpiS('Leads','blog_leads',gA(cM,'blog_leads'),gA(pvEff,'blog_leads'));
    h+=kpiS('Eng. orgânico','blog_eng',gA(cM,'blog_eng'),gA(pvEff,'blog_eng'));
    h+=kpiPct('% Engajamento','blog_eng_pct',gA(cM,'blog_eng_pct'),gA(pvEff,'blog_eng_pct'));
    h+=`</div></div>`;
    h+=rChs('blog');
    h+=rSC('blog');
    h+=rIdx('blog');
    h+=rTP('blog');
  }else if(cP==='cora'){
    h+=`<div class="S"><div class="ST"><i class="ti ti-heart" style="font-size:13px"></i> KPIs — CoraCora News <span style="font-weight:400;text-transform:none;margin-left:4px;font-size:10px">${dE}/${tD} dias</span></div><div class="G">`;
    h+=kpiS('Sessões (GA)','cora_acessos',gA(cM,'cora_acessos'),gA(pvEff,'cora_acessos'));
    h+=kpiS('Leads','cora_leads',gA(cM,'cora_leads'),gA(pvEff,'cora_leads'));
    h+=kpiS('Eng. orgânico','cora_eng',gA(cM,'cora_eng'),gA(pvEff,'cora_eng'));
    h+=kpiPct('% Engajamento','cora_eng_pct',gA(cM,'cora_eng_pct'),gA(pvEff,'cora_eng_pct'));
    h+=`</div></div>`;
    h+=rChs('cora');
    h+=rSC('cora');
    h+=rIdx('cora');
    h+=rTP('cora');
  }else{ // Financeiro
    const bK=['adsense','uol','indoleads','dgmax','cofrinho'];
    const bL={adsense:'AdSense',uol:'UOL Afiliados',indoleads:'Indoleads',dgmax:'DGMax',cofrinho:'Cofrinho'};
    const bC={adsense:'var(--blu)',uol:'var(--pur)',indoleads:'var(--cor)',dgmax:'var(--grn)',cofrinho:'var(--amb)'};
    // EBITDA
    h+=`<div class="S"><div class="ST"><i class="ti ti-chart-bar" style="font-size:13px"></i> KPIs Financeiros <span style="font-weight:400;text-transform:none;margin-left:4px;font-size:10px">${dE}/${tD} dias</span></div><div class="G">`;
    h+=kpi('EBITDA','ebitda',gA(cM,'ebitda'),0,gA(pvEff,'ebitda'),true);
    h+=`</div></div>`;
    // AdSense
    const adsK=[{k:'ads_impressoes',l:'Impressões',f:'n'},{k:'ads_cliques',l:'Cliques',f:'n'},{k:'ads_ctr',l:'CTR',f:'p'},{k:'ads_ecpm',l:'eCPM',f:'d'},{k:'ads_receita',l:'Receita',f:'d'},{k:'ads_visibilidade',l:'Visibilidade',f:'p'}];
    h+=`<div class="S"><div class="ST"><i class="ti ti-coin" style="font-size:13px"></i> Monetização AdSense (USD)</div><div class="rg">`;
    adsK.forEach(({k,l,f})=>{
      const v=gA(cM,k),p=gA(pvEff,k),pj=proj(v,dE,tD);
      const fmt=f==='d'?fD(v):f==='p'?v.toFixed(1)+'%':fN(v);
      const fmtPj=f==='d'?fD(pj):f==='p'?'—':fN(pj);
      const antFmt=p?(f==='d'?fD(p):f==='p'?p.toFixed(1)+'%':fN(p)):'—';
      const sem=f==='p'?dlPA(v,p):dlP(v,p);
      h+=`<div class="rc"><div class="rl">${l} <span class="E" onclick="sM('${l}',${v},v=>{sA(${cM},'${k}',v)})"><i class="ti ti-edit"></i></span></div><div class="rv">${fmt} ${sem}</div><div style="font-size:9px;color:var(--tx3)">Proj: ${fmtPj} · <span class="E ant-edit" onclick="sM('${l} — mês ant.',${p},v=>{sA(${pvEff},'${k}',v)})">Ant: ${antFmt} <i class="ti ti-edit" style="font-size:9px;opacity:.45"></i></span></div></div>`;
    });
    h+=`</div></div>`;
    // Receita bruta
    const bT=bK.reduce((s,k)=>s+gA(cM,'bruta_'+k),0),bTP=bK.reduce((s,k)=>s+gA(pvEff,'bruta_'+k),0),bTPj=proj(bT,dE,tD);
    h+=`<div class="S"><div class="ST"><i class="ti ti-cash" style="font-size:13px"></i> Receita bruta por frente — ${fR(bT)} <span style="font-size:10px;font-weight:400;text-transform:none;margin-left:2px">Proj: ${fR(bTPj)}</span> ${dlP(bT,bTP)}</div><div class="rg">`;
    bK.forEach(k=>{
      const v=gA(cM,'bruta_'+k),p=gA(pvEff,'bruta_'+k),pj=proj(v,dE,tD);
      h+=`<div class="rc"><div class="rl">${bL[k]} <span class="E" onclick="sM('${bL[k]}',${v},v=>{sA(${cM},'bruta_${k}',v)})"><i class="ti ti-edit"></i></span></div><div class="rv" style="color:${bC[k]}">${fR(v)} ${dlP(v,p)}</div><div style="font-size:9px;color:var(--tx3)">Proj: ${fR(pj)} · <span class="E ant-edit" onclick="sM('${bL[k]} — mês ant.',${p},v=>{sA(${pvEff},'bruta_${k}',v)})">Ant: ${p?fR(p):'—'} <i class="ti ti-edit" style="font-size:9px;opacity:.45"></i></span></div></div>`;
    });
    h+=`</div></div>`;
    // Regras de precificação
    const pr=gPR(cM);
    h+=`<div class="S"><div class="ST"><i class="ti ti-adjustments" style="font-size:13px"></i> Regras de precificação</div><table class="pr-tbl"><tr><th>Formato</th><th>Valor mínimo</th><th>Regra de negócio</th><th></th></tr>`;
    pr.forEach((r,i)=>{h+=`<tr><td><select onchange="const p=gPR(${cM});p[${i}].tipo=this.value;sPR(${cM},p);R()"><option ${r.tipo==='Banner'?'selected':''}>Banner</option><option ${r.tipo==='Interstitial'?'selected':''}>Interstitial</option><option ${r.tipo==='Anchor'?'selected':''}>Anchor</option></select></td><td style="cursor:pointer" onclick="sM('Valor mínimo','${r.min}',v=>{const p=gPR(${cM});p[${i}].min=v;sPR(${cM},p)},'text')">${r.min||'—'}</td><td style="cursor:pointer" onclick="sM('Regra de negócio','${r.regra}',v=>{const p=gPR(${cM});p[${i}].regra=v;sPR(${cM},p)},'text')">${r.regra||'—'}</td><td><span class="E" onclick="const p=gPR(${cM});p.splice(${i},1);sPR(${cM},p);R()"><i class="ti ti-trash" style="font-size:11px"></i></span></td></tr>`});
    h+=`</table><button class="ab" style="margin-top:4px" onclick="const p=gPR(${cM});p.push({tipo:'Banner',min:'',regra:''});sPR(${cM},p);R()"><i class="ti ti-plus" style="font-size:11px"></i> Nova regra</button></div>`;
    // Custos
    const costs=gCosts(cM),tCost=costs.reduce((s,c)=>s+c.items.reduce((s2,it)=>s2+it.brl,0),0);
    const adMR=gA(cM,'ad_mgr'),adMP=gA(pvEff,'ad_mgr'),roi=tCost?(adMR-tCost)/tCost*100:0;
    h+=`<div class="S"><div class="ST"><i class="ti ti-receipt" style="font-size:13px"></i> Custos do ecossistema <span style="margin-left:auto;font-size:11px;color:${roi>=0?'var(--grn)':'var(--red)'}">ROI ≈ ${roi>=0?'+':''}${roi.toFixed(1)}%</span></div>`;
    costs.forEach((cat,ci)=>{
      const sub=cat.items.reduce((s,it)=>s+it.brl,0);
      h+=`<table class="ct"><tr><th>${cat.cat}</th><th>BRL</th></tr>`;
      cat.items.forEach((it,ii)=>{h+=`<tr><td>${it.n} <span class="E" onclick="sM('Nome','${it.n.replace(/'/g,"\\'")}',v=>{const c=gCosts(${cM});c[${ci}].items[${ii}].n=v;sCosts(${cM},c)},'text')"><i class="ti ti-pencil" style="font-size:10px"></i></span></td><td style="cursor:pointer" onclick="sM('BRL',${it.brl},v=>{const c=gCosts(${cM});c[${ci}].items[${ii}].brl=v;sCosts(${cM},c)})">${fR(it.brl)} <span class="E" onclick="event.stopPropagation();const c=gCosts(${cM});c[${ci}].items.splice(${ii},1);sCosts(${cM},c);R()"><i class="ti ti-trash" style="font-size:10px"></i></span></td></tr>`});
      h+=`<tr class="su"><td>Subtotal ${cat.cat}</td><td>${fR(sub)}</td></tr></table>`;
      h+=`<button class="ab" style="margin:3px 0 8px" onclick="sM('Nome do item','',v=>{if(!v.trim())return;const c=gCosts(${cM});c[${ci}].items.push({n:v.trim(),brl:0});sCosts(${cM},c)},'text')"><i class="ti ti-plus" style="font-size:10px"></i> Item</button>`;
    });
    h+=`<button class="ab" style="margin-bottom:5px" onclick="sM('Nova categoria','',v=>{if(!v.trim())return;const c=gCosts(${cM});c.push({cat:v.trim(),items:[]});sCosts(${cM},c)},'text')"><i class="ti ti-plus" style="font-size:10px"></i> Nova categoria</button>`;
    h+=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px"><div class="rc" style="flex:1;min-width:160px;background:var(--teal);color:#fff"><div class="rl" style="color:rgba(255,255,255,.7)">Custo total</div><div class="rv" style="color:#fff">${fR(tCost)}</div></div>`;
    h+=`<div class="rc" style="flex:1;min-width:160px"><div class="rl">Receita Ad Mgr <span class="E" onclick="sM('Receita Ad Manager',${adMR},v=>{sA(${cM},'ad_mgr',v)})"><i class="ti ti-edit"></i></span></div><div class="rv">${fR(adMR)} ${dlP(adMR,adMP)}</div><div style="font-size:9px;color:var(--tx3)"><span class="E ant-edit" onclick="sM('Ad Manager — mês ant.',${adMP},v=>{sA(${pvEff},'ad_mgr',v)})">Ant: ${adMP?fR(adMP):'—'} <i class="ti ti-edit" style="font-size:9px;opacity:.45"></i></span></div></div></div></div>`;
    // Gráfico anual
    h+=areaBlock('admgr');
    h+=rAnual();
  }
  a.innerHTML=h;
}
// ===== GRÁFICO ANUAL =====
function rAnual(){
  const sites=[{k:'acessos',l:'GD Principal',c:'var(--pur)'},{k:'blog_acessos',l:'Blog GD',c:'var(--blu)'},{k:'cora_acessos',l:'CoraCora',c:'var(--cor)'}];

let _csv=null;
function importCSV(m,s,field){
  field=field||'cur';
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.csv,text/csv,application/csv';

function _csvRow(line){
  // Parser CSV robusto com suporte a campos entre aspas e delimitadores , ou ;
  const r=[];let q=false,c='';
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){q=!q;}
    else if((ch===','||ch===';')&&!q){r.push(c.trim());c='';}
    else c+=ch;
  }
  r.push(c.trim());return r;
}
function _parseGA4CSV(m,s,txt,field){
  field=field||'cur';
  // Remover BOM (UTF-8)
  if(txt.charCodeAt(0)===0xFEFF)txt=txt.slice(1);
  // Separar linhas, ignorar metadados (# ou vazias)
  const lines=txt.split('\n').map(l=>l.trim()).filter(l=>l&&!l.startsWith('#')&&!l.startsWith('"#')&&l!=='""');
  if(!lines.length){alert('CSV vazio ou sem dados reconhecíveis.');return;}
  const hdr=_csvRow(lines[0]).map(h=>h.toLowerCase().replace(/"/g,'').trim());
  const pathIdx=hdr.findIndex(h=>
    h.includes('page path')||h==='page title and screen class'||
    h.includes('caminho da p')||h.includes('pagina e classe')||h.includes('página e classe')||
    h.includes('pagina')||h.includes('página')||
    h==='url'||h==='page'||h.includes('screen')
  );
  const sessIdx=hdr.findIndex(h=>
    h==='sessions'||h==='sessões'||h==='sessoes'||
    h==='visualizações'||h==='visualizacoes'||h.includes('visualiza')||
    h.includes('session')||h.includes('sessão')
  );
  if(pathIdx===-1||sessIdx===-1){
    alert('Colunas não reconhecidas automaticamente.\n\nColunas detectadas: '+hdr.join(' | ')+'\n\nO CSV precisa ter colunas de "Page path" e "Sessions".\nDica: no GA4, exporte o relatório "Páginas e telas" (Pages and screens).');
    return;
  }
  const rows=[];
  for(let i=1;i<lines.length;i++){
    const cols=_csvRow(lines[i]);
    if(cols.length<=Math.max(pathIdx,sessIdx))continue;
    const path=(cols[pathIdx]||'').replace(/"/g,'').trim();
    const sess=parseInt((cols[sessIdx]||'0').replace(/"/g,'').replace(/[,\.]/g,'').trim())||0;
    if(!path||path.toLowerCase()==='total'||path==='(not set)'||path==='(not provided)')continue;
    rows.push({n:path,val:sess});
  }
  if(!rows.length){alert('Nenhuma página encontrada no CSV.\nVerifique se o arquivo está correto.');return;}
  _csv={m,s,field,rows:rows.slice(0,25),total:rows.length};
  const sL={gd:'Guardar Dinheiro (principal)',blog:'Blog Guardar Dinheiro',cora:'CoraCora News'};
  const fieldLabel=field==='prev'?'Mês Anterior':'Mês Atual (parcial)';
  const fieldIcon=field==='prev'?'ti-calendar-minus':'ti-file-import';
  const o=document.createElement('div');o.className='ov';o.id='ov-csv';
  o.innerHTML=`<div class="mx" style="width:540px;max-width:96vw;max-height:85vh;display:flex;flex-direction:column;gap:0">
    <h4 style="display:flex;align-items:center;gap:6px"><i class="ti ${fieldIcon}" style="color:var(--pur)"></i> Importar ${fieldLabel} — ${sL[s]}</h4>
    <p style="font-size:11px;color:var(--tx2);margin:6px 0 10px;line-height:1.5">
      <strong>${rows.length}</strong> páginas encontradas${rows.length>25?' (mostrando as 25 primeiras)':''}.
      Os valores serão salvos como <strong>${fieldLabel}</strong>.
      A tabela será ordenada por maior resultado ao confirmar.
    </p>
    <div style="overflow-y:auto;flex:1;border:1px solid var(--bd);border-radius:6px;margin-bottom:10px">
    <table style="width:100%;border-collapse:collapse;font-size:10px">
      <tr style="position:sticky;top:0">
        <th style="text-align:left;padding:5px 8px;border-bottom:1px solid var(--bd);color:var(--tx3);background:var(--bg2);font-weight:600">Página / URL</th>
        <th style="text-align:right;padding:5px 8px;border-bottom:1px solid var(--bd);color:var(--tx3);background:var(--bg2);font-weight:600">Sessões</th>
      </tr>
      ${_csv.rows.map((r,i)=>`<tr style="${i%2?'background:var(--bg2)':''}"><td style="padding:5px 8px;border-bottom:1px solid var(--bd);max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.n}</td><td style="text-align:right;padding:5px 8px;border-bottom:1px solid var(--bd);font-weight:600;font-variant-numeric:tabular-nums">${fN(r.val)}</td></tr>`).join('')}
    </table>
    </div>
    <div class="mbb">
      <button onclick="document.getElementById('ov-csv')?.remove();_csv=null">Cancelar</button>
      <button class="pr" onclick="_cfCSV()"><i class="ti ti-check" style="font-size:11px"></i> Confirmar importação</button>
    </div>
  </div>`;
  document.body.appendChild(o);
  o.addEventListener('click',e=>{if(e.target===o){o.remove();_csv=null;}});
}
function _cfCSV(){
  if(!_csv)return;
  const field=_csv.field||'cur';
  const existing=gU(_csv.m,_csv.s);
  let merged;
  if(field==='prev'){
    // Mescla: atualiza prev de URLs existentes; adiciona novas com cur=0
    merged=[...existing];
    _csv.rows.forEach(r=>{
      const found=merged.find(e=>e.n===r.n);
      if(found)found.prev=r.val;
      else merged.push({n:r.n,prev:r.val,cur:0});
    });
  }else{
    // Mescla: substitui cur, preserva prev existente
    merged=_csv.rows.map(r=>{
      const found=existing.find(e=>e.n===r.n);
      return{n:r.n,cur:r.val,prev:found?found.prev:0};
    });
    // Adiciona URLs existentes que não estão no CSV (preserva histórico)
    existing.forEach(e=>{if(!merged.find(r=>r.n===e.n))merged.push(e);});
  }
  // Ordenar por cur desc, depois prev desc
  merged.sort((a,b)=>(b.cur||0)-(a.cur||0)||(b.prev||0)-(a.prev||0));
  sU(_csv.m,_csv.s,merged);
  _csv=null;
  document.getElementById('ov-csv')?.remove();
  R();
}

function hFmt(v,fmt){if(v==null||v==='')return'—';v=Number(v);
  if(fmt==='pct')return v.toLocaleString('pt-BR',{maximumFractionDigits:2})+'%';
  if(fmt==='dec')return v.toLocaleString('pt-BR',{maximumFractionDigits:2});
  if(fmt==='money')return v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  return v.toLocaleString('pt-BR');}
function hLbl(v,fmt){if(v==null)return'';if(fmt==='int')return fN(v);if(fmt==='pct')return Number(v).toFixed(1)+'%';return Number(v).toLocaleString('pt-BR',{maximumFractionDigits:1})}
function metaOf(dsId,mk){return dsById(dsId).metrics.find(m=>m.k===mk)||{fmt:'int'}}
// Gráfico de barras único (12 meses) — Módulo 4
function hSingleChart(vals,color,fmt){
  const mx=Math.max(1,...vals.map(v=>v||0));
  const bw=30,gap=14,padL=10,padR=10,padTop=16,padBot=22,bH=120;
  const W=padL+padR+12*bw+11*gap,svgH=padTop+bH+padBot,baseY=padTop+bH;
  let bars=`<line x1="${padL}" y1="${baseY}" x2="${W-padR}" y2="${baseY}" stroke="var(--bd)" stroke-width="1"/>`;
  vals.forEach((v,i)=>{
    const x=padL+i*(bw+gap),val=v||0,bhh=val?Math.max(3,Math.round(val/mx*bH)):0,y=baseY-bhh;
    if(val)bars+=`<rect class="gb" style="animation-delay:${(i*0.025).toFixed(3)}s" x="${x}" y="${y}" width="${bw}" height="${bhh}" rx="3" fill="${color}"><title>${HMESES[i]}: ${hFmt(v,fmt)}</title></rect>`;
    else bars+=`<rect x="${x}" y="${baseY-3}" width="${bw}" height="3" rx="1.5" fill="var(--bd)"><title>${HMESES[i]}: sem dados</title></rect>`;
    if(val&&bhh>14)bars+=`<text x="${x+bw/2}" y="${y-3}" text-anchor="middle" font-size="7" fill="var(--tx2)">${hLbl(val,fmt)}</text>`;
    bars+=`<text x="${x+bw/2}" y="${baseY+12}" text-anchor="middle" font-size="8" fill="var(--tx3)">${HMESES[i]}</text>`;
  });
  return`<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${svgH}" style="width:100%;min-width:${Math.round(W*0.62)}px;height:auto;display:block">${bars}</svg></div>`;
}
// Gráfico de barras agrupadas (comparação entre anos) — Módulo 4
function hGroupChart(va,vb,ca,cb,fmt){
  const mx=Math.max(1,...va.map(v=>v||0),...vb.map(v=>v||0));
  const bw=11,ig=2,gap=12,padL=10,padR=10,padTop=16,padBot=22,bH=120,gw=bw*2+ig;
  const W=padL+padR+12*gw+11*gap,svgH=padTop+bH+padBot,baseY=padTop+bH;
  let bars=`<line x1="${padL}" y1="${baseY}" x2="${W-padR}" y2="${baseY}" stroke="var(--bd)" stroke-width="1"/>`;
  for(let i=0;i<12;i++){
    const gx=padL+i*(gw+gap);
    [[va[i],ca,0],[vb[i],cb,1]].forEach(([v,c,j])=>{
      const x=gx+j*(bw+ig),val=v||0,bhh=val?Math.max(3,Math.round(val/mx*bH)):0,y=baseY-bhh;
      if(val)bars+=`<rect class="gb" style="animation-delay:${(i*0.025+j*0.012).toFixed(3)}s" x="${x}" y="${y}" width="${bw}" height="${bhh}" rx="2" fill="${c}"><title>${HMESES[i]}: ${hFmt(v,fmt)}</title></rect>`;
      else bars+=`<rect x="${x}" y="${baseY-2}" width="${bw}" height="2" fill="var(--bd)"/>`;
    });
    bars+=`<text x="${gx+gw/2}" y="${baseY+12}" text-anchor="middle" font-size="8" fill="var(--tx3)">${HMESES[i]}</text>`;
  }
  return`<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${svgH}" style="width:100%;min-width:${Math.round(W*0.7)}px;height:auto;display:block">${bars}</svg></div>`;
}
// Indicadores inteligentes — Módulo 5
function hIndicators(y,dsId,mk){
  const meta=metaOf(dsId,mk),fmt=meta.fmt,inv=!!meta.invert;
  const vals=gDSData(y,dsId)[mk]||[];
  const filled=vals.map((v,i)=>({v,i})).filter(o=>o.v!=null&&o.v!=='');
  const card=(ic,lbl,val,sub)=>`<div class="ic"><div class="il"><span>${ic}</span> ${lbl}</div><div class="iv">${val}</div>${sub?`<div class="is">${sub}</div>`:''}</div>`;
  if(!filled.length)return`<div class="ind">${card('🏆','Melhor mês','—')}${card('📉','Pior mês','—')}${card('📈','Crescimento acumulado','—')}${card('📊','Média mensal','—')}${card('📅','Último mês preenchido','—')}</div>`;
  const best=inv?filled.reduce((a,b)=>b.v<a.v?b:a):filled.reduce((a,b)=>b.v>a.v?b:a);
  const worst=inv?filled.reduce((a,b)=>b.v>a.v?b:a):filled.reduce((a,b)=>b.v<a.v?b:a);
  const first=filled[0],last=filled[filled.length-1];
  const delta=last.v-first.v,growth=first.v?(delta/Math.abs(first.v)*100):0;
  const improved=inv?delta<0:delta>0;const gc=improved?'var(--grn)':(delta===0?'var(--amb)':'var(--red)'),ar=delta>=0?'▲':'▼';
  const avg=filled.reduce((s,o)=>s+o.v,0)/filled.length;
  return`<div class="ind">
    ${card('🏆','Melhor mês',HMESES[best.i],hFmt(best.v,fmt))}
    ${card('📉','Pior mês',HMESES[worst.i],hFmt(worst.v,fmt))}
    ${card('📈','Crescimento acumulado',`<span style="color:${gc}">${growth>=0?'+':''}${growth.toFixed(0)}% ${ar}</span>`,`${HMESES[first.i]} → ${HMESES[last.i]}`)}
    ${card('📊','Média mensal',hFmt(fmt==='int'?Math.round(avg):avg,fmt),`${filled.length} ${filled.length===1?'mês':'meses'} preenchido${filled.length===1?'':'s'}`)}
    ${card('📅','Último mês preenchido',HMESES[last.i],hFmt(last.v,fmt))}
  </div>`;
}

  h+=hGroupChart(gDSData(hCmpA,hDS)[hMetric]||[],gDSData(hCmpB,hDS)[hMetric]||[],'var(--pur)','var(--cor)',fmt)+`</div>`;
  return h;

// ===== Importação CSV/XLSX (validação + prévia + modo de mesclagem) =====
let _himp=null,_xlsxP=null;
function loadXLSX(){if(window.XLSX)return Promise.resolve(window.XLSX);if(_xlsxP)return _xlsxP;_xlsxP=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=()=>res(window.XLSX);s.onerror=()=>rej(new Error('Não foi possível carregar o leitor de XLSX. Verifique a conexão.'));document.head.appendChild(s)});return _xlsxP}
function hMatchMetric(ds,label){label=(label==null?'':label).toString().toLowerCase().replace(/"/g,'').trim();if(!label)return null;
  for(const m of ds.metrics){if(label===m.l.toLowerCase()||label===m.k)return m.k;}
  for(const m of ds.metrics){if((m.al||[]).some(a=>label.includes(a)))return m.k;}
  return null;}
function hNumParse(raw){if(raw==null)return null;let s=String(raw).replace(/"/g,'').trim();if(s===''||s==='—')return null;s=s.replace(/[^\d.,-]/g,'');if(s===''||s==='-')return null;
  if(s.indexOf(',')>-1&&s.indexOf('.')>-1)s=s.replace(/\./g,'').replace(',','.');
  else if((s.match(/\./g)||[]).length>1)s=s.replace(/\./g,'');
  else s=s.replace(',','.');
  const v=parseFloat(s);return isNaN(v)?null:v}
function hImport(y,dsId){
  const inp=document.createElement('input');inp.type='file';inp.accept='.csv,.xlsx,.xls,text/csv';
  inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const ext=(f.name.split('.').pop()||'').toLowerCase();
    if(ext==='xlsx'||ext==='xls'){loadXLSX().then(XLSX=>{const rd=new FileReader();rd.onload=ev=>{try{const wb=XLSX.read(ev.target.result,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});hPreviewImport(y,dsId,rows,f.name)}catch(err){toast('Falha ao ler o XLSX: '+err.message,'ti-alert-circle')}};rd.readAsArrayBuffer(f)}).catch(err=>toast(err.message,'ti-alert-circle'))}
    else{const rd=new FileReader();rd.onload=ev=>{let txt=ev.target.result;if(txt.charCodeAt(0)===0xFEFF)txt=txt.slice(1);const rows=txt.split(/\r?\n/).filter(l=>l.trim()&&!l.trim().startsWith('#')).map(l=>_csvRow(l));hPreviewImport(y,dsId,rows,f.name)};rd.readAsText(f,'UTF-8')}
  };
  inp.click();
}
function hPreviewImport(y,dsId,rows,fname){
  const ds=dsById(dsId);
  if(!rows||!rows.length){toast('Arquivo vazio ou ilegível.','ti-alert-circle');return;}
  const parsed={};let invalid=0;
  rows.forEach(cols=>{if(!cols||!cols.length)return;const mk=hMatchMetric(ds,cols[0]);if(!mk||parsed[mk])return;
    const nums=[];for(let i=1;i<cols.length&&nums.length<12;i++){const raw=cols[i];const v=hNumParse(raw);const rs=(raw==null?'':String(raw)).trim();if(v==null&&rs!==''&&rs!=='—')invalid++;nums.push(v);}
    while(nums.length<12)nums.push(null);parsed[mk]=nums;});
  const found=Object.keys(parsed);
  if(!found.length){toast('Nenhuma métrica de "'+ds.l+'" reconhecida no arquivo. Baixe o modelo para ver o formato.','ti-alert-circle');return;}
  hImpMode='replace';_himp={y,dsId,parsed,invalid};
  let prev=`<table style="width:100%;border-collapse:collapse;font-size:10px"><tr><th style="text-align:left;padding:5px 8px;border-bottom:1px solid var(--bd);background:var(--bg2);color:var(--tx3);font-weight:600;position:sticky;left:0">${dsId==='aquis'?'Origem':'Métrica'}</th>${HMESES.map(m=>`<th style="text-align:right;padding:5px 4px;border-bottom:1px solid var(--bd);background:var(--bg2);color:var(--tx3);font-weight:600">${m}</th>`).join('')}</tr>`;
  ds.metrics.forEach(mt=>{if(!parsed[mt.k])return;prev+=`<tr><td style="padding:4px 8px;border-bottom:1px solid var(--bd);font-weight:500;white-space:nowrap">${mt.l}</td>${parsed[mt.k].map(v=>`<td style="text-align:right;padding:4px;border-bottom:1px solid var(--bd);font-variant-numeric:tabular-nums">${v==null?'<span style="color:var(--tx3)">—</span>':hLbl(v,mt.fmt)}</td>`).join('')}</tr>`;});
  prev+=`</table>`;
  const radio=(val,lbl,desc)=>`<label style="display:flex;gap:7px;align-items:flex-start;padding:7px 9px;border:1px solid var(--bd);border-radius:7px;cursor:pointer;font-size:11px"><input type="radio" name="himpmode" value="${val}" ${hImpMode===val?'checked':''} onchange="hImpMode=this.value" style="margin-top:2px;width:auto"><span><strong>${lbl}</strong><br><span style="color:var(--tx2);font-size:10px">${desc}</span></span></label>`;
  const o=document.createElement('div');o.className='ov';o.id='ov-himp';
  o.innerHTML=`<div class="mx" style="width:600px;max-width:96vw;max-height:88vh;display:flex;flex-direction:column">
    <h4 style="display:flex;align-items:center;gap:6px"><i class="ti ti-upload" style="color:var(--pur)"></i> Importar — ${ds.l} · ${y}</h4>
    <p style="font-size:11px;color:var(--tx2);margin:6px 0 8px;line-height:1.5"><strong>${found.length}</strong> métrica(s) reconhecida(s) em <em>${(fname||'arquivo')}</em>.${invalid?` <span style="color:var(--amb)"><i class="ti ti-alert-triangle" style="font-size:11px"></i> ${invalid} valor(es) não numérico(s) foram ignorados.</span>`:''}</p>
    <div style="overflow:auto;border:1px solid var(--bd);border-radius:6px;margin-bottom:10px;max-height:34vh">${prev}</div>
    <div style="font-size:10px;font-weight:600;color:var(--tx2);margin-bottom:5px">Como deseja importar?</div>
    <div style="display:grid;grid-template-columns:1fr;gap:5px;margin-bottom:11px">
      ${radio('replace','Substituir dados existentes','Sobrescreve as métricas enviadas (meses em branco no arquivo ficam vazios).')}
      ${radio('add','Adicionar aos dados existentes','Soma os valores do arquivo aos já cadastrados, mês a mês.')}

    </div>

  </div>`;
  document.body.appendChild(o);
  o.addEventListener('click',e=>{if(e.target===o){o.remove();_himp=null;}});
}
function hApplyImport(){
  if(!_himp)return;const{y,dsId,parsed}=_himp,mode=hImpMode;const d=gDSData(y,dsId);let n=0;
  Object.keys(parsed).forEach(k=>{const inc=parsed[k];const cur=Array.isArray(d[k])?d[k].slice():Array(12).fill(null);
    if(mode==='add')d[k]=cur.map((c,i)=>inc[i]==null?(c==null?null:c):((Number(c)||0)+Number(inc[i])));

// Download de modelo (CSV) — Módulo "Baixar Modelo"
function hDownloadModel(dsId,y){

// ===== ENTRADA DE DADOS NAS SEÇÕES DO DASHBOARD (Opção 1) =====
let dMetric={},_man=null;
const AQCOLORS=['#534AB7','#1D9E75','#D85A30','#378ADD','#BA7517','#E24B4A','#0F6E56','#9B59B6','#7A8087'];
function ensureDMetric(dsId){const ds=dsById(dsId);if(!dMetric[dsId]||!ds.metrics.some(m=>m.k===dMetric[dsId]))dMetric[dsId]=ds.metrics[0].k}

function entryBar(dsId){return ` <span class="ebar"><span class="elab">Dados anuais ${hYear}</span><button class="ebtn" title="✍️ Inserir manualmente" onclick="hManualModal('${dsId}')"><i class="ti ti-edit"></i></button><button class="ebtn" title="📤 Importar arquivo (CSV/XLSX)" onclick="hImport(hYear,'${dsId}')"><i class="ti ti-upload"></i></button><button class="ebtn" title="📥 Baixar modelo" onclick="hDownloadModel('${dsId}',hYear)"><i class="ti ti-download"></i></button></span>`}
// Gráfico de linhas — uma linha por origem (exceção à regra, só Aquisição)
function hLineChart(series){
  const flat=series.flatMap(s=>(s.vals||[]).filter(v=>v!=null));
  const mx=Math.max(1,...flat.map(v=>v||0));
  const n=12,step=42,padL=40,padR=12,padTop=14,plotH=140,padBot=24;
  const W=padL+padR+(n-1)*step,baseY=padTop+plotH,svgH=padTop+plotH+padBot;
  const X=i=>padL+i*step,Y=v=>baseY-(v/mx)*plotH;
  let grid='';for(let g=0;g<=4;g++){const gy=baseY-(g/4)*plotH,gv=Math.round(mx*g/4);grid+=`<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="var(--bd)" stroke-width="1" opacity=".5"/><text x="${padL-4}" y="${gy+3}" text-anchor="end" font-size="7" fill="var(--tx3)">${fN(gv)}</text>`;}
  let xlab='';for(let i=0;i<n;i++)xlab+=`<text x="${X(i)}" y="${baseY+13}" text-anchor="middle" font-size="8" fill="var(--tx3)">${HMESES[i]}</text>`;
  let lines='';
  series.forEach(s=>{const pts=[];(s.vals||[]).forEach((v,i)=>{if(v!=null)pts.push([X(i),Y(v),i,v]);});
    if(pts.length>1)lines+=`<polyline fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p=>p[0]+','+p[1]).join(' ')}"/>`;
    pts.forEach(p=>lines+=`<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="${s.color}"><title>${s.label} — ${HMESES[p[2]]}: ${fN(p[3])}</title></circle>`);
  });
  const legend=series.map(s=>`<span style="font-size:9px;display:inline-flex;align-items:center;gap:3px;color:var(--tx2)"><i style="width:11px;height:2px;border-radius:1px;background:${s.color};display:inline-block"></i>${s.label}</span>`).join('');
  return`<div style="display:flex;gap:6px 10px;flex-wrap:wrap;margin-bottom:6px">${legend}</div><div style="overflow-x:auto"><svg class="lf" viewBox="0 0 ${W} ${svgH}" style="width:100%;min-width:${Math.round(W*0.8)}px;height:auto;display:block">${grid}${xlab}<line x1="${padL}" y1="${baseY}" x2="${W-padR}" y2="${baseY}" stroke="var(--bd2)" stroke-width="1"/>${lines}</svg></div>`;
}

  h+=`</tbody></table></div>`;
  h+=`<div class="mbb"><button onclick="document.getElementById('ov-man')?.remove();_man=null;R()">Fechar</button><button onclick="hImport('${y}','${dsId}')"><i class="ti ti-upload" style="font-size:11px"></i> Importar</button><button onclick="hDownloadModel('${dsId}','${y}')"><i class="ti ti-download" style="font-size:11px"></i> Modelo</button><button class="pr" onclick="document.getElementById('ov-man')?.remove();_man=null;aT='hist';hDS='${dsId}';hYear='${y}';ensureMetric(true);R()"><i class="ti ti-chart-bar" style="font-size:11px"></i> Ver no Histórico</button></div>`;

  var metasCard='<div class="an-card"><div class="an-card-hd"><div class="an-card-ttl"><i class="ti ti-target"></i> Metas do mês</div><div class="an-card-sub">Ritmo do mês corrente projetado · ordenadas por risco</div></div>'+metasBody+'</div>';

function hProximasEntregas(){
  var today=new Date();
  var todayY=today.getFullYear(),todayMo=today.getMonth(),todayD=today.getDate();
  var upcoming=[];
  for(var mi=cM;mi<Math.min(cM+2,MO.length);mi++){
    var mm=MO[mi];
    var days=[...allDays(mi)].sort(function(a,b){return a-b;});
    days.forEach(function(d){
      var isCurrentMonth=mi===cM;
      var isPast=isCurrentMonth&&(mm.y<todayY||(mm.y===todayY&&mm.mo<todayMo)||(mm.y===todayY&&mm.mo===todayMo&&d<todayD));
      if(isPast)return;
      var tk=gTk(mi,d);
      if(!tk.length)return;
      var doneCount=tk.filter(function(_,i){return cT[K(mi,d,i)];}).length;
      var pendingCount=tk.length-doneCount;
      if(pendingCount>0){
        upcoming.push({mi:mi,d:d,tt:gTt(mi,d),tg:gTg(mi,d),tl:gTl(mi,d),pending:pendingCount,total:tk.length,done:doneCount,mo:mm.mo,y:mm.y});
      }
    });
  }
  upcoming=upcoming.slice(0,6);
  if(!upcoming.length){
    return `<div class="sh-section"><div class="sh-hdr"><i class="ti ti-list-check" style="color:var(--primary)"></i><span>Próximas Entregas</span></div><div class="empty-sm"><i class="ti ti-check-all"></i><p>Nenhuma entrega pendente</p></div></div>`;
  }
  var items=upcoming.map(function(u){
    var pct=u.total>0?Math.round(u.done/u.total*100):0;
    var dateStr=String(u.d).padStart(2,'0')+'/'+String(u.mo+1).padStart(2,'0');
    var barColor=pct>=80?'var(--success)':pct>=40?'var(--primary)':'var(--warning)';
    return `<div class="pe-item">
      <div class="pe-date">${dateStr}</div>
      <div class="pe-info">
        <div class="pe-title">${u.tt||'Atividade'}</div>
        <span class="ct t-${u.tg}" style="font-size:9px;padding:1px 6px;border-radius:3px">${u.tl}</span>
      </div>
      <div class="pe-right">
        <span style="font-size:10px;color:var(--text-secondary)">${u.done}/${u.total}</span>
        <div class="sh-bar" style="width:64px"><div class="sh-bar-fill" style="width:${pct}%;background:${barColor}"></div></div>

// GA4 Parser
function parseGA4AcqCSV(txt){
  var sm=txt.match(/Data de in[^:]*:\s*(\d{8})/i);
  var year=String(new Date().getFullYear()),moIdx=-1;
  if(sm){year=sm[1].substring(0,4);moIdx=parseInt(sm[1].substring(4,6))-1;}
  var lines=txt.split(/\r?\n/).filter(function(l){return l.trim()&&l.trim()[0]!=='#';});
  if(!lines.length)return{error:'Arquivo vazio.'};
  var hdr=_csvRow(lines[0]).map(function(h){return h.replace(/"/g,'').trim().toLowerCase();});
  var sesIdx=-1;
  for(var hi=1;hi<hdr.length;hi++){if(/^sess/i.test(hdr[hi].replace(/[õê]/g,function(c){return c==='õ'?'o':'e';}))){sesIdx=hi;break;}}
  if(sesIdx<0)return{error:'Coluna "Sessões" não encontrada.'};
  var cMap={'organic search':'organic_search','direct':'direct','unassigned':'unassigned',
    'referral':'referral','organic social':'organic_social','paid search':'paid_search',
    'organic video':'organic_video','email':'email','outros':'outros','other':'outros',
    '(other)':'outros','busca orgânica':'organic_search','social orgânico':'organic_social',
    'não atribuído':'unassigned','busca paga':'paid_search'};
  var rows=[];
  for(var i=1;i<lines.length;i++){
    var cols=_csvRow(lines[i]);if(!cols||!cols.length)continue;
    var raw=(cols[0]||'').replace(/"/g,'').trim();
    var chave=cMap[raw.toLowerCase()]||null;if(!chave)continue;
    var val=hNumParse(cols[sesIdx]);
    var meses=[];for(var m=0;m<12;m++)meses.push(m===moIdx&&val!=null?val:'');
    rows.push([chave].concat(meses));
  }
  if(!rows.length)return{error:'Nenhum canal GA4 reconhecido.'};
  return{year:year,rows:rows,moIdx:moIdx};
}

function hImport(y,dsId){
  var inp=document.createElement('input');inp.type='file';inp.accept='.csv,.xlsx,.xls,text/csv';
  inp.onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    var ext=(f.name.split('.').pop()||'').toLowerCase();
    if(ext==='xlsx'||ext==='xls'){
      loadXLSX().then(function(XLSX){var rd=new FileReader();rd.onload=function(ev){try{var wb=XLSX.read(ev.target.result,{type:'array'});var ws=wb.Sheets[wb.SheetNames[0]];var rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});hPreviewImport(y,dsId,rows,f.name);}catch(err){toast('Falha XLSX: '+err.message,'ti-alert-circle');}};rd.readAsArrayBuffer(f);}).catch(function(err){toast(err.message,'ti-alert-circle');});
    } else {
      var rd=new FileReader();
      rd.onload=function(ev){
        var txt=ev.target.result;if(txt.charCodeAt(0)===0xFEFF)txt=txt.slice(1);
        if(dsId==='aquis'&&/Data de in[^:]*:/i.test(txt)){
          var res=parseGA4AcqCSV(txt);
          if(res.error){toast(res.error,'ti-alert-circle');return;}
          hPreviewImport(res.year||y,dsId,res.rows,f.name);
        } else {
          var rows=txt.split(/\r?\n/).filter(function(l){return l.trim()&&l.trim()[0]!=='#';}).map(function(l){return _csvRow(l);});
          hPreviewImport(y,dsId,rows,f.name);
        }
      };
      rd.readAsText(f,'UTF-8');
    }
  };
  inp.click();
}
