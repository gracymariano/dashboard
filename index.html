<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardar Dinheiro — Dashboard & Projetos Ecossistema</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root{--bg:#FAFAF8;--bg2:#F2F1ED;--bg3:#fff;--tx:#1a1a1a;--tx2:#6b6b6b;--tx3:#999;--bd:rgba(0,0,0,.1);--bd2:rgba(0,0,0,.18);--pur:#534AB7;--grn:#1D9E75;--cor:#D85A30;--blu:#378ADD;--amb:#BA7517;--red:#E24B4A;--teal:#0F6E56}
@media(prefers-color-scheme:dark){:root{--bg:#141414;--bg2:#1e1e1e;--bg3:#232323;--tx:#e8e8e8;--tx2:#999;--tx3:#666;--bd:rgba(255,255,255,.08);--bd2:rgba(255,255,255,.15)}}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:15px}
.C{max-width:1060px;margin:0 auto;padding:1.25rem}
.H{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:.75rem}
.HL{display:flex;align-items:center;gap:14px}.logo{height:52px}
.HL h1{font-family:Arial,sans-serif;font-size:21px;font-weight:700}.HL p{font-size:12px;color:var(--tx2);margin-top:1px}
.HR{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.sb{font-size:10px;color:var(--tx3);background:var(--bg2);padding:4px 9px;border-radius:5px;display:flex;align-items:center;gap:3px}
.hb{font-size:10px;padding:4px 9px;border-radius:5px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx2);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:3px}.hb:hover{border-color:var(--bd2)}
.tabs{display:flex;gap:0;margin-bottom:.75rem;border-bottom:1px solid var(--bd);overflow-x:auto}
.tb{padding:8px 16px;font-size:12px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--tx2);border-bottom:2px solid transparent;transition:.15s;font-family:inherit;white-space:nowrap}.tb:hover{color:var(--tx)}.tb.a{color:var(--pur);border-bottom-color:var(--pur)}
.mn{display:flex;gap:5px;margin-bottom:.7rem;flex-wrap:wrap}
.mb{padding:5px 13px;border-radius:7px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid var(--bd);background:var(--bg3);color:var(--tx2);transition:.15s;font-family:inherit}.mb:hover{border-color:var(--bd2)}.mb.a{background:var(--pur);color:#fff;border-color:var(--pur)}.mb .p{font-size:9px;opacity:.7;margin-left:2px}
.S{margin-bottom:1.1rem}.ST{font-size:11px;font-weight:700;color:var(--tx2);margin-bottom:7px;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.G{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:8px}
.D{background:var(--bg3);border:1px solid var(--bd);border-radius:10px;padding:11px 13px}
.D .L{font-size:10px;color:var(--tx3);margin-bottom:4px;display:flex;align-items:center;justify-content:space-between}
.D .L .E{cursor:pointer;font-size:12px;color:var(--tx3);transition:.15s}.D .L .E:hover{color:var(--pur)}
.D .V{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}.D .R{font-size:20px;font-weight:600}.D .M{font-size:20px;font-weight:600;color:var(--tx)}
.D .Su{font-size:11px;color:var(--tx3)}
.B{height:4px;background:var(--bd);border-radius:2px;margin-top:6px;overflow:hidden}.BF{height:100%;border-radius:2px;transition:width .4s}
.Bp{font-size:9px;color:var(--tx2);margin-top:3px;text-align:right}
.vd{font-size:10px;font-weight:700;margin-left:4px;display:inline-flex;align-items:center}
.vu{color:var(--grn)}.vw{color:var(--red)}.vm{color:var(--amb)}
.ptabs{display:flex;gap:5px;margin-bottom:.9rem;flex-wrap:wrap}
.ptb{padding:5px 16px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--bd);background:var(--bg3);color:var(--tx2);transition:.15s;font-family:inherit}.ptb:hover{border-color:var(--pur);color:var(--pur)}.ptb.a{background:var(--pur);color:#fff;border-color:var(--pur)}
.ant-edit{cursor:pointer;font-size:9px;color:var(--tx3)}.ant-edit:hover{color:var(--pur)}
.rg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px}
.rc{background:var(--bg2);border-radius:8px;padding:9px 11px}
.rc .rl{font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:.3px;display:flex;align-items:center;justify-content:space-between}
.rc .rl .E{cursor:pointer;font-size:11px;color:var(--tx3)}
.rc .rv{font-size:15px;font-weight:600;margin-top:2px}
/* Table */
.T{width:100%;border-collapse:collapse;font-size:10px;margin-top:3px}
.T th{text-align:left;padding:4px 6px;font-size:9px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--bd);background:var(--bg2)}
.T th:not(:first-child){text-align:right}.T td{padding:5px 6px;border-bottom:1px solid var(--bd)}.T td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
.T tr:hover{background:var(--bg2)}.T .un{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Phase */
.PB{display:flex;align-items:center;gap:9px;margin-bottom:.6rem;padding:9px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--bg3)}
.PI{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.PF{flex:1}.PF .PN{font-size:12px;font-weight:500}.PF .PD{font-size:10px;color:var(--tx2)}
.PW{display:flex;align-items:center;gap:6px;margin-top:3px}.PWB{flex:1;height:3px;background:var(--bd);border-radius:2px;overflow:hidden}.PWF{height:100%;border-radius:2px;transition:width .4s}.PWP{font-size:9px;color:var(--tx2);min-width:24px;text-align:right;font-weight:500}
.leg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:.6rem}.leg span{font-size:9px;display:flex;align-items:center;gap:3px;color:var(--tx2)}.leg span i{width:6px;height:6px;border-radius:2px;display:inline-block}
/* Calendar */
.cg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:.75rem}
.ch{font-size:9px;font-weight:600;color:var(--tx3);text-align:center;padding:3px 0;text-transform:uppercase;letter-spacing:.4px}
.cd{border-radius:6px;padding:5px;min-height:76px;cursor:pointer;border:1px solid var(--bd);background:var(--bg3);transition:.15s;position:relative}
.cd:hover{border-color:var(--bd2);transform:translateY(-1px)}.cd.sl{border-color:var(--pur);border-width:2px}
.cd .cn{font-size:9px;font-weight:500;margin-bottom:2px}.cd .ct{font-size:7px;padding:1px 4px;border-radius:3px;display:inline-block;margin-bottom:2px;font-weight:500}
.cd .ck{font-size:8px;color:var(--tx2);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cd .cx{position:absolute;top:4px;right:4px;width:13px;height:13px;border-radius:50%;border:1.5px solid var(--bd2);display:flex;align-items:center;justify-content:center;font-size:7px;cursor:pointer;background:var(--bg3);transition:.15s}
.cd .cx:hover{border-color:var(--grn)}.cd .cx.xd{background:var(--grn);border-color:var(--grn);color:#fff}.cd.ad{opacity:.5}
.ce{opacity:.28;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;border-style:dashed}.ce:hover{opacity:.55;border-color:var(--pur)}.ce .ah{color:var(--tx3);margin-top:5px;font-size:11px}
/* Tags */
.t-seo{background:#E6F1FB;color:#0C447C}.t-conteudo{background:#EEEDFE;color:#3C3489}.t-pinterest{background:#FBEAF0;color:#72243E}.t-comercial{background:#FAEEDA;color:#633806}.t-dados{background:#EAF3DE;color:#27500A}.t-produto{background:#FAECE7;color:#712B13}.t-ads{background:#FCEBEB;color:#791F1F}.t-planejamento{background:#F1EFE8;color:#444441}
@media(prefers-color-scheme:dark){.t-seo{background:#0C447C;color:#B5D4F4}.t-conteudo{background:#3C3489;color:#CECBF6}.t-pinterest{background:#72243E;color:#F4C0D1}.t-comercial{background:#633806;color:#FAC775}.t-dados{background:#27500A;color:#C0DD97}.t-produto{background:#712B13;color:#F5C4B3}.t-ads{background:#791F1F;color:#F7C1C1}.t-planejamento{background:#444441;color:#D3D1C7}}
/* Detail */
.dp{border-radius:8px;border:1px solid var(--bd);background:var(--bg3);padding:.7rem .9rem;margin-bottom:.6rem;animation:si .2s ease}
@keyframes si{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.dp h3{font-size:13px;font-weight:500;margin-bottom:2px}.dp .dd{font-size:10px;color:var(--tx2);margin-bottom:7px;padding-bottom:7px;border-bottom:1px solid var(--bd)}
.cl{list-style:none}.cl li{display:flex;align-items:flex-start;gap:6px;padding:4px 0;font-size:11px;border-bottom:1px solid var(--bd);transition:.15s}.cl li:last-child{border-bottom:none}
.cl li .cb{width:15px;height:15px;border-radius:3px;border:1.5px solid var(--bd2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:8px;flex-shrink:0;margin-top:1px;background:var(--bg3);transition:.15s}
.cl li .cb:hover{border-color:var(--grn)}.cl li .cb.xd{background:var(--grn);border-color:var(--grn);color:#fff}
.cl li.td span{text-decoration:line-through;color:var(--tx3)}
.ta{display:flex;gap:3px;opacity:0;transition:.15s;flex-shrink:0}.cl li:hover .ta{opacity:1}
.ab{display:flex;align-items:center;gap:4px;margin-top:6px;padding:5px 10px;border-radius:6px;border:1px dashed var(--bd2);background:none;color:var(--tx2);font-size:11px;font-family:inherit;cursor:pointer;width:100%;transition:.15s}.ab:hover{border-color:var(--pur);color:var(--pur);background:var(--bg2)}
/* Costs */
.ct{width:100%;border-collapse:collapse;font-size:10px}.ct th{text-align:left;padding:4px 7px;font-size:9px;font-weight:600;color:#fff;background:var(--teal)}
.ct th:first-child{border-radius:4px 0 0 0}.ct th:last-child{border-radius:0 4px 0 0;text-align:right}
.ct td{padding:5px 7px;border-bottom:1px solid var(--bd)}.ct td:last-child{text-align:right;font-weight:500}
.ct .su td{color:var(--teal);font-weight:600;border-bottom:2px solid var(--teal)}.ct .to td{background:var(--teal);color:#fff;font-weight:500;font-size:11px}
/* Pricing rules */
.pr-tbl{width:100%;border-collapse:collapse;font-size:10px;margin-top:4px}.pr-tbl th{text-align:left;padding:4px 6px;font-size:9px;font-weight:600;color:var(--tx3);border-bottom:1px solid var(--bd);background:var(--bg2)}
.pr-tbl td{padding:5px 6px;border-bottom:1px solid var(--bd)}.pr-tbl td[contenteditable]{cursor:text}.pr-tbl select{font-size:10px;padding:2px 4px;border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--tx);font-family:inherit}
/* Saz */
.zm{margin-bottom:1rem}.zmh{font-size:13px;font-weight:500;margin-bottom:5px;display:flex;align-items:center;gap:5px}
.zg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:5px}
.zc{background:var(--bg3);border:1px solid var(--bd);border-radius:6px;padding:7px 9px}
.zc .zt{font-size:7px;padding:1px 4px;border-radius:3px;display:inline-block;margin-bottom:2px;font-weight:500}.zc .zn{font-size:11px;font-weight:500;margin-bottom:1px}.zc .zd{font-size:9px;color:var(--tx2);line-height:1.3}
.st-feriado{background:#FCEBEB;color:#791F1F}.st-comercial{background:#FAEEDA;color:#633806}.st-comportamento{background:#EEEDFE;color:#3C3489}.st-financeiro{background:#EAF3DE;color:#27500A}.st-viagem{background:#E6F1FB;color:#0C447C}
@media(prefers-color-scheme:dark){.st-feriado{background:#791F1F;color:#F7C1C1}.st-comercial{background:#633806;color:#FAC775}.st-comportamento{background:#3C3489;color:#CECBF6}.st-financeiro{background:#27500A;color:#C0DD97}.st-viagem{background:#0C447C;color:#B5D4F4}}
/* Modal */
.ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:1000;animation:fi .15s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.mx{background:var(--bg3);border-radius:10px;padding:1.1rem;width:330px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.mx h4{font-size:13px;font-weight:500;margin-bottom:8px}
.mx input,.mx select{width:100%;padding:6px 9px;border:1px solid var(--bd2);border-radius:6px;font-size:12px;font-family:inherit;background:var(--bg);color:var(--tx);margin-bottom:6px}
.mx .mbb{display:flex;gap:5px;justify-content:flex-end}
.mx button{padding:4px 12px;border-radius:5px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-family:inherit;transition:.15s}
.mx button.pr{background:var(--pur);color:#fff;border-color:var(--pur)}.mx button:hover{opacity:.85}
/* Classification badge select */
.cls-sel{font-size:9px;padding:1px 4px;border:1px solid var(--bd);border-radius:3px;background:var(--bg);color:var(--tx);font-family:inherit;cursor:pointer;margin-left:4px}
/* Cora Cora Editorial */
.cc-stats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.7rem}.cc-st{background:var(--bg3);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;flex:1;min-width:110px}.cc-st .sl{font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:.3px}.cc-st .sv{font-size:18px;font-weight:700;margin-top:2px}.cc-st .ss{font-size:9px;color:var(--tx3)}
.cc-fil{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:.7rem}.cc-fb{padding:4px 10px;border-radius:14px;font-size:10px;font-weight:500;cursor:pointer;border:1px solid var(--bd);background:var(--bg3);color:var(--tx2);font-family:inherit;transition:.15s}.cc-fb:hover{border-color:var(--pur);color:var(--pur)}.cc-fb.a{background:#D85A30;color:#fff;border-color:#D85A30}
.cc-cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:.7rem}
.cc-ch{font-size:8px;font-weight:600;color:var(--tx3);text-align:center;padding:3px 0;text-transform:uppercase;letter-spacing:.3px}
.cc-cd{border-radius:5px;padding:4px;min-height:70px;border:1px solid var(--bd);background:var(--bg3);position:relative;transition:.15s}.cc-cd:hover{border-color:#D85A30}
.cc-cd.emp{opacity:.25;border-style:dashed}.cc-cd .dn{font-size:8px;font-weight:600;margin-bottom:2px}
.cc-pk{font-size:7px;padding:2px 4px;border-radius:3px;margin-bottom:2px;line-height:1.2;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:default}
.cc-pk:hover{white-space:normal}
.cc-pk.cm{background:#FBEAF0;color:#72243E}.cc-pk.ca{background:#EEEDFE;color:#3C3489}.cc-pk.cb{background:#EAF3DE;color:#27500A}.cc-pk.cr{background:#FCEBEB;color:#791F1F}.cc-pk.ce{background:#E6F1FB;color:#0C447C}.cc-pk.cl{background:#FAEEDA;color:#633806}.cc-pk.c35{background:#E0F2F1;color:#00695C}.cc-pk.cc{background:#FFF8E1;color:#F57F17}
@media(prefers-color-scheme:dark){.cc-pk.cm{background:#72243E;color:#F4C0D1}.cc-pk.ca{background:#3C3489;color:#CECBF6}.cc-pk.cb{background:#27500A;color:#C0DD97}.cc-pk.cr{background:#791F1F;color:#F7C1C1}.cc-pk.ce{background:#0C447C;color:#B5D4F4}.cc-pk.cl{background:#633806;color:#FAC775}.cc-pk.c35{background:#00695C;color:#B2DFDB}.cc-pk.cc{background:#F57F17;color:#FFF8E1}}
.cc-tbl{width:100%;border-collapse:collapse;font-size:10px;margin-top:4px}.cc-tbl th{text-align:left;padding:4px 6px;font-size:9px;font-weight:600;color:#fff;background:#D85A30}.cc-tbl th:first-child{border-radius:4px 0 0 0}.cc-tbl th:last-child{border-radius:0 4px 0 0}
.cc-tbl td{padding:5px 6px;border-bottom:1px solid var(--bd)}.cc-tbl tr:hover td{background:var(--bg2)}
.cc-tabs{display:flex;gap:4px;margin-bottom:.6rem}.cc-tb{padding:5px 14px;border-radius:14px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid var(--bd);background:var(--bg3);color:var(--tx2);font-family:inherit;transition:.15s}.cc-tb:hover{border-color:#D85A30;color:#D85A30}.cc-tb.a{background:#D85A30;color:#fff;border-color:#D85A30}
.footer{text-align:center;padding:1rem 0 .5rem;font-size:9px;color:var(--tx3)}
@media(max-width:700px){.C{padding:.75rem}.cg{gap:2px}.cd{padding:4px;min-height:64px}.G{grid-template-columns:1fr 1fr}.rg{grid-template-columns:1fr 1fr}.D .R,.D .M{font-size:17px}.rc .rv{font-size:13px}.tabs{-webkit-overflow-scrolling:touch}.T th,.T td{padding:4px 5px;font-size:9px}.ST{font-size:10px}.HL h1{font-size:17px}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
/* ===== FEATURE 01: Top Páginas controls + Histórico ===== */
.tpc{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:7px}
.fsel{font-size:11px;padding:4px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg3);color:var(--tx);font-family:inherit;cursor:pointer}
.fsel:hover{border-color:var(--bd2)}
.dirb{padding:4px 9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg3);color:var(--tx2);font-family:inherit;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:3px;transition:.15s}.dirb:hover{border-color:var(--pur);color:var(--pur)}
.dgr{color:var(--red)!important;border-color:var(--red)!important}.mx button.dgr{background:var(--red);color:#fff;border-color:var(--red)}
/* Histórico editable table */
.hwrap{overflow-x:auto;border:1px solid var(--bd);border-radius:8px}
.htbl{width:100%;border-collapse:collapse;font-size:10px;min-width:640px}
.htbl th{padding:5px 4px;font-size:9px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--bd);background:var(--bg2);text-align:center}
.htbl th:first-child{text-align:left;padding-left:9px;position:sticky;left:0;background:var(--bg2);z-index:1}
.htbl td{padding:0;border-bottom:1px solid var(--bd);text-align:center}
.htbl td:first-child{padding:5px 9px;font-weight:500;color:var(--tx);text-align:left;white-space:nowrap;position:sticky;left:0;background:var(--bg3);z-index:1}
.htbl tr:nth-child(even) td:first-child{background:var(--bg2)}
.htbl tr:nth-child(even){background:var(--bg2)}
.hin{width:100%;min-width:42px;border:none;background:transparent;color:var(--tx);font-family:inherit;font-size:10px;text-align:center;padding:6px 2px;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.hin::-webkit-outer-spin-button,.hin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.hin:focus{outline:none;background:var(--pur);color:#fff;border-radius:3px}
.hin::placeholder{color:var(--tx3);opacity:.5}
/* Smart indicator cards */
.ind{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.ind .ic{background:var(--bg3);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.ind .ic .il{font-size:10px;color:var(--tx3);display:flex;align-items:center;gap:4px;margin-bottom:3px}
.ind .ic .iv{font-size:18px;font-weight:600}.ind .ic .is{font-size:10px;color:var(--tx3);margin-top:1px}
/* Toast */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:12px;font-weight:500;z-index:2000;box-shadow:0 8px 30px rgba(0,0,0,.25);opacity:0;transition:opacity .2s,transform .2s;display:flex;align-items:center;gap:7px;max-width:90vw}
.toast.sh{opacity:1;transform:translateX(-50%) translateY(0)}
.toast i{font-size:15px}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.gb{transform-box:fill-box;transform-origin:bottom;animation:grow .5s cubic-bezier(.2,.7,.3,1) both}
@media(max-width:700px){.htbl{font-size:9px}.ind{grid-template-columns:1fr 1fr}.tpc{gap:4px}.fsel,.dirb{font-size:10px}}
/* Entrada de dados por área (toolbar) */
.ebar{display:inline-flex;align-items:center;gap:4px;margin-left:auto;text-transform:none;letter-spacing:normal}
.ebar .elab{font-size:9px;color:var(--tx3);font-weight:400;margin-right:1px;white-space:nowrap}
.ebtn{min-width:24px;height:22px;padding:0 5px;border:1px solid var(--bd);border-radius:6px;background:var(--bg3);color:var(--tx2);cursor:pointer;font-size:12px;display:inline-flex;align-items:center;justify-content:center;transition:.15s}

function rD(a){

  // --- Semáforo helpers ---
  function dlP(cur,prevFull){ // COUNT metrics: projeção vs mês anterior

  }

    if(!prevFull||!cur)return'';
    const d=cur-prevFull,pct=Math.round(Math.abs(d)/Math.abs(prevFull)*100);
    if(d>0)return`<span class="vd vu">▲${pct}%</span>`;
    if(d<0)return`<span class="vd vw">▼${pct}%</span>`;

// ===== GRÁFICO ANUAL =====
function rAnual(){
  const sites=[{k:'acessos',l:'GD Principal',c:'var(--pur)'},{k:'blog_acessos',l:'Blog GD',c:'var(--blu)'},{k:'cora_acessos',l:'CoraCora',c:'var(--cor)'}];
  let maxVal=1;
  MO.forEach((_,mi)=>sites.forEach(s=>{const v=gA(mi,s.k);if(v>maxVal)maxVal=v;}));
  const bw=18,gap=3,gp=6,pw=bw*sites.length+(sites.length-1)*gap+gp;
  const svgW=MO.length*pw+44,svgH=120,bH=78;
  let bars='';
  MO.forEach((mo,mi)=>{
    const x0=22+mi*pw;
    sites.forEach((s,si)=>{
      const v=gA(mi,s.k),h2=v?Math.max(2,Math.round(v/maxVal*bH)):0,bx=x0+si*(bw+gap),by=svgH-22-h2;
      bars+=`<rect x="${bx}" y="${by}" width="${bw}" height="${h2}" fill="${s.c}" rx="2" opacity=".8"><title>${s.l} ${mo.s}: ${v?fN(v):'—'}</title></rect>`;
      if(v&&h2>8)bars+=`<text x="${bx+bw/2}" y="${by-2}" text-anchor="middle" font-size="6" fill="var(--tx3)">${fN(v)}</text>`;
    });
    bars+=`<text x="${x0+pw/2-gp/2}" y="${svgH-6}" text-anchor="middle" font-size="8" fill="var(--tx3)">${mo.s}</text>`;
  });
  const legend=sites.map(s=>`<span style="font-size:9px;display:inline-flex;align-items:center;gap:3px;color:var(--tx2)"><i style="width:8px;height:8px;border-radius:2px;background:${s.c};display:inline-block"></i>${s.l}</span>`).join('');
  return`<div class="S"><div class="ST"><i class="ti ti-chart-bar" style="font-size:13px"></i> Sessões por site — 2026</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px">${legend}</div><div style="overflow-x:auto"><svg viewBox="0 0 ${svgW} ${svgH}" style="width:100%;min-width:${Math.round(svgW*0.7)}px;height:auto;display:block">${bars}</svg></div></div>`;
}

function aU(m,s){sM('Nome da página','',v=>{if(!v.trim())return;const u=gU(m,s);u.push({n:v.trim(),prev:0,cur:0});sU(m,s,u)},'text')}
function eU(m,s,i,f){const u=gU(m,s);const cv=f==='n'?u[i].n:u[i][f];sM(f==='n'?'Página':f==='prev'?'Mês anterior':'Atual (parcial)',cv,v=>{u[i][f]=f==='n'?v:(v||0);sU(m,s,u)},f==='n'?'text':'number')}

function delAllPages(m,s,label){

let _csv=null;
function importCSV(m,s,field){
  field=field||'cur';
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.csv,text/csv,application/csv';
  inp.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=ev=>_parseGA4CSV(m,s,ev.target.result,field);
    rd.readAsText(f,'UTF-8');
  };

}
function _csvRow(line){
  // Parser CSV robusto com suporte a campos entre aspas e delimitadores , ou ;
  const r=[];let q=false,c='';
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){q=!q;}
    else if((ch===','||ch===';')&&!q){r.push(c.trim());c='';}
    else c+=ch;
  }
  r.push(c.trim());return r;
}
function _parseGA4CSV(m,s,txt,field){
  field=field||'cur';
  // Remover BOM (UTF-8)
  if(txt.charCodeAt(0)===0xFEFF)txt=txt.slice(1);
  // Separar linhas, ignorar metadados (# ou vazias)
  const lines=txt.split('\n').map(l=>l.trim()).filter(l=>l&&!l.startsWith('#')&&!l.startsWith('"#')&&l!=='""');
  if(!lines.length){alert('CSV vazio ou sem dados reconhecíveis.');return;}
  const hdr=_csvRow(lines[0]).map(h=>h.toLowerCase().replace(/"/g,'').trim());
  const pathIdx=hdr.findIndex(h=>
    h.includes('page path')||h==='page title and screen class'||
    h.includes('caminho da p')||h.includes('pagina e classe')||h.includes('página e classe')||
    h.includes('pagina')||h.includes('página')||
    h==='url'||h==='page'||h.includes('screen')
  );
  const sessIdx=hdr.findIndex(h=>
    h==='sessions'||h==='sessões'||h==='sessoes'||
    h==='visualizações'||h==='visualizacoes'||h.includes('visualiza')||
    h.includes('session')||h.includes('sessão')
  );
  if(pathIdx===-1||sessIdx===-1){
    alert('Colunas não reconhecidas automaticamente.\n\nColunas detectadas: '+hdr.join(' | ')+'\n\nO CSV precisa ter colunas de "Page path" e "Sessions".\nDica: no GA4, exporte o relatório "Páginas e telas" (Pages and screens).');
    return;
  }
  const rows=[];
  for(let i=1;i<lines.length;i++){
    const cols=_csvRow(lines[i]);
    if(cols.length<=Math.max(pathIdx,sessIdx))continue;
    const path=(cols[pathIdx]||'').replace(/"/g,'').trim();
    const sess=parseInt((cols[sessIdx]||'0').replace(/"/g,'').replace(/[,\.]/g,'').trim())||0;
    if(!path||path.toLowerCase()==='total'||path==='(not set)'||path==='(not provided)')continue;
    rows.push({n:path,val:sess});
  }
  if(!rows.length){alert('Nenhuma página encontrada no CSV.\nVerifique se o arquivo está correto.');return;}
  _csv={m,s,field,rows:rows.slice(0,25),total:rows.length};
  const sL={gd:'Guardar Dinheiro (principal)',blog:'Blog Guardar Dinheiro',cora:'CoraCora News'};
  const fieldLabel=field==='prev'?'Mês Anterior':'Mês Atual (parcial)';
  const fieldIcon=field==='prev'?'ti-calendar-minus':'ti-file-import';
  const o=document.createElement('div');o.className='ov';o.id='ov-csv';
  o.innerHTML=`<div class="mx" style="width:540px;max-width:96vw;max-height:85vh;display:flex;flex-direction:column;gap:0">
    <h4 style="display:flex;align-items:center;gap:6px"><i class="ti ${fieldIcon}" style="color:var(--pur)"></i> Importar ${fieldLabel} — ${sL[s]}</h4>
    <p style="font-size:11px;color:var(--tx2);margin:6px 0 10px;line-height:1.5">
      <strong>${rows.length}</strong> páginas encontradas${rows.length>25?' (mostrando as 25 primeiras)':''}.
      Os valores serão salvos como <strong>${fieldLabel}</strong>.
      A tabela será ordenada por maior resultado ao confirmar.
    </p>
    <div style="overflow-y:auto;flex:1;border:1px solid var(--bd);border-radius:6px;margin-bottom:10px">
    <table style="width:100%;border-collapse:collapse;font-size:10px">
      <tr style="position:sticky;top:0">
        <th style="text-align:left;padding:5px 8px;border-bottom:1px solid var(--bd);color:var(--tx3);background:var(--bg2);font-weight:600">Página / URL</th>
        <th style="text-align:right;padding:5px 8px;border-bottom:1px solid var(--bd);color:var(--tx3);background:var(--bg2);font-weight:600">Sessões</th>
      </tr>
      ${_csv.rows.map((r,i)=>`<tr style="${i%2?'background:var(--bg2)':''}"><td style="padding:5px 8px;border-bottom:1px solid var(--bd);max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.n}</td><td style="text-align:right;padding:5px 8px;border-bottom:1px solid var(--bd);font-weight:600;font-variant-numeric:tabular-nums">${fN(r.val)}</td></tr>`).join('')}
    </table>
    </div>
    <div class="mbb">
      <button onclick="document.getElementById('ov-csv')?.remove();_csv=null">Cancelar</button>
      <button class="pr" onclick="_cfCSV()"><i class="ti ti-check" style="font-size:11px"></i> Confirmar importação</button>
    </div>
  </div>`;
  document.body.appendChild(o);
  o.addEventListener('click',e=>{if(e.target===o){o.remove();_csv=null;}});
}
function _cfCSV(){
  if(!_csv)return;
  const field=_csv.field||'cur';
  const existing=gU(_csv.m,_csv.s);
  let merged;
  if(field==='prev'){
    // Mescla: atualiza prev de URLs existentes; adiciona novas com cur=0
    merged=[...existing];
    _csv.rows.forEach(r=>{
      const found=merged.find(e=>e.n===r.n);
      if(found)found.prev=r.val;
      else merged.push({n:r.n,prev:r.val,cur:0});
    });
  }else{
    // Mescla: substitui cur, preserva prev existente
    merged=_csv.rows.map(r=>{
      const found=existing.find(e=>e.n===r.n);
      return{n:r.n,cur:r.val,prev:found?found.prev:0};
    });
    // Adiciona URLs existentes que não estão no CSV (preserva histórico)
    existing.forEach(e=>{if(!merged.find(r=>r.n===e.n))merged.push(e);});
  }
  // Ordenar por cur desc, depois prev desc
  merged.sort((a,b)=>(b.cur||0)-(a.cur||0)||(b.prev||0)-(a.prev||0));
  sU(_csv.m,_csv.s,merged);
  _csv=null;
  document.getElementById('ov-csv')?.remove();
  R();
}

// Gráfico de barras agrupadas (comparação entre anos) — Módulo 4
function hGroupChart(va,vb,ca,cb,fmt){
  const mx=Math.max(1,...va.map(v=>v||0),...vb.map(v=>v||0));
  const bw=11,ig=2,gap=12,padL=10,padR=10,padTop=16,padBot=22,bH=120,gw=bw*2+ig;

function hIndicators(y,dsId,mk){

  const best=inv?filled.reduce((a,b)=>b.v<a.v?b:a):filled.reduce((a,b)=>b.v>a.v?b:a);

    ${card('📉','Pior mês',HMESES[worst.i],hFmt(worst.v,fmt))}
    ${card('📈','Crescimento acumulado',`<span style="color:${gc}">${growth>=0?'+':''}${growth.toFixed(0)}% ${ar}</span>`,`${HMESES[first.i]} → ${HMESES[last.i]}`)}
    ${card('📊','Média mensal',hFmt(fmt==='int'?Math.round(avg):avg,fmt),`${filled.length} ${filled.length===1?'mês':'meses'} preenchido${filled.length===1?'':'s'}`)}
    ${card('📅','Último mês preenchido',HMESES[last.i],hFmt(last.v,fmt))}

}

  o.innerHTML=`<div class="mx" style="width:600px;max-width:96vw;max-height:88vh;display:flex;flex-direction:column">
    <h4 style="display:flex;align-items:center;gap:6px"><i class="ti ti-upload" style="color:var(--pur)"></i> Importar — ${ds.l} · ${y}</h4>
    <p style="font-size:11px;color:var(--tx2);margin:6px 0 8px;line-height:1.5"><strong>${found.length}</strong> métrica(s) reconhecida(s) em <em>${(fname||'arquivo')}</em>.${invalid?` <span style="color:var(--amb)"><i class="ti ti-alert-triangle" style="font-size:11px"></i> ${invalid} valor(es) não numérico(s) foram ignorados.</span>`:''}</p>
    <div style="overflow:auto;border:1px solid var(--bd);border-radius:6px;margin-bottom:10px;max-height:34vh">${prev}</div>
    <div style="font-size:10px;font-weight:600;color:var(--tx2);margin-bottom:5px">Como deseja importar?</div>
    <div style="display:grid;grid-template-columns:1fr;gap:5px;margin-bottom:11px">
      ${radio('replace','Substituir dados existentes','Sobrescreve as métricas enviadas (meses em branco no arquivo ficam vazios).')}
      ${radio('add','Adicionar aos dados existentes','Soma os valores do arquivo aos já cadastrados, mês a mês.')}
      ${radio('update','Atualizar apenas os meses enviados','Mantém o que existe e troca somente os meses preenchidos no arquivo.')}
    </div>
    <div class="mbb"><button onclick="document.getElementById('ov-himp')?.remove();_himp=null">Cancelar</button><button class="pr" onclick="hApplyImport()"><i class="ti ti-check" style="font-size:11px"></i> Confirmar importação</button></div>
  </div>`;
  document.body.appendChild(o);
  o.addEventListener('click',e=>{if(e.target===o){o.remove();_himp=null;}});
}
function hApplyImport(){
  if(!_himp)return;const{y,dsId,parsed}=_himp,mode=hImpMode;const d=gDSData(y,dsId);let n=0;
  Object.keys(parsed).forEach(k=>{const inc=parsed[k];const cur=Array.isArray(d[k])?d[k].slice():Array(12).fill(null);
    if(mode==='add')d[k]=cur.map((c,i)=>inc[i]==null?(c==null?null:c):((Number(c)||0)+Number(inc[i])));
    else if(mode==='update')d[k]=cur.map((c,i)=>inc[i]==null?(c==null?null:c):inc[i]);
    else d[k]=inc.slice(0,12);
    n++;});
  sv();document.getElementById('ov-himp')?.remove();_himp=null;hYear=y;hDS=dsId;ensureMetric();R();
  if(_man&&document.getElementById('ov-man')){_man.y=y;_man.dsId=dsId;hManBody();}
  const ml={replace:'substituídos',add:'somados',update:'meses atualizados'}[mode];
  toast(n+' métrica(s) importada(s) — '+ml+'.','ti-file-import');
}
// Download de modelo (CSV) — Módulo "Baixar Modelo"
function hDownloadModel(dsId,y){
  const ds=dsById(dsId);
  const esc=s=>/[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
  const head=[dsId==='aquis'?'Origem':'Metrica',...HMESES].map(esc).join(',');
  const body=ds.metrics.map(m=>[m.l,...Array(12).fill('')].map(esc).join(',')).join('\n');
  const csv='\uFEFF'+head+'\n'+body+'\n';
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);const a2=document.createElement('a');a2.href=url;a2.download='modelo_'+dsId+'_'+y+'.csv';document.body.appendChild(a2);a2.click();a2.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
  toast('Modelo de '+ds.l+' baixado.','ti-download');
}

// ===== ENTRADA DE DADOS NAS SEÇÕES DO DASHBOARD (Opção 1) =====
let dMetric={},_man=null;
const AQCOLORS=['#534AB7','#1D9E75','#D85A30','#378ADD','#BA7517','#E24B4A','#0F6E56','#9B59B6','#7A8087'];
function ensureDMetric(dsId){const ds=dsById(dsId);if(!dMetric[dsId]||!ds.metrics.some(m=>m.k===dMetric[dsId]))dMetric[dsId]=ds.metrics[0].k}
// Toolbar ✍️ manual / 📤 importar / 📥 modelo — reutilizável em qualquer seção
function entryBar(dsId){return ` <span class="ebar"><span class="elab">Dados anuais ${hYear}</span><button class="ebtn" title="✍️ Inserir manualmente" onclick="hManualModal('${dsId}')"><i class="ti ti-edit"></i></button><button class="ebtn" title="📤 Importar arquivo (CSV/XLSX)" onclick="hImport(hYear,'${dsId}')"><i class="ti ti-upload"></i></button><button class="ebtn" title="📥 Baixar modelo" onclick="hDownloadModel('${dsId}',hYear)"><i class="ti ti-download"></i></button></span>`}
// Gráfico de linhas — uma linha por origem (exceção à regra, só Aquisição)
function hLineChart(series){
  const flat=series.flatMap(s=>(s.vals||[]).filter(v=>v!=null));
  const mx=Math.max(1,...flat.map(v=>v||0));
  const n=12,step=42,padL=40,padR=12,padTop=14,plotH=140,padBot=24;
  const W=padL+padR+(n-1)*step,baseY=padTop+plotH,svgH=padTop+plotH+padBot;
  const X=i=>padL+i*step,Y=v=>baseY-(v/mx)*plotH;
  let grid='';for(let g=0;g<=4;g++){const gy=baseY-(g/4)*plotH,gv=Math.round(mx*g/4);grid+=`<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="var(--bd)" stroke-width="1" opacity=".5"/><text x="${padL-4}" y="${gy+3}" text-anchor="end" font-size="7" fill="var(--tx3)">${fN(gv)}</text>`;}
  let xlab='';for(let i=0;i<n;i++)xlab+=`<text x="${X(i)}" y="${baseY+13}" text-anchor="middle" font-size="8" fill="var(--tx3)">${HMESES[i]}</text>`;
  let lines='';
  series.forEach(s=>{const pts=[];(s.vals||[]).forEach((v,i)=>{if(v!=null)pts.push([X(i),Y(v),i,v]);});
    if(pts.length>1)lines+=`<polyline fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p=>p[0]+','+p[1]).join(' ')}"/>`;
    pts.forEach(p=>lines+=`<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="${s.color}"><title>${s.label} — ${HMESES[p[2]]}: ${fN(p[3])}</title></circle>`);
  });
  const legend=series.map(s=>`<span style="font-size:9px;display:inline-flex;align-items:center;gap:3px;color:var(--tx2)"><i style="width:11px;height:2px;border-radius:1px;background:${s.color};display:inline-block"></i>${s.label}</span>`).join('');
  return`<div style="display:flex;gap:6px 10px;flex-wrap:wrap;margin-bottom:6px">${legend}</div><div style="overflow-x:auto"><svg class="lf" viewBox="0 0 ${W} ${svgH}" style="width:100%;min-width:${Math.round(W*0.8)}px;height:auto;display:block">${grid}${xlab}<line x1="${padL}" y1="${baseY}" x2="${W-padR}" y2="${baseY}" stroke="var(--bd2)" stroke-width="1"/>${lines}</svg></div>`;
}
// Bloco de área no Dashboard: entrada + gráfico no padrão da aba Histórico
function areaBlock(dsId){
  const ds=dsById(dsId),years=gHistYears();
  let h=`<div class="S"><div class="ST"><i class="ti ${ds.ic}" style="font-size:13px"></i> ${ds.l} (anual)${entryBar(dsId)}</div>`;
  if(dsId==='aquis'){
    h+=`<div class="tpc"><span style="font-size:10px;color:var(--tx3)">Ano:</span><select class="fsel" onchange="hYear=this.value;R()">${years.map(y=>`<option value="${y}" ${hYear===y?'selected':''}>${y}</option>`).join('')}</select><span style="font-size:9px;color:var(--tx3);margin-left:4px">Origem — uma linha por origem</span></div>`;
    const series=ds.metrics.map((m,i)=>({label:m.l,color:AQCOLORS[i%AQCOLORS.length],vals:gDSData(hYear,dsId)[m.k]||[]}));
    h+=hLineChart(series);
  }else{
    ensureDMetric(dsId);const mk=dMetric[dsId],meta=metaOf(dsId,mk);
    h+=`<div class="tpc"><span style="font-size:10px;color:var(--tx3)">Métrica:</span><select class="fsel" onchange="dMetric['${dsId}']=this.value;R()">${ds.metrics.map(m=>`<option value="${m.k}" ${mk===m.k?'selected':''}>${m.l}</option>`).join('')}</select><span style="font-size:10px;color:var(--tx3)">Ano:</span><select class="fsel" onchange="hYear=this.value;R()">${years.map(y=>`<option value="${y}" ${hYear===y?'selected':''}>${y}</option>`).join('')}</select></div>`;
    h+=`<div style="font-size:9px;color:var(--tx2);margin-bottom:6px;display:flex;align-items:center;gap:4px"><i style="width:8px;height:8px;border-radius:2px;background:var(--pur);display:inline-block"></i>${meta.l} ${hYear}</div>`;
    h+=hSingleChart(gDSData(hYear,dsId)[mk]||[],'var(--pur)',meta.fmt);
    h+=hIndicators(hYear,dsId,mk);
  }
  return h+`</div>`;
}
// Modal de digitação manual (tabela anual da área) — Modo 1 acessível pela seção
function hManualModal(dsId,y){_man={dsId,y:y||hYear};const o=document.createElement('div');o.className='ov';o.id='ov-man';o.innerHTML=`<div class="mx" style="width:700px;max-width:96vw;max-height:88vh;display:flex;flex-direction:column"><div id="man-body"></div></div>`;document.body.appendChild(o);o.addEventListener('click',e=>{if(e.target===o){o.remove();_man=null;}});hManBody();}
function hManBody(){
  if(!_man)return;const{dsId,y}=_man,ds=dsById(dsId),d=gDSData(y,dsId),years=gHistYears();
  const col1=dsId==='aquis'?'Origem':'Métrica';
  let h=`<h4 style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><i class="ti ${ds.ic}" style="color:var(--pur)"></i> Inserir manualmente — ${ds.l}<select class="fsel" style="margin-left:auto" onchange="if(this.value==='__new'){hManNewYear()}else{_man.y=this.value;hManBody()}">${years.map(yy=>`<option value="${yy}" ${y===yy?'selected':''}>${yy}</option>`).join('')}<option value="__new">+ Novo ano…</option></select></h4>`;
  h+=`<p style="font-size:11px;color:var(--tx2);margin:6px 0 8px;line-height:1.5">Preencha os meses desejados — salva automaticamente no Supabase e aparece nos gráficos. Dá para corrigir um único valor, um mês ou o ano inteiro.</p>`;
  h+=`<div class="hwrap" style="margin-bottom:10px"><table class="htbl"><thead><tr><th>${col1}</th>${HMESES.map(m=>`<th>${m}</th>`).join('')}</tr></thead><tbody>`;
  ds.metrics.forEach(mt=>{h+=`<tr><td>${mt.l}</td>`;for(let i=0;i<12;i++){const v=d[mt.k][i];h+=`<td><input class="hin" type="number" step="any" inputmode="decimal" value="${v==null?'':v}" placeholder="—" onchange="sHistCell('${y}','${dsId}','${mt.k}',${i},this.value)"></td>`;}h+=`</tr>`;});
  h+=`</tbody></table></div>`;
  h+=`<div class="mbb"><button onclick="document.getElementById('ov-man')?.remove();_man=null;R()">Fechar</button><button onclick="hImport('${y}','${dsId}')"><i class="ti ti-upload" style="font-size:11px"></i> Importar</button><button onclick="hDownloadModel('${dsId}','${y}')"><i class="ti ti-download" style="font-size:11px"></i> Modelo</button><button class="pr" onclick="document.getElementById('ov-man')?.remove();_man=null;aT='hist';hDS='${dsId}';hYear='${y}';ensureMetric(true);R()"><i class="ti ti-chart-bar" style="font-size:11px"></i> Ver no Histórico</button></div>`;
  document.getElementById('man-body').innerHTML=h;
}
function hManNewYear(){sM('Novo ano (ex.: 2027)','',val=>{const y=String(parseInt(val)||'').trim();if(!y||y==='0'){hManBody();return;}_man.y=y;gDSData(y,_man.dsId);sv();hManBody()},'number')}
// Inicialização assíncrona — carrega do Supabase antes de renderizar
document.getElementById('app').innerHTML='<div style="text-align:center;padding:3rem;color:var(--tx2);font-size:12px"><i class="ti ti-loader-2" style="font-size:22px;display:block;margin-bottom:8px;animation:spin .8s linear infinite"></i>Carregando dados do Supabase...</div>';
ld().then(()=>R());
</script>
</body>
