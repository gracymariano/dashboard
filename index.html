function renderSMART(m){
  var sig=m.s+'_'+m.y;
  var fields=[
    {k:'specific',   l:'Specific',   sub:'O que exatamente?',         type:'ta'},
    {k:'measurable', l:'Measurable', sub:'Como será medido?',          type:'ta'},
    {k:'achievable', l:'Achievable', sub:'É realista? O que precisamos?',type:'ta'},
    {k:'relevant',   l:'Relevant',   sub:'Por que importa?',           type:'ta'},
    {k:'timebound',  l:'Time-bound', sub:'Data alvo',                  type:'date'},
  ];
  function card(n){
    var base='smart_'+sig+'_'+n;
    var title=gA(cM,base+'_titulo')||'';
    var rows=fields.map(function(f){
      var val=gA(cM,base+'_'+f.k)||'';
      var inp=f.type==='date'
        ?'<input type="date" class="smart-inp" value="'+val+'" onchange="sA(cM,\''+base+'_'+f.k+'\',this.value);sv()">'
        :'<textarea class="smart-inp" rows="2" onchange="sA(cM,\''+base+'_'+f.k+'\',this.value);sv()" onblur="sA(cM,\''+base+'_'+f.k+'\',this.value);sv()">'+val+'</textarea>';
      return '<div class="smart-row"><div class="smart-lbl">'+f.l+'<span>'+f.sub+'</span></div><div>'+inp+'</div></div>';
    }).join('');
    var comment=gA(cM,base+'_comment')||'';
    return '<div class="smart-card">'
      +'<input class="smart-title" placeholder="Meta '+n+' — clique para editar…" value="'+title+'" onchange="sA(cM,\''+base+'_titulo\',this.value);sv()" onblur="sA(cM,\''+base+'_titulo\',this.value);sv()">'
      +rows
      +'<input class="smart-comment" placeholder="💬 Comentário…" value="'+comment+'" onblur="sA(cM,\''+base+'_comment\',this.value);sv()">'
      +'</div>';
  }
  return '<div class="smart-section">'
    +'<div class="smart-header-bar"><i class="ti ti-target"></i> Metas SMART — '+m.n+' '+m.y
    +'<span>Salva automaticamente ao sair do campo</span></div>'
    +card(1)+card(2)+'</div>';
}

function anMatchCol(sec,label){label=(label==null?'':label).toString().toLowerCase().replace(/"/g,'').trim();if(!label)return null;
  for(var i=0;i<sec.metrics.length;i++){var m=sec.metrics[i];if(label===m.l.toLowerCase()||label===m.k)return m.k;}
  var best=null,bl=0;
  for(var j=0;j<sec.metrics.length;j++){var mm=sec.metrics[j];(mm.al||[]).forEach(function(a){if(a&&label.indexOf(a)>=0&&a.length>bl){best=mm.k;bl=a.length;}});}
  return best;}
function anCurFocus(){var sec=AN_SECTIONS[anSection];if(!anFocusSel[anSection]||!sec.metrics.some(function(m){return m.k===anFocusSel[anSection];}))anFocusSel[anSection]=sec.head;return anFocusSel[anSection];}

function anStore(){if(!ac.an||typeof ac.an!=='object')ac.an={};var s=ac.an;if(!s.data)s.data={};if(!s.notes)s.notes={};if(!s.goals)s.goals={};if(!s.mgoals)s.mgoals={};if(!s.campsrc)s.campsrc={};if(!s.pages)s.pages={};if(!s.ads)s.ads={};if(!s.adm)s.adm={};if(!s.seo)s.seo={};if(!s.ret)s.ret={};if(!s.rev)s.rev={};if(!s.time)s.time={};if(!s.tlists)s.tlists={};if(!s.seoseg)s.seoseg={};if(!s.ui)s.ui={};return s;}
function anEmpty(section){var o={};AN_SECTIONS[section].metrics.forEach(function(m){o[m.k]=Array(12).fill(null);});return o;}
function anRaw(year,section,prop){var s=anStore();s.data[year]=s.data[year]||{};s.data[year][section]=s.data[year][section]||{};if(!s.data[year][section][prop])s.data[year][section][prop]=anEmpty(section);
  var d=s.data[year][section][prop];AN_SECTIONS[section].metrics.forEach(function(m){if(!Array.isArray(d[m.k]))d[m.k]=Array(12).fill(null);});return d;}
function anData(year,section,prop){
  if(prop!=='all')return anRaw(year,section,prop);
  var out={};AN_SECTIONS[section].metrics.forEach(function(m){
    var arr=Array(12).fill(null);
    for(var i=0;i<12;i++){var sum=0,cnt=0,has=false;
      AN_REAL.forEach(function(p){var v=anRaw(year,section,p)[m.k][i];if(v!=null&&v!==''){has=true;sum+=Number(v);cnt++;}});
      if(has)arr[i]=m.fmt==='int'?sum:(cnt?sum/cnt:null);
    }
    out[m.k]=arr;
  });
  return out;
}
function anSetCell(year,section,prop,mk,i,val){var d=anRaw(year,section,prop);d[mk][i]=(val===''||val==null||isNaN(Number(val)))?null:Number(val);sv();}
function anSeries(year,section,prop,mk){return anData(year,section,prop)[mk]||Array(12).fill(null);}
function anFilled(arr){return arr.map(function(v,i){return{v:v,i:i};}).filter(function(o){return o.v!=null&&o.v!=='';});}
function anHasAny(year,section,prop){var d=anData(year,section,prop);return AN_SECTIONS[section].metrics.some(function(m){return(d[m.k]||[]).some(function(v){return v!=null&&v!=='';});});}

/* ── Formatação ── */
function anFmt(v,fmt){if(v==null||v==='')return'—';v=Number(v);
  if(fmt==='dur'){var s=Math.round(v),mm=Math.floor(s/60),ss=s%60;return mm>0?(mm+'m '+String(ss).padStart(2,'0')+'s'):(ss+'s');}
  if(fmt==='money')return 'R$ '+hFmt(v,'money');
  return hFmt(v,fmt);}
function anShort(v,fmt){if(v==null||v==='')return'—';v=Number(v);
  if(fmt==='int')return fN(v);
  if(fmt==='pct')return v.toFixed(1)+'%';
  if(fmt==='dur'){var s=Math.round(v);return Math.floor(s/60)+'m'+String(s%60).padStart(2,'0');}
  if(fmt==='money')return 'R$'+(Math.abs(v)>=1000?fN(v):v.toLocaleString('pt-BR',{maximumFractionDigits:2}));
  return v.toLocaleString('pt-BR',{maximumFractionDigits:1});}

/* ── Estatísticas por métrica (atual / anterior / projeção / variação) ── */
function anStats(year,section,prop,mk){
  var meta=anMeta(section,mk),fmt=meta.fmt;
  var arr=anSeries(year,section,prop,mk),filled=anFilled(arr);
  if(!filled.length)return{cur:null,prev:null,proj:null,varp:null,fmt:fmt,idx:null};
  var last=filled[filled.length-1],prevO=filled.length>1?filled[filled.length-2]:null;
  var cur=last.v,prev=prevO?prevO.v:null;
  var varp=(prev!=null&&prev!==0)?((cur-prev)/Math.abs(prev)*100):null;
  var proj=cur,now=new Date(),isCur=String(now.getFullYear())===String(year);
  if(isCur&&last.i===now.getMonth()&&fmt==='int'){var dE=now.getDate()-1,tD=dIM(Number(year),last.i);if(dE>0)proj=Math.round(cur/dE*tD);}
  else if(fmt==='int'&&prev!=null){proj=Math.round(cur+(cur-prev));}
  return{cur:cur,prev:prev,proj:proj,varp:varp,fmt:fmt,idx:last.i};
}
function anSemaphore(varp){if(varp==null)return'flat';if(varp>2)return'up';if(varp<-2)return'down';return'flat';}
function anSemColor(s){return s==='up'?'var(--success)':s==='down'?'var(--danger)':'var(--warning)';}

/* ── Bloco executivo (métrica em foco) ── */
function anExec(year,section,prop,mk){
  var meta=anMeta(section,mk),fmt=meta.fmt;
  var arr=anSeries(year,section,prop,mk),filled=anFilled(arr);
  if(!filled.length)return null;
  var best=filled.reduce(function(a,b){return b.v>a.v?b:a;});
  var worst=filled.reduce(function(a,b){return b.v<a.v?b:a;});
  var first=filled[0],last=filled[filled.length-1];
  var growth=first.v?((last.v-first.v)/Math.abs(first.v)*100):0;
  var avg=filled.reduce(function(s,o){return s+o.v;},0)/filled.length;
  var sum=filled.reduce(function(s,o){return s+o.v;},0);
  var goal=anGoal(year,section,prop);
  var goalPct=goal>0?((fmt==='int'?sum:avg)/goal*100):null;
  return{best:best,worst:worst,growth:growth,avg:avg,sum:sum,first:first,last:last,goal:goal,goalPct:goalPct,fmt:fmt};
}

function anGoalProgress(){

  var realNum=(real==null||real==='')?0:Number(real);
  var pct=goal>0?(realNum/goal*100):null;
  var pctClamp=pct==null?0:Math.max(0,Math.min(100,pct));
  var col=pct==null?'var(--text-secondary)':pct>=100?'var(--success)':pct>=60?'var(--warning)':'var(--danger)';
  var mSel='<select class="fsel" onchange="anSetGoalMetric(this.value)" title="Métrica da meta">'+sec.metrics.map(function(m){return '<option value="'+m.k+'"'+(m.k===mk?' selected':'')+'>'+m.l+'</option>';}).join('')+'</select>';
  var moSel='<select class="fsel" onchange="anSetGoalMonth(this.value)" title="Mês da meta">'+AN_MES_LONG.map(function(nm,i){return '<option value="'+i+'"'+(i===mi?' selected':'')+'>'+nm+'/'+anYear+'</option>';}).join('')+'</select>';
  var setBtn='<button class="an-btn prim" onclick="anMGoalEdit('+mi+')"><i class="ti ti-target"></i> '+(goal>0?'Editar meta':'Definir meta')+'</button>';

      +'<div class="an-gp-pair"><span>Meta</span><b>'+anFmt(goal,meta.fmt)+'</b></div>'
      +'<div class="an-gp-pair"><span>'+(falta>0?'Falta':'Excedente')+'</span><b style="color:'+col+'">'+anFmt(Math.abs(falta),meta.fmt)+'</b></div>'
      +'<div class="an-gp-pct" style="color:'+col+'">'+pct.toFixed(0)+'%</div></div>';

    right='<div class="an-gp-nums"><div class="an-gp-pair"><span>Realizado</span><b>'+anFmt(realNum,meta.fmt)+'</b></div><div style="font-size:11.5px;color:var(--text-secondary);align-self:center">Escolha a métrica e o mês acima e defina a meta para acompanhar o progresso.</div></div>';
  }
  return '<div class="an-card an-gp">'
    +'<div class="an-gp-hd"><div class="an-card-ttl"><i class="ti ti-flag-check"></i> Meta do mês</div>'
    +'<div class="an-gp-controls">'+mSel+moSel+setBtn+'</div></div>'
    +'<div class="an-gp-bar"><div class="an-gp-fill" style="width:'+pctClamp.toFixed(1)+'%;background:'+col+'"></div></div>'
    +right+'</div>';

/* ── Gráfico anual de barras arredondadas ── */
function anBarChart(arr,fmt){
  var vals=arr.map(function(v){return v==null?null:Number(v);});
  var mx=Math.max.apply(null,[1].concat(vals.map(function(v){return v||0;})));
  var W=720,H=250,padL=10,padR=10,padT=26,padB=34,plotH=H-padT-padB,baseY=padT+plotH;
  var slot=(W-padL-padR)/12,bw=Math.min(36,slot*0.56);
  var out='<defs><linearGradient id="anGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#16C79A"/><stop offset="100%" stop-color="#008B8B"/></linearGradient></defs>';
  for(var i=0;i<12;i++){
    var cx=padL+slot*i+slot/2,x=cx-bw/2,v=vals[i],has=v!=null;
    var bh=has?Math.max(4,Math.round((v||0)/mx*plotH)):0,y=baseY-bh;
    if(has){
      out+='<g class="an-bar-g" onclick="anOpenPanel('+i+')">'
        +'<rect class="an-bar" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh+'" rx="7" fill="url(#anGrad)"><title>'+HMESES[i]+': '+anFmt(v,fmt)+'</title></rect>';
      if(bh>24)out+='<text class="an-bar-val" x="'+cx.toFixed(1)+'" y="'+(y-6).toFixed(1)+'" text-anchor="middle">'+anShort(v,fmt)+'</text>';
      out+='</g>';
    }else{
      out+='<rect x="'+x.toFixed(1)+'" y="'+(baseY-3)+'" width="'+bw.toFixed(1)+'" height="3" rx="1.5" fill="rgba(11,34,57,.08)"><title>'+HMESES[i]+': sem dados</title></rect>';
    }
    out+='<text class="an-axis" x="'+cx.toFixed(1)+'" y="'+(baseY+17)+'" text-anchor="middle">'+HMESES[i]+'</text>';
    var nc=anNoteCount(anYear,i);
    if(nc)out+='<circle cx="'+(cx+bw/2-1).toFixed(1)+'" cy="'+(has?(y+6):(baseY-7)).toFixed(1)+'" r="3.2" fill="var(--warning)"><title>'+nc+' anotação(ões) em '+HMESES[i]+'</title></circle>';
  }
  return '<div class="an-chart"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" class="an-chart-svg">'+out+'</svg></div>';
}

/* ── Gráfico de linhas (comparação por propriedade) ── */
function anLineChart(series,fmt){
  var flat=[];series.forEach(function(s){(s.vals||[]).forEach(function(v){if(v!=null)flat.push(Number(v));});});
  var mx=Math.max.apply(null,[1].concat(flat));
  var n=12,W=720,H=250,padL=44,padR=12,padT=14,padB=28,plotH=H-padT-padB,baseY=padT+plotH;
  var step=(W-padL-padR)/(n-1);
  var X=function(i){return padL+i*step;},Y=function(v){return baseY-(v/mx)*plotH;};
  var g='';for(var k=0;k<=4;k++){var gy=baseY-(k/4)*plotH,gv=Math.round(mx*k/4);
    g+='<line x1="'+padL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+gy.toFixed(1)+'" stroke="rgba(11,34,57,.07)" stroke-width="1"/>'
      +'<text class="an-axis" x="'+(padL-6)+'" y="'+(gy+3).toFixed(1)+'" text-anchor="end">'+fN(gv)+'</text>';}
  var xl='';for(var i=0;i<n;i++)xl+='<text class="an-axis" x="'+X(i).toFixed(1)+'" y="'+(baseY+16)+'" text-anchor="middle">'+HMESES[i]+'</text>';
  var lines='';
  series.forEach(function(s){var pts=[];(s.vals||[]).forEach(function(v,i){if(v!=null)pts.push([X(i),Y(v),i,v]);});
    if(pts.length>1)lines+='<polyline fill="none" stroke="'+s.color+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" points="'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ')+'"/>';
    pts.forEach(function(p){lines+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="'+s.color+'"><title>'+s.label+' — '+HMESES[p[2]]+': '+anFmt(p[3],fmt)+'</title></circle>';});
  });
  return '<div class="an-chart"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" class="an-chart-svg">'+g+xl+lines+'</svg></div>';
}

/* ── Modal de anotação (adicionar/editar) ── */
function anNoteModalOpen(mi,editId){
  var preset='',presetDate='';
  if(editId){var arr=anNotes(anYear,mi);var n=arr.find(function(x){return x.id===editId;});if(n){preset=n.text;presetDate=n.date||'';}}
  var pad=function(x){return String(x).padStart(2,'0');};
  if(!presetDate){
    var now=new Date(),m=(mi>=0?mi:now.getMonth());
    var day=(String(now.getFullYear())===String(anYear)&&m===now.getMonth())?now.getDate():1;
    presetDate=anYear+'-'+pad(m+1)+'-'+pad(day);
  }
  var o=document.createElement('div');o.className='ov';o.id='an-note-ov';
  o.innerHTML='<div class="mx"><h4>'+(editId?'Editar anotação':'Nova anotação')+'</h4>'
    +'<input type="hidden" id="an-note-mi-old" value="'+mi+'">'
    +'<label style="font-size:11.5px;color:var(--text-secondary);font-weight:600;display:block;margin-bottom:5px">Data da feature</label>'
    +'<input id="an-note-date" type="date" min="'+anYear+'-01-01" max="'+anYear+'-12-31" value="'+presetDate+'" style="margin-bottom:10px">'
    +'<label style="font-size:11.5px;color:var(--text-secondary);font-weight:600;display:block;margin-bottom:5px">Descrição</label>'
    +'<input id="an-note-txt" type="text" placeholder="Ex.: Atualização SEO, lançamento da calculadora…" value="'+anEsc(preset)+'">'
    +'<div class="mbb"><button onclick="document.getElementById(\'an-note-ov\').remove()">Cancelar</button>'
    +'<button class="pr" onclick="anNoteSave('+(editId?'\''+editId+'\'':'null')+')">Salvar</button></div></div>';
  document.body.appendChild(o);
  o.addEventListener('click',function(e){if(e.target===o)o.remove();});
  var ti=document.getElementById('an-note-txt');ti.focus();ti.addEventListener('keydown',function(e){if(e.key==='Enter')anNoteSave(editId||null);});
}
function anNoteSave(editId){
  var date=document.getElementById('an-note-date').value,txt=document.getElementById('an-note-txt').value;
  var oldMi=parseInt(document.getElementById('an-note-mi-old').value);
  if(!txt||!txt.trim()){toast('Digite o texto da anotação.','ti-alert-circle');return;}
  var newMi=date?(parseInt(date.split('-')[1],10)-1):(oldMi>=0?oldMi:new Date().getMonth());
  if(editId){
    if(newMi!==oldMi){anDelNote(anYear,oldMi,editId);anAddNote(anYear,newMi,txt,date);}
    else anEditNote(anYear,oldMi,editId,txt,date);
  }else anAddNote(anYear,newMi,txt,date);
  document.getElementById('an-note-ov').remove();
  anR();if(_anDrawerMi!=null)anOpenPanel(_anDrawerMi);
  toast(editId?'Anotação atualizada.':'Anotação adicionada.','ti-check');
}
function anNoteDel(mi,id){

    anDelNote(anYear,mi,id);anR();if(_anDrawerMi!=null)anOpenPanel(_anDrawerMi);toast('Anotação excluída.','ti-trash');

}

function anSpark(arr,fmt,hi){

function _parseYM(s){s=String(s==null?'':s).trim();if(!s)return null;
  var m=s.match(/(20\d{2})-(\d{2})-\d{2}/)||s.match(/(20\d{2})(\d{2})\d{2}/);if(m)return{y:m[1],mi:parseInt(m[2],10)-1};
  m=s.match(/\b(\d{1,2})\/(\d{1,2})\/(20\d{2})\b/);if(m)return{y:m[3],mi:parseInt(m[2],10)-1};
  return null;}
function anParse(section,rows){
  var sec=AN_SECTIONS[section];
  var monthIdx=-1,year=anYear;
  // detectar data (Data de início: AAAAMMDD ou dd/mm/aaaa) em qualquer célula/comentário — usa TODAS as linhas, inclusive cabeçalho do GA4
  var flat=[];rows.forEach(function(r){(r||[]).forEach(function(c){flat.push(String(c==null?'':c));});});
  for(var fi=0;fi<flat.length;fi++){var cell=flat[fi];
    var m=cell.match(/(20\d{2})-(\d{2})-\d{2}/);if(m){year=m[1];monthIdx=parseInt(m[2],10)-1;break;}
    m=cell.match(/(20\d{2})(\d{2})\d{2}/);if(m){year=m[1];monthIdx=parseInt(m[2],10)-1;break;}
    m=cell.match(/\b(\d{1,2})\/(\d{1,2})\/(20\d{2})\b/);if(m){year=m[3];monthIdx=parseInt(m[2],10)-1;break;}
  }
  // remover comentários do GA4 (linhas iniciadas por '#') e linhas vazias antes de analisar a estrutura
  var clean=rows.filter(function(cols){if(!cols||!cols.length)return false;
    var first=String(cols[0]==null?'':cols[0]).trim();
    if(first.charAt(0)==='#')return false;
    var any=cols.some(function(c){return String(c==null?'':c).trim()!=='';});
    return any;});
  var result={};
  // formato largo (modelo do sistema): métrica na 1ª coluna + ao menos 2 valores numéricos
  var wideRows=clean.filter(function(cols){if(!anMatchCol(sec,cols[0]))return false;
    var nn=0;for(var i=1;i<cols.length;i++){if(hNumParse(cols[i])!=null)nn++;}return nn>=2;});
  if(wideRows.length>=2){
    wideRows.forEach(function(cols){var mk=anMatchCol(sec,cols[0]);if(!mk||result[mk])return;
      var nums=[];for(var i=1;i<cols.length&&nums.length<12;i++)nums.push(hNumParse(cols[i]));while(nums.length<12)nums.push(null);result[mk]=nums;});
    return{mode:'wide',data:result,year:year,monthIdx:-1,defMode:'replace'};
  }
  // formato GA4: cabeçalho com métricas em colunas, dados por canal/linha
  var headerIdx=-1,colMap={};
  for(var r=0;r<clean.length;r++){var cols=clean[r];if(cols.length<2)continue;var map={},hits=0;
    cols.forEach(function(c,ci){var mk=anMatchCol(sec,c);if(mk&&map[mk]==null){map[mk]=ci;hits++;}});
    if(hits>=2){headerIdx=r;colMap=map;break;}}
  if(headerIdx>=0){
    var mi=monthIdx>=0?monthIdx:new Date().getMonth();
    var dataRows=clean.slice(headerIdx+1);
    var totalRow=dataRows.find(function(c){var f=String(c[0]||'').toLowerCase().trim();return f==='total'||f==='totais'||f==='all'||f.indexOf('total')===0;});
    // se houver coluna de DATA com linhas diárias (ex.: GSC "Gráfico"), agrega por mês
    var hdr=clean[headerIdx]||[],usedCols=Object.keys(colMap).map(function(k){return colMap[k];}),dateCol=-1;
    for(var dci=0;dci<hdr.length;dci++){if(usedCols.indexOf(dci)>=0)continue;if(/(^|\b)(data|date)(\b|$)/i.test(String(hdr[dci]||''))){dateCol=dci;break;}}
    if(dateCol<0){for(var dcj=0;dcj<hdr.length;dcj++){if(usedCols.indexOf(dcj)>=0)continue;var hit=dataRows.filter(function(c){return _parseYM(c[dcj]);}).length;if(hit>=Math.max(2,Math.ceil(dataRows.length*0.6))){dateCol=dcj;break;}}}
    if(dateCol>=0&&dataRows.some(function(c){return _parseYM(c[dateCol]);})){
      var byM={};dataRows.forEach(function(c){var ym=_parseYM(c[dateCol]);if(!ym)return;if(ym.y)year=ym.y;(byM[ym.mi]=byM[ym.mi]||[]).push(c);});
      Object.keys(colMap).forEach(function(mk){var ci=colMap[mk],meta=anMeta(section,mk),wk=meta.w||sec.head,wci=colMap[wk],arr=Array(12).fill(null);
        Object.keys(byM).forEach(function(miK){var mi2=Number(miK),mr=byM[miK],val2=null;
          if(meta.fmt==='int'){var s2=0,a2=false;mr.forEach(function(c){var v=hNumParse(c[ci]);if(v!=null){s2+=v;a2=true;}});val2=a2?s2:null;}
          else{if(wci!=null&&mk!==wk){var nu=0,de=0;mr.forEach(function(c){var v=hNumParse(c[ci]),w=hNumParse(c[wci]);if(v!=null&&w!=null){nu+=v*w;de+=w;}});if(de>0)val2=nu/de;}
            if(val2==null){var ns=mr.map(function(c){return hNumParse(c[ci]);}).filter(function(v){return v!=null;});if(ns.length)val2=ns.reduce(function(a,b){return a+b;},0)/ns.length;}}
          if(val2!=null)arr[mi2]=val2;});
        result[mk]=arr;});
      return{mode:'month',data:result,year:year,monthIdx:-1,defMode:'update'};
    }
    Object.keys(colMap).forEach(function(mk){var ci=colMap[mk],meta=anMeta(section,mk),val=null;
      var wk=meta.w||sec.head,wci=colMap[wk]; // coluna de contagem usada como peso
      if(totalRow){val=hNumParse(totalRow[ci]);}
      else if(meta.fmt==='int'){var s=0,any=false;dataRows.forEach(function(c){var v=hNumParse(c[ci]);if(v!=null){s+=v;any=true;}});val=any?s:null;}
      else{ // taxa/tempo/média: média PONDERADA pela contagem (resultado correto a nível de propriedade)
        if(wci!=null&&mk!==wk){var num=0,den=0;dataRows.forEach(function(c){var v=hNumParse(c[ci]),w=hNumParse(c[wci]);if(v!=null&&w!=null){num+=v*w;den+=w;}});if(den>0)val=num/den;}
        if(val==null){var nums=dataRows.map(function(c){return hNumParse(c[ci]);}).filter(function(v){return v!=null;});if(nums.length)val=nums.reduce(function(a,b){return a+b;},0)/nums.length;}
      }
      var arr=Array(12).fill(null);if(val!=null)arr[mi]=val;result[mk]=arr;});
    return{mode:'month',data:result,year:year,monthIdx:mi,defMode:'update'};
  }
  return{mode:'none',data:{},year:year,monthIdx:-1,defMode:'replace'};
}

function anCampParse(rows){
  var sec=AN_SECTIONS.camp,monthIdx=-1,year=anYear;
  var flat=[];rows.forEach(function(r){(r||[]).forEach(function(c){flat.push(String(c==null?'':c));});});
  for(var fi=0;fi<flat.length;fi++){var cell=flat[fi];var m=cell.match(/(20\d{2})(\d{2})\d{2}/);if(m){year=m[1];monthIdx=parseInt(m[2],10)-1;break;}m=cell.match(/\b(\d{1,2})\/(\d{1,2})\/(20\d{2})\b/);if(m){year=m[3];monthIdx=parseInt(m[2],10)-1;break;}}
  var clean=rows.filter(function(cols){if(!cols||!cols.length)return false;var first=String(cols[0]==null?'':cols[0]).trim();if(first.charAt(0)==='#')return false;return cols.some(function(c){return String(c==null?'':c).trim()!=='';});});
  var headerIdx=-1,colMap={};
  for(var r=0;r<clean.length;r++){var cols=clean[r];if(cols.length<2)continue;var map={},hits=0;cols.forEach(function(c,ci){var mk=anMatchCol(sec,c);if(mk&&map[mk]==null){map[mk]=ci;hits++;}});if(hits>=2){headerIdx=r;colMap=map;break;}}
  if(headerIdx<0)return{mi:-1,year:year,sources:{},mk:[]};
  var mi=monthIdx>=0?monthIdx:new Date().getMonth();
  var sources={};
  clean.slice(headerIdx+1).forEach(function(c){var name=String(c[0]||'').trim();if(!name)return;var low=name.toLowerCase();if(low==='total'||low==='totais'||low==='all'||low.indexOf('#')===0)return;
    var rec={};Object.keys(colMap).forEach(function(mk){var v=hNumParse(c[colMap[mk]]);if(v!=null)rec[mk]=v;});
    if(Object.keys(rec).length)sources[name]=rec;});
  return{mi:mi,year:year,sources:sources,mk:Object.keys(colMap)};
}

function anPgMatchVal(label){label=(label==null?'':label).toString().toLowerCase().replace(/"/g,'').trim();for(var g=0;g<AN_PG_VAL.length;g++){for(var k=0;k<AN_PG_VAL[g].length;k++){if(label.indexOf(AN_PG_VAL[g][k])>=0)return{group:g,label:AN_PG_VAL[g][k]};}}return null;}

function anPgIsPageDim(label){label=(label==null?'':label).toString().toLowerCase();return['página','pagina','page','caminho','título','titulo','url','tela','landing'].some(function(a){return label.indexOf(a)>=0;});}

  var headerIdx=-1,sesCol=-1,recCol=-1,seslabel='Sessões';

      var sv=sesCol>=0?hNumParse(c[sesCol]):null,rv=recCol>=0?hNumParse(c[recCol]):null;if(sv==null&&rv==null)return;

    if(Object.keys(wide).length)return{mode:'wide',year:year,pages:wide};}

function anDashYoY(year,sec,k,idx,cur){if(idx==null||cur==null)return null;var py=anSeries(String(Number(year)-1),sec,'all',k)[idx];if(py==null||Number(py)===0)return null;return(cur-Number(py))/Math.abs(Number(py))*100;}
function anDashRevYoY(year,idx,cur){if(idx==null||cur==null)return null;var py=0,any=false;AN_REAL.forEach(function(pr){var v=anRevTotal(String(Number(year)-1),pr,idx);if(v!=null){py+=v;any=true;}});if(!any||py===0)return null;return(cur-py)/Math.abs(py)*100;}
function anGoSeo(tab){seoTab=tab||'opp';navTo('hub','seo');}
function anGoAds(){monTab='adsense';navTo('hub','monetizacao');}
function anDashSeriesStat(series){var f=[];series.forEach(function(v,i){if(v!=null)f.push({v:Number(v),i:i});});if(!f.length)return{cur:null,prev:null,varp:null,idx:null};var last=f[f.length-1],prev=f.length>1?f[f.length-2]:null;var varp=(prev&&prev.v!==0)?((last.v-prev.v)/Math.abs(prev.v)*100):null;return{cur:last.v,prev:prev?prev.v:null,varp:varp,idx:last.i};}
function anDashRevStat(year){var s=[];for(var mi=0;mi<12;mi++){var t=0,any=false;AN_REAL.forEach(function(pr){var v=anRevTotal(year,pr,mi);if(v!=null){t+=v;any=true;}});s.push(any?t:null);}return anDashSeriesStat(s);}
function anDashRpmStat(year){var s=[];for(var mi=0;mi<12;mi++){var rt=0,any=false;AN_REAL.forEach(function(pr){var v=anRevTotal(year,pr,mi);if(v!=null){rt+=v;any=true;}});var ses=anRevSessions(year,'all',mi);s.push((any&&ses&&ses>0)?rt/ses*1000:null);}return anDashSeriesStat(s);}
function anDashKpiCard(label,icon,st,fmt,inv,yoy){
  var sem=anSemaphore(st.varp==null?null:(inv?-st.varp:st.varp));
  var vh=st.varp==null?'<span class="an-var flat">—</span>':'<span class="an-var '+sem+'">'+(st.varp>=0?'▲ ':'▼ ')+Math.abs(st.varp).toFixed(1)+'%</span>';
  var yoyH='';
  if(yoy!=null){var ysem=anSemaphore(inv?-yoy:yoy),yc=anSemColor(ysem);yoyH='<span class="an-pill" title="vs mesmo mês do ano anterior">YoY: <b style="color:'+yc+'">'+(yoy>=0?'+':'')+yoy.toFixed(0)+'%</b></span>';}
  return '<div class="an-mcard"><div class="an-mcard-top"><div class="an-mcard-lbl"><i class="ti '+icon+'" style="font-size:13px;color:var(--primary);margin-right:5px"></i>'+label+'</div><span class="an-dot" style="background:'+anSemColor(sem)+'"></span></div>'
    +'<div class="an-mcard-valrow"><span class="an-mcard-val">'+(st.cur==null?'—':anFmt(st.cur,fmt))+'</span>'+vh+'</div>'
    +'<div class="an-mcard-foot"><span class="an-pill">Mês ant.: <b>'+(st.prev==null?'—':anShort(st.prev,fmt))+'</b></span>'+yoyH+(st.idx!=null?'<span class="an-pill">'+HMESES[st.idx]+'/'+String(anYear).slice(2)+'</span>':'')+'</div></div>';
}
function anDashAlerts(year){
  var out=[];
  DASH_WATCH.forEach(function(w){if(!AN_SECTIONS[w.sec])return;var st=anStats(year,w.sec,'all',w.k);if(st.varp==null)return;var th=anDashThrFor(w.sec+'.'+w.k);if(Math.abs(st.varp)<th)return;var meta=anMeta(w.sec,w.k);out.push({kind:'var',label:meta.l,sec:AN_SECTIONS[w.sec].l,varp:st.varp,good:meta.inv?st.varp<0:st.varp>0,fmt:meta.fmt,cur:st.cur,mi:st.idx});});
  var rv=anDashRevStat(year);if(rv.varp!=null&&Math.abs(rv.varp)>=anDashThrFor('rev.total'))out.push({kind:'var',label:'Receita total',sec:'Receitas',varp:rv.varp,good:rv.varp>0,fmt:'money',cur:rv.cur,mi:rv.idx});
  var rp=anDashRpmStat(year);if(rp.varp!=null&&Math.abs(rp.varp)>=anDashThrFor('rev.rpm'))out.push({kind:'var',label:'RPM unificado',sec:'Receitas',varp:rp.varp,good:rp.varp>0,fmt:'money',cur:rp.cur,mi:rp.idx});
  out.sort(function(a,b){return Math.abs(b.varp)-Math.abs(a.varp);});
  return out;
}
function anDashOpps(year){
  var out=[];
  var oppCount=0,oppTop=[];
  AN_REAL.forEach(function(pr){var ms=anSeoMonths(year,pr);if(!ms.length)return;var mi=ms[ms.length-1];anSeoRows(year,pr,mi).forEach(function(r){if(r.p!=null&&r.p>=3.5&&r.p<=20){oppCount++;oppTop.push({q:r.q,pr:pr,i:r.i,p:r.p});}});});
  oppTop.sort(function(a,b){return b.i-a.i;});
  if(oppCount>0)out.push({icon:'ti-target-arrow',type:'SEO',text:'<b>'+oppCount+'</b> termos na posição 4–20 (quase página 1). Destaque: <b>'+anEsc(oppTop[0].q)+'</b> · '+propLabel(oppTop[0].pr)+' · '+anFmt(oppTop[0].i,'int')+' impressões, posição '+oppTop[0].p.toFixed(1)+'.',act:"anGoSeo('opp')"});
  var decay=[];AN_REAL.forEach(function(pr){var ms=anSeoMonths(year,pr);if(ms.length<2)return;var mi=ms[ms.length-1],pmi=ms[ms.length-2],pm={};anSeoRows(year,pr,pmi).forEach(function(r){pm[r.q]=r;});anSeoRows(year,pr,mi).forEach(function(r){var p=pm[r.q];if(p&&r.c<p.c)decay.push({q:r.q,pr:pr,d:r.c-p.c});});});
  decay.sort(function(a,b){return a.d-b.d;});
  if(decay.length)out.push({icon:'ti-trending-down',type:'Decaimento',text:'<b>'+decay.length+'</b> conteúdos perderam cliques. Maior queda: <b>'+anEsc(decay[0].q)+'</b> · '+propLabel(decay[0].pr)+' ('+decay[0].d+' cliques). Reotimizar costuma ter ótimo retorno.',act:"anGoSeo('opp')"});
  var amY=String(new Date().getFullYear());if(anStore().ads[amY]){var amI=anAdsCurMi(),bd=anAdsBestDay(anAdsYear,amI,'rec');if(bd)out.push({icon:'ti-star-filled',type:'AdSense',text:'Melhor dia de receita em '+AN_MES_LONG[amI]+': <b>dia '+(bd.d+1)+'</b> ('+anFmt(bd.v,'money')+'). Veja o que aconteceu nesse dia e replique.',act:'anGoAds()'});}
  return out;
}
function anDashMetas(year){
  var s=anStore(),out=[],g=s.mgoals[year]||{};
  var now=new Date(),curY=String(now.getFullYear())===String(year),curMi=now.getMonth();
  Object.keys(g).forEach(function(sec){Object.keys(g[sec]).forEach(function(pr){Object.keys(g[sec][pr]).forEach(function(mk){Object.keys(g[sec][pr][mk]).forEach(function(mik){var goal=g[sec][pr][mk][mik];if(!goal||goal<=0)return;var mi=Number(mik);var real=anSeries(year,sec,pr,mk)[mi];var realN=(real==null||real==='')?0:Number(real);var meta=anMeta(sec,mk);
    var isCur=curY&&mi===curMi,proj=realN,status;
    if(isCur){var el=dElapsed(Number(year),mi),tot=dIM(Number(year),mi);
      if(meta.fmt==='int'||meta.fmt==='money'){proj=el>0?realN/el*tot:realN;}else{proj=realN;}
      status=proj>=goal*0.97?'ritmo':(proj<goal*0.9?'risco':'atencao');}
    else{status=realN>=goal?'batida':'naobatida';proj=realN;}
    out.push({sec:sec,pr:pr,mk:mk,mi:mi,goal:goal,real:realN,proj:proj,isCur:isCur,status:status,fmt:meta.fmt,label:meta.l,secL:(AN_SECTIONS[sec]?AN_SECTIONS[sec].l:sec)});});});});});
  out.sort(function(a,b){var ra={risco:0,atencao:1,naobatida:2,ritmo:3,batida:4};var ka=ra[a.status],kb=ra[b.status];if(ka!==kb)return ka-kb;return(a.real/a.goal)-(b.real/b.goal);});
  return out;
}
var DASH_METASTAT={risco:{l:'Em risco',c:'var(--danger)'},atencao:{l:'Atenção',c:'var(--warning)'},ritmo:{l:'No ritmo',c:'var(--success)'},batida:{l:'Batida',c:'var(--success)'},naobatida:{l:'Não batida',c:'var(--danger)'}};

function anSectionBody(){
  var h='';
  h+=anFocusBar();
  h+=anExecRow();
  h+=anGoalProgress();
  h+=anMetricCards();
  h+=anEntryBar();
  h+=anHistoryCharts();
  h+=anAnnotationsCard();
  return h;
}
function hGA(){
  anInit();
  if(anSection==='app'||anSection==='cwv'||anSection==='seo'||anSection==='gsc')anSection='traf';
  var years=anYears();if(!years.includes(anYear))anYear=years[years.length-1];
  if(anSection==='pages'){
    var hp=pageHeader('Analytics','Top Páginas · '+propLabel(anProp));
    hp+=anPropChips();
    hp+=anSubNav();
    hp+=anPgView();
    return '<div class="an-root">'+hp+'</div>';
  }
  if(anSection==='ret'){
    var hr=pageHeader('Analytics','Retenção (coortes) · '+propLabel(anProp));
    hr+=anPropChips();hr+=anSubNav();hr+=anRetView();
    return '<div class="an-root">'+hr+'</div>';
  }
  var h=pageHeader('Analytics', AN_SECTIONS[anSection].l+' · '+propLabel(anProp));
  h+=anPropChips();
  h+=anSubNav();
  if(anSection==='camp'){
    h+=anCampView();
    return '<div class="an-root">'+h+'</div>';
  }
  h+=anSectionBody();
  return '<div class="an-root">'+h+'</div>';
}
