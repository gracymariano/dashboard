<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardar Dinheiro — Dashboard & Projetos Ecossistema</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAFAF8;--bg2:#F2F1ED;--bg3:#fff;--tx:#1a1a1a;--tx2:#6b6b6b;--tx3:#999;--bd:rgba(0,0,0,.1);--bd2:rgba(0,0,0,.18);--pur:#534AB7;--grn:#1D9E75;--cor:#D85A30;--blu:#378ADD;--amb:#BA7517;--red:#E24B4A;--teal:#0F6E56}
@media(prefers-color-scheme:dark){:root{--bg:#141414;--bg2:#1e1e1e;--bg3:#232323;--tx:#e8e8e8;--tx2:#999;--tx3:#666;--bd:rgba(255,255,255,.08);--bd2:rgba(255,255,255,.15)}}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:15px}
.C{max-width:1060px;margin:0 auto;padding:1.25rem}
.H{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:.75rem}
.HL{display:flex;align-items:center;gap:14px}.logo{height:52px}
.HL h1{font-family:'Playfair Display',Georgia,serif;font-size:21px;font-weight:500}.HL p{font-size:12px;color:var(--tx2);margin-top:1px}
.HR{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.sb{font-size:10px;color:var(--tx3);background:var(--bg2);padding:4px 9px;border-radius:5px;display:flex;align-items:center;gap:3px}
.hb{font-size:10px;padding:4px 9px;border-radius:5px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx2);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:3px}.hb:hover{border-color:var(--bd2)}
.tabs{display:flex;gap:0;margin-bottom:.75rem;border-bottom:1px solid var(--bd);overflow-x:auto}
.tb{padding:8px 16px;font-size:12px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--tx2);border-bottom:2px solid transparent;transition:.15s;font-family:inherit;white-space:nowrap}.tb:hover{color:var(--tx)}.tb.a{color:var(--pur);border-bottom-color:var(--pur)}
.mn{display:flex;gap:5px;margin-bottom:.7rem;flex-wrap:wrap}
.mb{padding:5px 13px;border-radius:7px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid var(--bd);background:var(--bg3);color:var(--tx2);transition:.15s;font-family:inherit}.mb:hover{border-color:var(--bd2)}.mb.a{background:var(--pur);color:#fff;border-color:var(--pur)}.mb .p{font-size:9px;opacity:.7;margin-left:2px}
.S{margin-bottom:1.1rem}.ST{font-size:11px;font-weight:700;color:var(--tx2);margin-bottom:7px;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.G{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:8px}
.D{background:var(--bg3);border:1px solid var(--bd);border-radius:10px;padding:11px 13px}
.D .L{font-size:10px;color:var(--tx3);margin-bottom:4px;display:flex;align-items:center;justify-content:space-between}
.D .L .E{cursor:pointer;font-size:12px;color:var(--tx3);transition:.15s}.D .L .E:hover{color:var(--pur)}
.D .V{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}.D .R{font-size:20px;font-weight:600}.D .M{font-size:20px;font-weight:600;color:var(--tx)}
.D .Su{font-size:11px;color:var(--tx3)}
.B{height:4px;background:var(--bd);border-radius:2px;margin-top:6px;overflow:hidden}.BF{height:100%;border-radius:2px;transition:width .4s}
.Bp{font-size:9px;color:var(--tx2);margin-top:3px;text-align:right}
.vd{font-size:10px;font-weight:600;margin-left:4px;display:inline-flex;align-items:center;gap:3px;padding:1px 5px;border-radius:4px}
.vu{color:var(--grn);background:rgba(29,158,117,.1)}.vw{color:var(--red);background:rgba(226,75,74,.1)}.vm{color:var(--amb);background:rgba(186,117,23,.1)}
.saf{width:6px;height:6px;border-radius:50%;flex-shrink:0;display:inline-block}
.vu .saf{background:var(--grn)}.vw .saf{background:var(--red)}.vm .saf{background:var(--amb)}
.ant-edit{cursor:pointer;font-size:9px;color:var(--tx3)}.ant-edit:hover{color:var(--pur)}
.rg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px}
.rc{background:var(--bg2);border-radius:8px;padding:9px 11px}
.rc .rl{font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:.3px;display:flex;align-items:center;justify-content:space-between}
.rc .rl .E{cursor:pointer;font-size:11px;color:var(--tx3)}
.rc .rv{font-size:15px;font-weight:600;margin-top:2px}
/* Table */
.T{width:100%;border-collapse:collapse;font-size:10px;margin-top:3px}
.T th{text-align:left;padding:4px 6px;font-size:9px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--bd);background:var(--bg2)}
.T th:not(:first-child){text-align:right}.T td{padding:5px 6px;border-bottom:1px solid var(--bd)}.T td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
.T tr:hover{background:var(--bg2)}.T .un{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Phase */
.PB{display:flex;align-items:center;gap:9px;margin-bottom:.6rem;padding:9px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--bg3)}
.PI{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.PF{flex:1}.PF .PN{font-size:12px;font-weight:500}.PF .PD{font-size:10px;color:var(--tx2)}
.PW{display:flex;align-items:center;gap:6px;margin-top:3px}.PWB{flex:1;height:3px;background:var(--bd);border-radius:2px;overflow:hidden}.PWF{height:100%;border-radius:2px;transition:width .4s}.PWP{font-size:9px;color:var(--tx2);min-width:24px;text-align:right;font-weight:500}
.leg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:.6rem}.leg span{font-size:9px;display:flex;align-items:center;gap:3px;color:var(--tx2)}.leg span i{width:6px;height:6px;border-radius:2px;display:inline-block}
/* Calendar */
.cg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:.75rem}
.ch{font-size:9px;font-weight:600;color:var(--tx3);text-align:center;padding:3px 0;text-transform:uppercase;letter-spacing:.4px}
.cd{border-radius:6px;padding:5px;min-height:76px;cursor:pointer;border:1px solid var(--bd);background:var(--bg3);transition:.15s;position:relative}
.cd:hover{border-color:var(--bd2);transform:translateY(-1px)}.cd.sl{border-color:var(--pur);border-width:2px}
.cd .cn{font-size:9px;font-weight:500;margin-bottom:2px}.cd .ct{font-size:7px;padding:1px 4px;border-radius:3px;display:inline-block;margin-bottom:2px;font-weight:500}
.cd .ck{font-size:8px;color:var(--tx2);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cd .cx{position:absolute;top:4px;right:4px;width:13px;height:13px;border-radius:50%;border:1.5px solid var(--bd2);display:flex;align-items:center;justify-content:center;font-size:7px;cursor:pointer;background:var(--bg3);transition:.15s}
.cd .cx:hover{border-color:var(--grn)}.cd .cx.xd{background:var(--grn);border-color:var(--grn);color:#fff}.cd.ad{opacity:.5}
.ce{opacity:.28;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;border-style:dashed}.ce:hover{opacity:.55;border-color:var(--pur)}.ce .ah{color:var(--tx3);margin-top:5px;font-size:11px}
/* Tags */
.t-seo{background:#E6F1FB;color:#0C447C}.t-conteudo{background:#EEEDFE;color:#3C3489}.t-pinterest{background:#FBEAF0;color:#72243E}.t-comercial{background:#FAEEDA;color:#633806}.t-dados{background:#EAF3DE;color:#27500A}.t-produto{background:#FAECE7;color:#712B13}.t-ads{background:#FCEBEB;color:#791F1F}.t-planejamento{background:#F1EFE8;color:#444441}
@media(prefers-color-scheme:dark){.t-seo{background:#0C447C;color:#B5D4F4}.t-conteudo{background:#3C3489;color:#CECBF6}.t-pinterest{background:#72243E;color:#F4C0D1}.t-comercial{background:#633806;color:#FAC775}.t-dados{background:#27500A;color:#C0DD97}.t-produto{background:#712B13;color:#F5C4B3}.t-ads{background:#791F1F;color:#F7C1C1}.t-planejamento{background:#444441;color:#D3D1C7}}
/* Detail */
.dp{border-radius:8px;border:1px solid var(--bd);background:var(--bg3);padding:.7rem .9rem;margin-bottom:.6rem;animation:si .2s ease}
@keyframes si{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.dp h3{font-size:13px;font-weight:500;margin-bottom:2px}.dp .dd{font-size:10px;color:var(--tx2);margin-bottom:7px;padding-bottom:7px;border-bottom:1px solid var(--bd)}
.cl{list-style:none}.cl li{display:flex;align-items:flex-start;gap:6px;padding:4px 0;font-size:11px;border-bottom:1px solid var(--bd);transition:.15s}.cl li:last-child{border-bottom:none}
.cl li .cb{width:15px;height:15px;border-radius:3px;border:1.5px solid var(--bd2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:8px;flex-shrink:0;margin-top:1px;background:var(--bg3);transition:.15s}
.cl li .cb:hover{border-color:var(--grn)}.cl li .cb.xd{background:var(--grn);border-color:var(--grn);color:#fff}
.cl li.td span{text-decoration:line-through;color:var(--tx3)}
.ta{display:flex;gap:3px;opacity:0;transition:.15s;flex-shrink:0}.cl li:hover .ta{opacity:1}
.ab{display:flex;align-items:center;gap:4px;margin-top:6px;padding:5px 10px;border-radius:6px;border:1px dashed var(--bd2);background:none;color:var(--tx2);font-size:11px;font-family:inherit;cursor:pointer;width:100%;transition:.15s}.ab:hover{border-color:var(--pur);color:var(--pur);background:var(--bg2)}
/* Costs */
.ct{width:100%;border-collapse:collapse;font-size:10px}.ct th{text-align:left;padding:4px 7px;font-size:9px;font-weight:600;color:#fff;background:var(--teal)}
.ct th:first-child{border-radius:4px 0 0 0}.ct th:last-child{border-radius:0 4px 0 0;text-align:right}
.ct td{padding:5px 7px;border-bottom:1px solid var(--bd)}.ct td:last-child{text-align:right;font-weight:500}
.ct .su td{color:var(--teal);font-weight:600;border-bottom:2px solid var(--teal)}.ct .to td{background:var(--teal);color:#fff;font-weight:500;font-size:11px}
/* Pricing rules */
.pr-tbl{width:100%;border-collapse:collapse;font-size:10px;margin-top:4px}.pr-tbl th{text-align:left;padding:4px 6px;font-size:9px;font-weight:600;color:var(--tx3);border-bottom:1px solid var(--bd);background:var(--bg2)}
.pr-tbl td{padding:5px 6px;border-bottom:1px solid var(--bd)}.pr-tbl td[contenteditable]{cursor:text}.pr-tbl select{font-size:10px;padding:2px 4px;border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--tx);font-family:inherit}
/* Saz */
.zm{margin-bottom:1rem}.zmh{font-size:13px;font-weight:500;margin-bottom:5px;display:flex;align-items:center;gap:5px}
.zg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:5px}
.zc{background:var(--bg3);border:1px solid var(--bd);border-radius:6px;padding:7px 9px}
.zc .zt{font-size:7px;padding:1px 4px;border-radius:3px;display:inline-block;margin-bottom:2px;font-weight:500}.zc .zn{font-size:11px;font-weight:500;margin-bottom:1px}.zc .zd{font-size:9px;color:var(--tx2);line-height:1.3}
.st-feriado{background:#FCEBEB;color:#791F1F}.st-comercial{background:#FAEEDA;color:#633806}.st-comportamento{background:#EEEDFE;color:#3C3489}.st-financeiro{background:#EAF3DE;color:#27500A}.st-viagem{background:#E6F1FB;color:#0C447C}
@media(prefers-color-scheme:dark){.st-feriado{background:#791F1F;color:#F7C1C1}.st-comercial{background:#633806;color:#FAC775}.st-comportamento{background:#3C3489;color:#CECBF6}.st-financeiro{background:#27500A;color:#C0DD97}.st-viagem{background:#0C447C;color:#B5D4F4}}
/* Modal */
.ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:1000;animation:fi .15s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.mx{background:var(--bg3);border-radius:10px;padding:1.1rem;width:330px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.mx h4{font-size:13px;font-weight:500;margin-bottom:8px}
.mx input,.mx select{width:100%;padding:6px 9px;border:1px solid var(--bd2);border-radius:6px;font-size:12px;font-family:inherit;background:var(--bg);color:var(--tx);margin-bottom:6px}
.mx .mbb{display:flex;gap:5px;justify-content:flex-end}
.mx button{padding:4px 12px;border-radius:5px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-family:inherit;transition:.15s}
.mx button.pr{background:var(--pur);color:#fff;border-color:var(--pur)}.mx button:hover{opacity:.85}
/* Classification badge select */
.cls-sel{font-size:9px;padding:1px 4px;border:1px solid var(--bd);border-radius:3px;background:var(--bg);color:var(--tx);font-family:inherit;cursor:pointer;margin-left:4px}
.footer{text-align:center;padding:1rem 0 .5rem;font-size:9px;color:var(--tx3)}
@media(max-width:700px){.C{padding:.75rem}.cg{gap:2px}.cd{padding:4px;min-height:64px}.G{grid-template-columns:1fr 1fr}.rg{grid-template-columns:1fr 1fr}.D .R,.D .M{font-size:17px}.rc .rv{font-size:13px}.tabs{-webkit-overflow-scrolling:touch}.T th,.T td{padding:4px 5px;font-size:9px}.ST{font-size:10px}.HL h1{font-size:17px}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
</style>
</head>

    h+=`<tr class="su"><td>Subtotal ${cat.cat}</td><td>${fR(sub)}</td></tr></table>`;
    h+=`<button class="ab" style="margin:3px 0 8px" onclick="sM('Nome do item','',v=>{if(!v.trim())return;const c=gCosts(${cM});c[${ci}].items.push({n:v.trim(),brl:0});sCosts(${cM},c)},'text')"><i class="ti ti-plus" style="font-size:10px"></i> Item</button>`;
  });
  h+=`<button class="ab" style="margin-bottom:5px" onclick="sM('Nova categoria','',v=>{if(!v.trim())return;const c=gCosts(${cM});c.push({cat:v.trim(),items:[]});sCosts(${cM},c)},'text')"><i class="ti ti-plus" style="font-size:10px"></i> Nova categoria</button>`;
  h+=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px"><div class="rc" style="flex:1;min-width:160px;background:var(--teal);color:#fff"><div class="rl" style="color:rgba(255,255,255,.7)">Custo total</div><div class="rv" style="color:#fff">${fR(tCost)}</div></div>`;
  h+=`<div class="rc" style="flex:1;min-width:160px"><div class="rl">Receita Ad Mgr <span class="E" onclick="sM('Receita Ad Manager',${adMR},v=>{sA(${cM},'ad_mgr',v)})"><i class="ti ti-edit"></i></span></div><div class="rv">${fR(adMR)} ${dlP(adMR,adMP)}</div><div style="font-size:9px;color:var(--tx3)"><span class="E ant-edit" onclick="sM('Ad Manager — mês ant.',${adMP},v=>{sA(${pvEff},'ad_mgr',v)})">Ant: ${adMP?fR(adMP):'—'} <i class="ti ti-edit" style="font-size:9px;opacity:.45"></i></span></div></div></div></div>`;

  CATS.forEach(k=>{
    // Count tasks classified with this category
    let count=0;allDays(cM).forEach(d=>{gTk(cM,d).forEach((_,i)=>{if(gCls(cM,d,i)===k && cT[K(cM,d,i)])count++})});
    const tg=m.tgt[k]||0;const p=pC(count,tg);
    h+=`<div class="rc"><div class="rl">${CATL[k]}</div><div class="rv" style="color:${CATC[k]}">${count} <span style="font-size:9px;color:var(--tx3)">/ ${tg}</span></div><div class="B" style="margin-top:3px"><div class="BF" style="width:${p}%;background:${CATC[k]}"></div></div></div>`});
  h+=`</div></div></div></div>`;
  // Legend
  h+=`<div class="leg"><span><i style="background:#E6F1FB"></i>SEO</span><span><i style="background:#EEEDFE"></i>Conteúdo</span><span><i style="background:#FBEAF0"></i>Pinterest</span><span><i style="background:#FAEEDA"></i>Comercial</span><span><i style="background:#EAF3DE"></i>Dados</span><span><i style="background:#FAECE7"></i>Produto</span><span><i style="background:#FCEBEB"></i>Ads</span><span><i style="background:#F1EFE8"></i>Planejamento</span></div>`;
  // Calendar
  const fd=fDw(m.y,m.mo),td=dIM(m.y,m.mo),dm={};
  m.days.forEach(d=>dm[d.d]=d);
  Object.keys(tE).forEach(k=>{const mt=k.match(new RegExp('^'+cM+'-(\\d+)$'));if(mt){const dn=+mt[1];if(!dm[dn])dm[dn]={d:dn,custom:1}}});
  h+=`<div class="cg">`;h+=['Seg','Ter','Qua','Qui','Sex'].map(d=>`<div class="ch">${d}</div>`).join('');
  let dn=1,wd=0;while(wd<fd){if(wd%7<5)h+='<div></div>';wd++}
  while(dn<=td){let w=(fd+dn-1)%7;if(w>=5){dn++;continue}
    if(dm[dn]){const tk=gTk(cM,dn),tt2=gTt(cM,dn),tg=gTg(cM,dn),tl=gTl(cM,dn);
      const dd=tk.length>0&&tk.every((_,i)=>cT[K(cM,dn,i)]);
      h+=`<div class="cd ${selD===dn?'sl':''} ${dd?'ad':''}" onclick="selD=${dn};R()"><div class="cn">${String(dn).padStart(2,'0')}</div><div class="ct t-${tg}">${tl}</div><div class="ck">${tt2}</div><div class="cx ${dd?'xd':''}" onclick="event.stopPropagation();togAll(${cM},${dn});R()">${dd?'<i class="ti ti-check"></i>':''}</div></div>`
    }else{h+=`<div class="cd ce" onclick="addDay(${cM},${dn})"><div class="cn" style="color:var(--tx3)">${String(dn).padStart(2,'0')}</div><div class="ah"><i class="ti ti-plus"></i></div></div>`}
    dn++}h+='</div>';
  // Detail
  if(selD&&(dm[selD]||hasD(cM,selD))){const tk=gTk(cM,selD),tt2=gTt(cM,selD),tg=gTg(cM,selD),tl=gTl(cM,selD);
    const mn=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
    h+=`<div class="dp"><div style="display:flex;align-items:center;justify-content:space-between"><h3>${tt2}</h3><div style="display:flex;gap:4px"><span class="E" onclick="eDt(${cM},${selD})"><i class="ti ti-edit" style="font-size:13px"></i></span><span class="E" onclick="cDg(${cM},${selD})"><i class="ti ti-tag" style="font-size:13px"></i></span></div></div>`;

// ===== CSV IMPORT (GA4) =====
let _csv=null;
function importCSV(m,s){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.csv,text/csv,application/csv';
  inp.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=ev=>_parseGA4CSV(m,s,ev.target.result);
    rd.readAsText(f,'UTF-8');
  };
  inp.click();
}
function _csvRow(line){
  // Parser CSV robusto com suporte a campos entre aspas e delimitadores , ou ;
  const r=[];let q=false,c='';
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){q=!q;}
    else if((ch===','||ch===';')&&!q){r.push(c.trim());c='';}
    else c+=ch;
  }
  r.push(c.trim());return r;
}
function _parseGA4CSV(m,s,txt){
  // Remover BOM (UTF-8)
  if(txt.charCodeAt(0)===0xFEFF)txt=txt.slice(1);
  // Separar linhas, ignorar linhas de metadados (# ou vazias)
  const lines=txt.split('\n')
    .map(l=>l.trim())
    .filter(l=>l&&!l.startsWith('#')&&!l.startsWith('"#')&&l!=='""');
  if(!lines.length){alert('CSV vazio ou sem dados reconhecíveis.');return;}
  // Linha de cabeçalho = primeira linha não-metadado
  const hdr=_csvRow(lines[0]).map(h=>h.toLowerCase().replace(/"/g,'').trim());
  // Detectar coluna de página/URL
  const pathIdx=hdr.findIndex(h=>
    h.includes('page path')||h==='page title and screen class'||
    h.includes('pagina')||h.includes('página')||
    h==='url'||h==='page'||h.includes('screen')
  );
  // Detectar coluna de sessões
  const sessIdx=hdr.findIndex(h=>
    h==='sessions'||h==='sessões'||h==='sessoes'||
    h.includes('session')||h.includes('sessão')
  );
  if(pathIdx===-1||sessIdx===-1){
    alert(
      'Colunas não reconhecidas automaticamente.\n\n'+
      'Colunas detectadas: '+hdr.join(' | ')+'\n\n'+
      'O CSV precisa ter colunas de "Page path" e "Sessions".\n'+
      'Dica: no GA4, exporte o relatório "Páginas e telas" (Pages and screens).'
    );
    return;
  }
  // Parsear linhas de dados
  const rows=[];
  for(let i=1;i<lines.length;i++){
    const cols=_csvRow(lines[i]);
    if(cols.length<=Math.max(pathIdx,sessIdx))continue;
    const path=(cols[pathIdx]||'').replace(/"/g,'').trim();
    const rawSess=(cols[sessIdx]||'0').replace(/"/g,'').replace(/[,\.]/g,'').trim();
    const sess=parseInt(rawSess)||0;
    // Ignorar linhas de total ou inválidas
    if(!path||path.toLowerCase()==='total'||path==='(not set)'||path==='(not provided)')continue;
    rows.push({n:path,cur:sess,prev:0});
  }
  if(!rows.length){alert('Nenhuma página encontrada no CSV.\nVerifique se o arquivo está correto.');return;}
  // Mostrar preview (máx 25 linhas)
  _csv={m,s,rows:rows.slice(0,25),total:rows.length};
  const sL={gd:'Guardar Dinheiro (principal)',blog:'Blog Guardar Dinheiro',cora:'CoraCora News'};
  const o=document.createElement('div');o.className='ov';o.id='ov-csv';
  o.innerHTML=`<div class="mx" style="width:540px;max-width:96vw;max-height:85vh;display:flex;flex-direction:column;gap:0">
    <h4 style="display:flex;align-items:center;gap:6px"><i class="ti ti-file-import" style="color:var(--pur)"></i> Importar CSV — ${sL[s]}</h4>
    <p style="font-size:11px;color:var(--tx2);margin:6px 0 10px;line-height:1.5">
      <strong>${rows.length}</strong> páginas encontradas${rows.length>25?' (mostrando as 25 primeiras)':''}.
      Os valores serão salvos como <strong>Atual (parcial)</strong>.
      O campo <em>Mês anterior</em> pode ser editado depois clicando em cada linha da tabela.
    </p>
    <div style="overflow-y:auto;flex:1;border:1px solid var(--bd);border-radius:6px;margin-bottom:10px">
    <table style="width:100%;border-collapse:collapse;font-size:10px">
      <tr style="position:sticky;top:0">
        <th style="text-align:left;padding:5px 8px;border-bottom:1px solid var(--bd);color:var(--tx3);background:var(--bg2);font-weight:600">Página / URL</th>
        <th style="text-align:right;padding:5px 8px;border-bottom:1px solid var(--bd);color:var(--tx3);background:var(--bg2);font-weight:600">Sessões</th>
      </tr>
      ${_csv.rows.map((r,i)=>`<tr style="${i%2?'background:var(--bg2)':''}"><td style="padding:5px 8px;border-bottom:1px solid var(--bd);max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.n}</td><td style="text-align:right;padding:5px 8px;border-bottom:1px solid var(--bd);font-weight:600;font-variant-numeric:tabular-nums">${fN(r.cur)}</td></tr>`).join('')}
    </table>
    </div>
    <div class="mbb">
      <button onclick="document.getElementById('ov-csv')?.remove();_csv=null">Cancelar</button>
      <button class="pr" onclick="_cfCSV()"><i class="ti ti-check" style="font-size:11px"></i> Confirmar importação</button>
    </div>
  </div>`;
  document.body.appendChild(o);
  o.addEventListener('click',e=>{if(e.target===o){o.remove();_csv=null;}});
}
function _cfCSV(){
  if(!_csv)return;
  // Preservar valores de "mês anterior" já existentes para a mesma URL
  const existing=gU(_csv.m,_csv.s);
  const merged=_csv.rows.map(r=>{
    const found=existing.find(e=>e.n===r.n);
    return found?{...r,prev:found.prev}:r;
  });
  sU(_csv.m,_csv.s,merged);
  _csv=null;
  document.getElementById('ov-csv')?.remove();
  R();
}

ld().then(()=>R());
