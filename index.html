/* ── Componente: progresso da meta DO MÊS (métrica em foco) ── */
function anGoalProgress(){
  var sec=AN_SECTIONS[anSection];
  var mk=anCurGoalMk(),meta=anMeta(anSection,mk);
  var mi=anCurGoalMi();
  var goal=anMGoal(anYear,anSection,anProp,mi,mk);
  var real=anSeries(anYear,anSection,anProp,mk)[mi];
  var realNum=(real==null||real==='')?0:Number(real);
  var prevVal=mi>0?anSeries(anYear,anSection,anProp,mk)[mi-1]:null;
  var now=new Date(),isCurMonth=String(now.getFullYear())===String(anYear)&&now.getMonth()===mi;
  var projVal=null;
  if(isCurMonth&&(meta.fmt==='int'||meta.fmt==='money')){var dE=dElapsed(Number(anYear),mi),tD=dIM(Number(anYear),mi);if(dE>0)projVal=proj(realNum,dE,tD);}
  var pct=goal>0?(realNum/goal*100):null;
  var projPct=(goal>0&&projVal!=null)?(projVal/goal*100):null;
  var pctClamp=pct==null?0:Math.max(0,Math.min(100,pct));
  var col=pct==null?'var(--text-secondary)':pct>=100?'var(--success)':pct>=60?'var(--warning)':'var(--danger)';
  var projCol=projPct==null?col:projPct>=100?'var(--success)':projPct>=60?'var(--warning)':'var(--danger)';
  var mSel='<select class="fsel" onchange="anSetGoalMetric(this.value)" title="Métrica da meta">'+sec.metrics.map(function(m){return '<option value="'+m.k+'"'+(m.k===mk?' selected':'')+'>'+m.l+'</option>';}).join('')+'</select>';
  var moSel='<select class="fsel" onchange="anSetGoalMonth(this.value)" title="Mês da meta">'+AN_MES_LONG.map(function(nm,i){return '<option value="'+i+'"'+(i===mi?' selected':'')+'>'+nm+'/'+anYear+'</option>';}).join('')+'</select>';
  var setBtn='<button class="an-btn prim" onclick="anMGoalEdit('+mi+')"><i class="ti ti-target"></i> '+(goal>0?'Editar meta':'Definir meta')+'</button>';
  // mesma ordem e estilo de "pill" usado nos cards de métrica (Realizado | Mês anterior | Meta | Falta | Projeção do mês)
  function pair(lbl,val,color){return '<div class="an-gp-pair"><span>'+lbl+'</span><b'+(color?' style="color:'+color+'"':'')+'>'+val+'</b></div>';}
  var right;
  if(goal>0){
    var falta=goal-realNum;
    right='<div class="an-gp-nums">'
      +pair('Realizado',anFmt(realNum,meta.fmt))
      +pair('Mês anterior ('+(mi>0?HMESES[mi-1]:'—')+')',prevVal!=null?anFmt(prevVal,meta.fmt):'—')
      +pair('Meta',anFmt(goal,meta.fmt))
      +pair((falta>0?'Falta':'Excedente'),anFmt(Math.abs(falta),meta.fmt),col)
      +(projVal!=null?pair('Projeção do mês',anFmt(projVal,meta.fmt)+(projPct!=null?' ('+projPct.toFixed(0)+'%)':''),projCol):'')
      +'<div class="an-gp-pct" style="color:'+col+'">'+pct.toFixed(0)+'%</div></div>';
  }else{
    right='<div class="an-gp-nums">'
      +pair('Realizado',anFmt(realNum,meta.fmt))
      +pair('Mês anterior ('+(mi>0?HMESES[mi-1]:'—')+')',prevVal!=null?anFmt(prevVal,meta.fmt):'—')
      +'<div style="font-size:11.5px;color:var(--text-secondary);align-self:center">Escolha a métrica e o mês acima e defina a meta para acompanhar o progresso.</div></div>';
  }
  var projNote=(goal>0&&isCurMonth&&projVal==null)?'<div class="an-card-sub" style="margin-top:6px"><i class="ti ti-info-circle" style="font-size:11px"></i> Projeção indisponível para esta métrica (disponível para métricas acumulativas como cliques/impressões/sessões/receita).</div>':'';
  return '<div class="an-card an-gp">'
    +'<div class="an-gp-hd"><div class="an-card-ttl"><i class="ti ti-flag-check"></i> Meta do mês</div>'
    +'<div class="an-gp-controls">'+mSel+moSel+setBtn+'</div></div>'
    +'<div class="an-gp-bar"><div class="an-gp-fill" style="width:'+pctClamp.toFixed(1)+'%;background:'+col+'"></div>'
    +(goal>0&&projPct!=null?'<div class="an-gp-fill" style="position:absolute;top:0;left:0;height:100%;width:'+Math.max(0,Math.min(100,projPct)).toFixed(1)+'%;background:'+projCol+';opacity:.35"></div>':'')
    +'</div>'
    +right+projNote+'</div>';
}

  var mk=anCurGoalMk(),meta=anMeta(anSection,mk),cur=anMGoal(anYear,anSection,anProp,mi,mk);
  sM('Meta de '+AN_MES_LONG[mi]+'/'+anYear+' — '+meta.l+' ('+propLabel(anProp)+')',cur||'',function(v){anSetMGoal(anYear,anSection,anProp,mi,mk,v);anR();toast('Meta do mês atualizada.','ti-target');},'number');

/* ── Gráfico anual de barras arredondadas ── */
function anBarChart(arr,fmt){
  var vals=arr.map(function(v){return v==null?null:Number(v);});
  var mx=Math.max.apply(null,[1].concat(vals.map(function(v){return v||0;})));
  var W=720,H=250,padL=10,padR=10,padT=26,padB=34,plotH=H-padT-padB,baseY=padT+plotH;
  var slot=(W-padL-padR)/12,bw=Math.min(36,slot*0.56);
  var out='<defs><linearGradient id="anGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#16C79A"/><stop offset="100%" stop-color="#008B8B"/></linearGradient></defs>';
  for(var i=0;i<12;i++){
    var cx=padL+slot*i+slot/2,x=cx-bw/2,v=vals[i],has=v!=null;
    var bh=has?Math.max(4,Math.round((v||0)/mx*plotH)):0,y=baseY-bh;
    if(has){
      out+='<g class="an-bar-g" onclick="anOpenPanel('+i+')">'
        +'<rect class="an-bar" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh+'" rx="7" fill="url(#anGrad)"><title>'+HMESES[i]+': '+anFmt(v,fmt)+'</title></rect>';
      if(bh>24)out+='<text class="an-bar-val" x="'+cx.toFixed(1)+'" y="'+(y-6).toFixed(1)+'" text-anchor="middle">'+anShort(v,fmt)+'</text>';
      out+='</g>';
    }else{
      out+='<rect x="'+x.toFixed(1)+'" y="'+(baseY-3)+'" width="'+bw.toFixed(1)+'" height="3" rx="1.5" fill="rgba(11,34,57,.08)"><title>'+HMESES[i]+': sem dados</title></rect>';
    }
    out+='<text class="an-axis" x="'+cx.toFixed(1)+'" y="'+(baseY+17)+'" text-anchor="middle">'+HMESES[i]+'</text>';
    var nc=anNoteCount(anYear,i);
    if(nc)out+='<circle cx="'+(cx+bw/2-1).toFixed(1)+'" cy="'+(has?(y+6):(baseY-7)).toFixed(1)+'" r="3.2" fill="var(--warning)"><title>'+nc+' anotação(ões) em '+HMESES[i]+'</title></circle>';
  }
  return '<div class="an-chart"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" class="an-chart-svg">'+out+'</svg></div>';

/* ── Gráfico de linhas (comparação por propriedade) ── */
function anLineChart(series,fmt){
  var flat=[];series.forEach(function(s){(s.vals||[]).forEach(function(v){if(v!=null)flat.push(Number(v));});});
  var mx=Math.max.apply(null,[1].concat(flat));
  var n=12,W=720,H=250,padL=44,padR=12,padT=14,padB=28,plotH=H-padT-padB,baseY=padT+plotH;
  var step=(W-padL-padR)/(n-1);
  var X=function(i){return padL+i*step;},Y=function(v){return baseY-(v/mx)*plotH;};
  var g='';for(var k=0;k<=4;k++){var gy=baseY-(k/4)*plotH,gv=Math.round(mx*k/4);
    g+='<line x1="'+padL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+gy.toFixed(1)+'" stroke="rgba(11,34,57,.07)" stroke-width="1"/>'
      +'<text class="an-axis" x="'+(padL-6)+'" y="'+(gy+3).toFixed(1)+'" text-anchor="end">'+fN(gv)+'</text>';}
  var xl='';for(var i=0;i<n;i++)xl+='<text class="an-axis" x="'+X(i).toFixed(1)+'" y="'+(baseY+16)+'" text-anchor="middle">'+HMESES[i]+'</text>';
  var lines='';

    if(pts.length>1)lines+='<polyline fill="none" stroke="'+s.color+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" points="'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ')+'"/>';
    pts.forEach(function(p){lines+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="'+s.color+'"><title>'+s.label+' — '+HMESES[p[2]]+': '+anFmt(p[3],fmt)+'</title></circle>';});
  });
  return '<div class="an-chart"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" class="an-chart-svg">'+g+xl+lines+'</svg></div>';

    else{var rd=new FileReader();rd.onload=function(ev){var txt=ev.target.result;if(txt.charCodeAt(0)===0xFEFF)txt=txt.slice(1);var rows=txt.split(/\r?\n/).filter(function(l){return l.trim();}).map(function(l){return _csvRow(l);});anPreview(section,prop,rows,f.name);};rd.readAsText(f,'UTF-8');}

function _parseYM(s){s=String(s==null?'':s).trim();if(!s)return null;
  var m=s.match(/(20\d{2})-(\d{2})-\d{2}/)||s.match(/(20\d{2})(\d{2})\d{2}/);if(m)return{y:m[1],mi:parseInt(m[2],10)-1};
  m=s.match(/\b(\d{1,2})\/(\d{1,2})\/(20\d{2})\b/);if(m)return{y:m[3],mi:parseInt(m[2],10)-1};
  return null;}
function anParse(section,rows){
  var sec=AN_SECTIONS[section];
  var monthIdx=-1,year=anYear;
  // detectar data (Data de início: AAAAMMDD ou dd/mm/aaaa) em qualquer célula/comentário — usa TODAS as linhas, inclusive cabeçalho do GA4
  var flat=[];rows.forEach(function(r){(r||[]).forEach(function(c){flat.push(String(c==null?'':c));});});
  for(var fi=0;fi<flat.length;fi++){var cell=flat[fi];
    var m=cell.match(/(20\d{2})-(\d{2})-\d{2}/);if(m){year=m[1];monthIdx=parseInt(m[2],10)-1;break;}
    m=cell.match(/(20\d{2})(\d{2})\d{2}/);if(m){year=m[1];monthIdx=parseInt(m[2],10)-1;break;}
    m=cell.match(/\b(\d{1,2})\/(\d{1,2})\/(20\d{2})\b/);if(m){year=m[3];monthIdx=parseInt(m[2],10)-1;break;}
  }
  // remover comentários do GA4 (linhas iniciadas por '#') e linhas vazias antes de analisar a estrutura
  var clean=rows.filter(function(cols){if(!cols||!cols.length)return false;
    var first=String(cols[0]==null?'':cols[0]).trim();
    if(first.charAt(0)==='#')return false;
    var any=cols.some(function(c){return String(c==null?'':c).trim()!=='';});
    return any;});
  var result={};
  // formato largo (modelo do sistema): métrica na 1ª coluna + ao menos 2 valores numéricos
  var wideRows=clean.filter(function(cols){if(!anMatchCol(sec,cols[0]))return false;
    var nn=0;for(var i=1;i<cols.length;i++){if(hNumParse(cols[i])!=null)nn++;}return nn>=2;});
  if(wideRows.length>=2){
    wideRows.forEach(function(cols){var mk=anMatchCol(sec,cols[0]);if(!mk||result[mk])return;var meta=anMeta(section,mk);
      var nums=[];for(var i=1;i<cols.length&&nums.length<12;i++)nums.push(meta.fmt==='pct'?hPctParse(cols[i]):hNumParse(cols[i]));while(nums.length<12)nums.push(null);result[mk]=nums;});
    return{mode:'wide',data:result,year:year,monthIdx:-1,defMode:'replace'};
  }
  // formato GA4: cabeçalho com métricas em colunas, dados por canal/linha
  var headerIdx=-1,colMap={};
  for(var r=0;r<clean.length;r++){var cols=clean[r];if(cols.length<2)continue;var map={},hits=0;
    cols.forEach(function(c,ci){var mk=anMatchCol(sec,c);if(mk&&map[mk]==null){map[mk]=ci;hits++;}});
    if(hits>=2){headerIdx=r;colMap=map;break;}}
  if(headerIdx>=0){
    var mi=monthIdx>=0?monthIdx:new Date().getMonth();
    var dataRows=clean.slice(headerIdx+1);
    var totalRow=dataRows.find(function(c){var f=String(c[0]||'').toLowerCase().trim();return f==='total'||f==='totais'||f==='all'||f.indexOf('total')===0;});
    // se houver coluna de DATA com linhas diárias (ex.: GSC "Gráfico"), agrega por mês

function anCampParse(rows){
  var sec=AN_SECTIONS.camp,monthIdx=-1,year=anYear;
  var flat=[];rows.forEach(function(r){(r||[]).forEach(function(c){flat.push(String(c==null?'':c));});});
  for(var fi=0;fi<flat.length;fi++){var cell=flat[fi];var m=cell.match(/(20\d{2})(\d{2})\d{2}/);if(m){year=m[1];monthIdx=parseInt(m[2],10)-1;break;}m=cell.match(/\b(\d{1,2})\/(\d{1,2})\/(20\d{2})\b/);if(m){year=m[3];monthIdx=parseInt(m[2],10)-1;break;}}
  var clean=rows.filter(function(cols){if(!cols||!cols.length)return false;var first=String(cols[0]==null?'':cols[0]).trim();if(first.charAt(0)==='#')return false;return cols.some(function(c){return String(c==null?'':c).trim()!=='';});});
  var headerIdx=-1,colMap={};
  for(var r=0;r<clean.length;r++){var cols=clean[r];if(cols.length<2)continue;var map={},hits=0;cols.forEach(function(c,ci){var mk=anMatchCol(sec,c);if(mk&&map[mk]==null){map[mk]=ci;hits++;}});if(hits>=2){headerIdx=r;colMap=map;break;}}
  if(headerIdx<0)return{mi:-1,year:year,sources:{},mk:[]};
  var mi=monthIdx>=0?monthIdx:new Date().getMonth();
  var sources={};
  clean.slice(headerIdx+1).forEach(function(c){var name=String(c[0]||'').trim();if(!name)return;var low=name.toLowerCase();if(low==='total'||low==='totais'||low==='all'||low.indexOf('#')===0)return;
    var rec={};Object.keys(colMap).forEach(function(mk){var v=hNumParse(c[colMap[mk]]);if(v!=null)rec[mk]=v;});
    if(Object.keys(rec).length)sources[name]=rec;});
  return{mi:mi,year:year,sources:sources,mk:Object.keys(colMap)};
}

/* ── Render: tabela dinâmica origem × meses (estilo Top Páginas) ── */

  if(den>0)return num/den;var nums=months.map(function(mi){return anCampVal(anYear,anProp,name,mk,mi);}).filter(function(v){return v!=null;});return nums.length?nums.reduce(function(a,b){return Number(a)+Number(b);},0)/nums.length:null;}
function anCampAggAll(mk,months){var meta=anMeta('camp',mk);
  if(meta.fmt==='int')return months.reduce(function(s,mi){var v=anCampTotal(anYear,anProp,mk,mi);return s+(v||0);},0);
  var wk=meta.w||AN_SECTIONS.camp.head,num=0,den=0;months.forEach(function(mi){var v=anCampTotal(anYear,anProp,mk,mi),w=anCampTotal(anYear,anProp,wk,mi);if(v!=null&&w!=null){num+=Number(v)*Number(w);den+=Number(w);}});return den>0?num/den:null;}
function anCampLastCol(){var now=new Date();if(String(now.getFullYear())===String(anYear))return now.getMonth();var ms=anCampMonths(anYear,anProp);return ms.length?ms[ms.length-1]:11;}

/* ═══════════════════════════════════════════════════════════════
   CANAIS DE TRÁFEGO — visão quebrada por canal (Organic Search, Direct, …),
   espelha "Origem da Campanha" (mesma lógica, chave de armazenamento própria
   para não misturar com campanhas). Fonte: GA4 "Aquisição de tráfego ›
   Grupo principal de canais da sessão".
   dados por canal: ac.an.trafchsrc[year][prop][canal][mk]=[12]
   ═══════════════════════════════════════════════════════════════ */
var anTchMi=null, anTchMetric=null;

function anTchObj(year,prop){var s=anStore();s.trafchsrc=s.trafchsrc||{};s.trafchsrc[year]=s.trafchsrc[year]||{};s.trafchsrc[year][prop]=s.trafchsrc[year][prop]||{};return s.trafchsrc[year][prop];}

  for(var fi=0;fi<flat.length;fi++){var cell=flat[fi];var m=cell.match(/(20\d{2})(\d{2})\d{2}/);if(m){year=m[1];monthIdx=parseInt(m[2],10)-1;break;}m=cell.match(/\b(\d{1,2})\/(\d{1,2})\/(20\d{2})\b/);if(m){year=m[3];monthIdx=parseInt(m[2],10)-1;break;}}

  var headerIdx=-1,colMap={};
  for(var r=0;r<clean.length;r++){var cols=clean[r];if(cols.length<2)continue;if(!anTchIsChannelDim(cols[0]))continue;
    var map={},hits=0;cols.forEach(function(c,ci){if(ci===0)return;var mk=anMatchCol(sec,c);if(mk&&map[mk]==null){map[mk]=ci;hits++;}});

/* ═══════════════════════════════════════════════════════════════
   COTAÇÃO USD→BRL — busca automática (AwesomeAPI), com cache de 1x/dia salvo no Supabase.
   AdSense e Ad Manager pagam em dólar; o restante das redes em Receitas é lançado em real.
   ═══════════════════════════════════════════════════════════════ */
var AN_USD_NETS=['adsense','ad manager','admanager','google adsense','google ad manager']; // nomes de rede tratados como USD (case-insensitive, match parcial)
function anIsUsdNet(name){var n=(name||'').toString().toLowerCase().trim();return AN_USD_NETS.some(function(x){return n===x||n.indexOf(x)>=0;});}
var _anFxPromise=null;
function anFxCache(){var s=anStore();return s.fx||{};}
function anFxToday(){return new Date().toISOString().slice(0,10);}
function anFxRate(){var c=anFxCache();return c.rate||null;} // último valor conhecido (sincrono, para renderizar sem esperar a rede)
async function anFxEnsure(){
  var c=anFxCache();
  if(c.rate&&c.date===anFxToday())return null; // já atualizado hoje — nada de novo para o caller fazer (evita re-render em loop)
  if(_anFxPromise)return _anFxPromise;
  _anFxPromise=(async function(){
    try{
      var r=await fetch('https://economia.awesomeapi.com.br/last/USD-BRL');
      if(!r.ok)throw new Error('http '+r.status);
      var d=await r.json();
      var rate=Number(d&&d.USDBRL&&d.USDBRL.bid);
      if(!rate||isNaN(rate))throw new Error('resposta inválida');
      var s=anStore();s.fx={rate:rate,date:anFxToday()};sv();
      return rate; // sucesso real e novo — vale re-renderizar
    }catch(e){
      console.error('anFxEnsure error',e);
      // falhou: marca a tentativa de hoje pra não bater na API de novo a cada render, mas SEM re-renderizar
      // (mantém o rate antigo em cache, se houver, só para exibição — não dispara anR())
      var s2=anStore();s2.fx={rate:c.rate||null,date:anFxToday(),failed:true};sv();
      return null;
    }finally{_anFxPromise=null;}
  })();
  return _anFxPromise;
}
function anFxToBRL(usd){var r=anFxRate();return(usd==null||r==null)?null:usd*r;}


var AN_REV_DEFAULT=['UOL Afiliados','Indoleads','DGMax','Cofrinho']; // AdSense/Ad Manager saíram daqui: agora são lidos automaticamente das próprias abas
var anRevSort={by:null,dir:'desc'}, _anRevMan=null, _anRevImp=null;
function anRevObj(year,prop){var s=anStore();s.rev[year]=s.rev[year]||{};s.rev[year][prop]=s.rev[year][prop]||{};return s.rev[year][prop];}
function anRevArr(year,prop,net){var o=anRevObj(year,prop);if(!Array.isArray(o[net]))o[net]=Array(12).fill(null);return o[net];}

// mensal: olha o mês corrente (ou o último mês com dado, se o atual não tiver nada) de cada propriedade
function anDashPgDevGapMonthly(year){
  var now=new Date(),curMi=String(now.getFullYear())===String(year)?now.getMonth():11;
  var best=null;
  AN_REAL.forEach(function(prop){
    var months=pgDevMonths(year,prop);if(!months.length)return;
    var mi=months.indexOf(curMi)>=0?curMi:months[months.length-1];
    var devsWithData=PGDEV_LIST.filter(function(d){return pgDevRows(year,prop,d.k,mi).length>0;});
    if(devsWithData.length<2)return;
    var maps={};devsWithData.forEach(function(d){var m={};pgDevRows(year,prop,d.k,mi).forEach(function(r){m[r.q]=r;});maps[d.k]=m;});
    var names={};devsWithData.forEach(function(d){Object.keys(maps[d.k]).forEach(function(n){names[n]=1;});});
    Object.keys(names).forEach(function(n){
      var pos={};devsWithData.forEach(function(d){var r=maps[d.k][n];pos[d.k]=r?r.p:null;});
      var vals=devsWithData.map(function(d){return pos[d.k];}).filter(function(v){return v!=null;});
      if(vals.length<2)return;
      var gap=Math.max.apply(null,vals)-Math.min.apply(null,vals);
      if(!best||gap>best.gap){
        var bestD=null,worstD=null;devsWithData.forEach(function(d){if(pos[d.k]==null)return;if(bestD==null||pos[d.k]<pos[bestD])bestD=d.k;if(worstD==null||pos[d.k]>pos[worstD])worstD=d.k;});
        best={prop:prop,n:n,gap:gap,bestD:bestD,worstD:worstD,bestP:pos[bestD],worstP:pos[worstD],mi:mi};
      }
    });
  });
  return best;
}

function anRetMonthIdx(label){label=(label==null?'':label).toString().toLowerCase().trim();for(var i=0;i<AN_MES_LONG.length;i++){if(label.indexOf(AN_MES_LONG[i].toLowerCase())>=0||label.indexOf(HMESES[i].toLowerCase())>=0)return i;}var m=label.match(/(\d{1,2})/);if(m){var n=parseInt(m[1],10);if(n>=1&&n<=12)return n-1;}return -1;}
function anRetApply(rows){
  var clean=rows.filter(function(c){return c&&c.some(function(x){return String(x==null?'':x).trim()!=='';});});
  var n=0;
  clean.forEach(function(c,idx){
    var ci=anRetMonthIdx(c[0]);if(ci<0)return;
    if(idx===0&&!/\d/.test(String(c[1]||'')))return;
    var raw=[];for(var off=0;off<12;off++)raw.push(hNumParse(c[off+1]));
    var base=raw[0]; // Mês 0 vira sempre a base (100%) — converte automaticamente contagem bruta do GA4 (ex.: 8.838 usuários) ou mantém igual se já vier em percentual
    if(base==null||base===0)return;
    for(var off2=0;off2<12;off2++){
      if(raw[off2]==null)continue;
      var pct=raw[off2]/base*100;
      anRetSet(anYear,anProp,ci,off2,pct);n++;
    }
  });
  if(!n){toast('Não reconheci o arquivo. Use o modelo (Coorte, M0, M1, …) ou o relatório de Coorte do GA4 com Usuários ativos por mês.','ti-alert-circle');return;}
  sv();anR();toast('Retenção importada e convertida em % (base = Mês 0 de cada linha).','ti-file-import');
}

function anAdsUrlApply(rows,fname){
  var hdrIdx=-1;
  for(var i=0;i<rows.length;i++){if(rows[i]&&String(rows[i][0]||'').toLowerCase().indexOf('chaves-valor')>=0){hdrIdx=i;break;}}
  if(hdrIdx<0){toast('Não reconheci o formato do arquivo — esperava a coluna "Chaves-valor" (relatório ID_POST do Ad Manager).','ti-alert-circle');return;}
  var hdr=rows[hdrIdx].map(function(h){return String(h||'').toLowerCase();});
  function findCol(patterns){for(var c=0;c<hdr.length;c++){for(var p=0;p<patterns.length;p++){if(hdr[c].indexOf(patterns[p])>=0)return c;}}return -1;}
  var cRec=findCol(['receita']),cImp=findCol(['impress']),cVis=findCol(['vis','ative view']),cCli=findCol(['clique']);
  // 1ª passada: agrupa (soma) todas as linhas do mesmo id_post — o relatório traz uma linha POR PAÍS
  // para o mesmo post, então é preciso somar receita/impressões antes de gravar, senão cada país
  // sobrescreve o anterior e a receita final fica menor que a real
  var grouped={};
  for(var r=hdrIdx+1;r<rows.length;r++){
    var row=rows[r];if(!row||!row[0])continue;
    var key=String(row[0]).trim();if(!key||key.toLowerCase().indexOf('id_post')<0)continue;
    var rec=Number(row[cRec])||0,imp=Number(row[cImp])||0,cli=cCli>=0?(Number(row[cCli])||0):0;
    var visRaw=cVis>=0?Number(row[cVis])||0:0,vis=visRaw<=1?visRaw*100:visRaw; // arquivo original vem em fração (0–1)
    if(!grouped[key])grouped[key]={rec:0,imp:0,cli:0,visNum:0,visDen:0};
    grouped[key].rec+=rec;grouped[key].imp+=imp;grouped[key].cli+=cli;
    grouped[key].visNum+=vis*imp;grouped[key].visDen+=imp; // viewability ponderada por impressão
  }
  var list=anAdsUrlObj();
  var n=0;
  Object.keys(grouped).forEach(function(key){
    var g=grouped[key],rec=g.rec,imp=g.imp;
    var ecpm=imp>0?rec/imp*1000:0;
    var vis=g.visDen>0?g.visNum/g.visDen:0;
    var label=anPostUrlLabel(key);
    var existing=list.find(function(x){return x.u===key||x.u===label;});
    if(existing){existing.u=label;existing.r=rec;existing.i=imp;existing.e=ecpm;existing.v=vis;existing.c=g.cli;}else list.push({u:label,r:rec,i:imp,e:ecpm,v:vis,c:g.cli});
    n++;
  });
  if(!n){toast('Nenhuma linha de id_post reconhecida no arquivo.','ti-alert-circle');return;}
  sv();anR();toast(n+' páginas importadas/atualizadas de "'+fname+'" (receita somada entre países).','ti-file-import');
}

  var head='<tr>'+th('Página','name','stick','text-align:left')

function anTimeMigrateDay(key){var o=anTimeObj(key),ch=false;Object.keys(o).forEach(function(h){if(!Array.isArray(o[h])){var a=_tmNorm(o[h]);if(a.length)o[h]=a;else delete o[h];ch=true;}});if(ch)sv();}

function tmSchedule(){

function tmPushToAgenda(){

function tmHrs(v){var n=Number(v)||0;return (Math.round(n*10)/10).toString().replace('.',',');}
function tmListsView(){
  var s=anStore();s.tlists=s.tlists||{};
  TM_LISTS.forEach(function(L){if(!Array.isArray(s.tlists[L.k]))s.tlists[L.k]=[];});
  var grand=0,clsH={A:0,B:0,C:0,D:0,E:0},nItems=0;
  TM_LISTS.forEach(function(L){(s.tlists[L.k]||[]).forEach(function(it){var h=Number(it.h)||0;grand+=h;if(it.c&&clsH[it.c]!=null)clsH[it.c]+=h;if((it.t&&it.t.trim())||h)nItems++;});});
  var over=grand>24, days=grand/24, pct=Math.min(100,grand/24*100);
  var ab=clsH.A+clsH.B, cde=clsH.C+clsH.D+clsH.E;
  // summary
  var msg;
  if(grand===0){msg='Adicione itens com o tempo estimado em cada lista — o sistema soma tudo e mostra se cabe em um dia.';}

  {k:'seo_general', l:'Busca (Oportunidades/Decaimento/Impressão)'},
  {k:'gsc_general', l:'Busca (totais mensais — cliques/impressões/CTR/posição)'},
  {k:'seg',     l:'Segmentos (Dispositivo/País/Aspecto)'},
  {k:'unknown', l:'Não identificado'}
];
function centralTypeLabel(k){var t=CENTRAL_TYPES.find(function(x){return x.k===k;});return t?t.l:k;}
function centralDeviceFromName(fname){
  var n=(fname||'').toLowerCase();
  if(/celular|mobile|smartphone/.test(n))return 'mobile';
  if(/computador|desktop/.test(n))return 'desktop';
  if(/tablet/.test(n))return 'tablet';
  return null;
}
// acha a linha de cabeçalho real (primeira linha não-comentário com 2+ colunas preenchidas) e devolve o
// rótulo da primeira coluna — usado para decidir, ANTES de tentar qualquer parser, se a dimensão do
// arquivo é claramente "canal" (e nesse caso nunca deve cair em Top Páginas/Páginas e Telas, que aceitam
// qualquer dimensão como fallback e historicamente confundiam "Usuários"/"Sessões" do relatório de canais
// com as mesmas métricas de páginas)
function centralHeaderDim(rows){
  var clean=rows.filter(function(cols){if(!cols||!cols.length)return false;var f=String(cols[0]==null?'':cols[0]).trim();if(f.charAt(0)==='#')return false;return cols.some(function(c){return String(c==null?'':c).trim()!=='';});});
  for(var r=0;r<clean.length;r++){if(clean[r].length>=2)return String(clean[r][0]||'');}
  return '';
}
// um arquivo com colunas de Cliques E Impressões juntas é, com altíssima confiança, um relatório do Search
// Console (Busca/Páginas/Consultas por dispositivo) — nunca um relatório de Páginas e Telas/Top Páginas do
// GA4, mesmo que a dimensão (1ª coluna) também se chame "Página"/"Páginas mais comuns" nos dois casos.
function centralLooksLikeGSC(rows){
  var clean=rows.filter(function(cols){if(!cols||!cols.length)return false;var f=String(cols[0]==null?'':cols[0]).trim();if(f.charAt(0)==='#')return false;return cols.some(function(c){return String(c==null?'':c).trim()!=='';});});
  for(var r=0;r<clean.length;r++){var cols=clean[r];if(cols.length<2)continue;
    var hasClicks=cols.some(function(c){return anSeoMatch(c,['clique','clicks']);});
    var hasImpr=cols.some(function(c){return anSeoMatch(c,['impress']);});
    if(hasClicks&&hasImpr)return true;
    if(hasClicks||hasImpr)return false; // já achou uma linha de cabeçalho plausível sem o par completo — não é GSC
  }
  return false;
}
function centralDetectOne(rows,fname,batchDevice){
  var dev=centralDeviceFromName(fname)||batchDevice||null;
  var headerDim=centralHeaderDim(rows);
  var looksLikeChannel=anTchIsChannelDim(headerDim);
  var isUserChannel=looksLikeChannel&&/usu[áa]rio/i.test(headerDim)&&headerDim.toLowerCase().indexOf('sess')<0; // "canal do primeiro usuário"
  var isSessionChannel=looksLikeChannel&&!isUserChannel; // "canal da sessão" (Aquisição de Tráfego)
  // 0) Canal de sessão (Aquisição de Tráfego): popula tanto "Canais de Tráfego" (por canal) quanto
  //    "Tráfego" geral (soma de todos os canais, via anParse — o mesmo parser genérico usado no "Inserir
  //    manual" da seção). Nunca tenta Páginas e Telas/Top Páginas nesse caso (que aceitariam por engano).
  if(isSessionChannel){
    var types=[];
    var tchEarly=anTchParse(rows);
    if(tchEarly.mi>=0&&Object.keys(tchEarly.channels).length)types.push('trafch');
    var trafGen=anParse('traf',rows);
    if(trafGen.mode==='month')types.push('traf_general');
    if(!types.length)return{type:'unknown',data:null,fname:fname,types:[]};
    return{type:types[0],data:{trafch:tchEarly,traf_general:trafGen},fname:fname,types:types};
  }
  // 0b) Canal de usuário (Aquisição de Usuários): não tem tela própria por canal, mas popula "Usuários"
  //     geral (soma de todos os canais)
  if(isUserChannel){
    var userGen=anParse('user',rows);
    if(userGen.mode==='month')return{type:'user_general',data:{user_general:userGen},fname:fname,types:['user_general']};
    return{type:'unknown',data:null,fname:fname,types:[]};
  }
  // 0c) "Gráfico.csv" do pacote do Search Console: totais de Cliques/Impressões/CTR/Posição POR DIA, sem
  //     quebra por página/consulta — alimenta a aba "Busca" geral (anSectionBody), que já sabe agregar
  //     linhas diárias em totais mensais (mesma lógica do "Inserir manual"/"Importar CSV" de lá).
  if(/^data$/i.test((headerDim||'').trim())&&centralLooksLikeGSC(rows)){
    var gscGen=anParse('gsc',rows);
    if(gscGen.mode==='month')return{type:'gsc_general',data:{gsc_general:gscGen},fname:fname,types:['gsc_general']};
    return{type:'unknown',data:null,fname:fname,types:[]};
  }
  var looksLikePageDim=anPgIsPageDim(headerDim)&&!centralLooksLikeGSC(rows);
  // 1) Páginas e Telas (Título da página) — checa ANTES de Top Páginas, pois ambos aceitam rótulos parecidos
  //    na dimensão; a diferença real está em qual coluna de métrica cada um reconhece. Só tenta os dois
  //    quando a dimensão do cabeçalho já parece página/URL E não tem cara de Search Console (Cliques +
  //    Impressões) — sem essa blindagem dupla, o fallback permissivo de ambos os parsers (aceitam qualquer
  //    dimensão se acharem 1 métrica reconhecida) rouba arquivos de Campanha/Canal/Páginas do GSC.
  if(looksLikePageDim){
    var pv=pvParse(rows);
    if(pv.mode==='month')return{type:'pgview',data:{pgview:pv},fname:fname,types:['pgview']};
    // 2) Top Páginas (Caminho/URL, métrica Sessões)
    var pg=anPgParse(rows);
    if(pg.mode==='month'||pg.mode==='wide')return{type:'pages',data:{pages:pg},fname:fname,types:['pages']};
  }
  // 3) Canais de Tráfego (dimensão explícita "canal") — checa antes de Campanha, que é mais permissiva
  var tch=anTchParse(rows);
  if(tch.mi>=0&&Object.keys(tch.channels).length)return{type:'trafch',data:{trafch:tch},fname:fname,types:['trafch']};
  // 4) Segmentos do GSC (Dispositivo/País/Aspecto) — dimensão vem explícita no próprio arquivo
  var seg=anSegParse(rows);
  if(seg.dim&&seg.dim!=='other'&&seg.rows.length)return{type:'seg',data:{seg:seg},fname:fname,types:['seg']};
  // 5) Search Console genérico (Consultas ou Páginas, com Cliques/Impressões/Posição) — pode ser geral OU
  //    filtrado por dispositivo. O dispositivo vem do nome do arquivo OU do Filtros.csv do mesmo lote
  //    (batchDevice) — só na ausência total dessa informação o arquivo é tratado como Busca geral, ambíguo.
  var seo=anSeoParse(rows);
  if(seo.rows.length){
    var isPageDim=seo.dimLbl&&/p[áa]gina|page|url/i.test(seo.dimLbl);
    var baseType=isPageDim?'seo_pages_device':'seo_query_device';
    if(dev)return{type:baseType,data:{_:seo},fname:fname,device:dev,types:[baseType]};
    // sem indicação de dispositivo (nem no nome, nem no Filtros.csv do lote): trata como Busca geral, ambíguo
    return{type:'seo_general',data:{_:seo},fname:fname,ambiguous:true,types:['seo_general']};
  }
  // 6) Origem da Campanha (mais permissiva — fica por último para não roubar arquivos de Canais)
  var camp=anCampParse(rows);
  if(camp.mi>=0&&Object.keys(camp.sources).length)return{type:'camp',data:{camp:camp},fname:fname,types:['camp']};
  return{type:'unknown',data:null,fname:fname,types:[]};
}
var _centralFiles=[]; // [{fname, rows, detected:{type,data,types,...}, overrideTypes:[...], overrideDevice, overrideDaily}]
var _centralBusy=false;
function centralOpen(){
  if(anProp==='all'){toast('Selecione uma propriedade específica antes de usar o Upload Central.','ti-info-circle');return;}
  _centralFiles=[];
  var o=document.createElement('div');o.className='ov';o.id='central-ov';
  o.innerHTML='<div class="mx" style="width:760px;max-width:96vw;max-height:88vh;display:flex;flex-direction:column"><div id="central-body" style="overflow:auto;flex:1;min-height:0"></div></div>';
  document.body.appendChild(o);o.addEventListener('click',function(e){if(e.target===o&&!_centralBusy){o.remove();}});
  centralRenderBody();
}
function centralPickFiles(){
  var inp=document.createElement('input');inp.type='file';inp.accept='.csv,.xlsx,.xls,text/csv';inp.multiple=true;
  inp.onchange=function(e){
    var files=Array.from(e.target.files||[]);if(!files.length)return;
    var pending=files.length,batch=[];
    files.forEach(function(f){
      var ext=(f.name.split('.').pop()||'').toLowerCase();
      function onRows(rows){
        batch.push({fname:f.name,rows:rows});
        pending--;if(pending===0)centralAddBatch(batch);
      }
      if(ext==='xlsx'||ext==='xls'){loadXLSX().then(function(XLSX){var rd=new FileReader();rd.onload=function(ev){try{var wb=XLSX.read(ev.target.result,{type:'array'});var ws=wb.Sheets[wb.SheetNames[0]];onRows(XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}));}catch(err){pending--;toast('Falha ao ler '+f.name+': '+err.message,'ti-alert-circle');if(pending===0)centralAddBatch(batch);}};rd.readAsArrayBuffer(f);}).catch(function(){pending--;if(pending===0)centralAddBatch(batch);});}
      else{var rd=new FileReader();rd.onload=function(ev){var txt=ev.target.result;if(txt.charCodeAt(0)===0xFEFF)txt=txt.slice(1);onRows(txt.split(/\r?\n/).filter(function(l){return l.trim();}).map(function(l){return _csvRow(l);}));};rd.readAsText(f,'UTF-8');}
    });
  };inp.click();
}
// detecta o dispositivo aplicado a um lote a partir do arquivo "Filtros.csv" que o Search Console gera
// junto com o pacote de exportação (Aspecto da pesquisa, Consultas, Dispositivos, Páginas, Países, etc.)
// — esse arquivo é a única peça que revela o filtro de dispositivo quando o nome dos demais é genérico
// (ex.: "Páginas.csv", sem "Celular"/"Computador" no nome).
function centralFiltersDeviceFromBatch(batch){
  for(var i=0;i<batch.length;i++){
    var fname=(batch[i].fname||'').toLowerCase();
    if(fname.indexOf('filtro')<0)continue;
    var rows=batch[i].rows;
    for(var r=0;r<rows.length;r++){var cols=rows[r];if(!cols||cols.length<2)continue;
      var k=String(cols[0]||'').toLowerCase();
      if(k.indexOf('dispositivo')>=0){
        var v=String(cols[1]||'').toLowerCase();
        if(/celular|mobile/.test(v))return'mobile';
        if(/computador|desktop/.test(v))return'desktop';
        if(/tablet/.test(v))return'tablet';
      }
    }
  }
  return null;
}
function centralAddBatch(batch){
  var batchDevice=centralFiltersDeviceFromBatch(batch);
  batch.forEach(function(item){
    var fname=(item.fname||'').toLowerCase();
    if(fname.indexOf('filtro')>=0)return; // Filtros.csv é só metadado para desambiguação — não tem destino próprio
    var det=centralDetectOne(item.rows,item.fname,batchDevice);
    _centralFiles.push({fname:item.fname,rows:item.rows,detected:det,overrideTypes:det.types.slice(),overrideDevice:det.device||null,dailyMode:!!det.isDaily,skip:det.types.length===0});
  });
  centralRenderBody();
}
function centralRemoveFile(idx){_centralFiles.splice(idx,1);centralRenderBody();}
function centralToggleType(idx,type,checked){
  var f=_centralFiles[idx];
  if(checked){if(f.overrideTypes.indexOf(type)<0)f.overrideTypes.push(type);}
  else{f.overrideTypes=f.overrideTypes.filter(function(t){return t!==type;});}
  f.skip=(f.overrideTypes.length===0);
  centralRenderBody();
}
function centralSetDevice(idx,dev){_centralFiles[idx].overrideDevice=dev;centralRenderBody();}
function centralSetDaily(idx,checked){_centralFiles[idx].dailyMode=checked;centralRenderBody();}
function centralRenderBody(){
  var h='<h4 style="display:flex;align-items:center;gap:7px"><i class="ti ti-cloud-upload" style="color:var(--primary)"></i> Upload Central — '+propLabel(anProp)+' · '+anYear+'</h4>';
  h+='<p style="font-size:12px;color:var(--text-secondary);line-height:1.55;margin:6px 0 12px">Selecione quantos arquivos quiser de uma vez — inclusive o pacote completo do Search Console (Consultas, Páginas, Dispositivos, Países, Aspecto da pesquisa, Gráfico, Filtros). O sistema identifica o(s) destino(s) de cada um pelo conteúdo, pelo nome do arquivo e, quando presente, pelo "Filtros.csv" do pacote (que revela automaticamente se o lote foi filtrado por Celular/Computador/Tablet). Alguns arquivos alimentam mais de uma tela ao mesmo tempo — marque/desmarque os destinos antes de confirmar.</p>';
  h+='<button class="an-btn prim" onclick="centralPickFiles()" style="margin-bottom:14px"><i class="ti ti-upload"></i> Selecionar arquivos</button>';
  if(!_centralFiles.length){
    h+='<div class="an-empty" style="padding:30px 10px"><i class="ti ti-files"></i><p>Nenhum arquivo selecionado ainda</p><span>Clique em "Selecionar arquivos" e escolha 1 ou vários CSVs/XLSX de uma vez.</span></div>';
  }else{
    h+='<div class="hwrap"><table class="htbl" style="font-size:11.5px"><thead><tr><th style="text-align:left">Arquivo</th><th style="text-align:left">Destino(s)</th><th>Dispositivo</th><th>Diário?</th><th></th></tr></thead><tbody>';
    _centralFiles.forEach(function(f,idx){
      var det=f.detected;
      var needsDevice=f.overrideTypes.some(function(t){return t==='seo_pages_device'||t==='seo_pages_device_d'||t==='seo_query_device'||t==='seo_query_device_d';});
      var ambiguous=det.ambiguous&&f.overrideTypes.indexOf('seo_general')>=0;
      var unrecognized=det.types.length===0;
      // checkboxes: mostra todos os destinos detectados (geralmente 1, às vezes 2) + opção "Não identificado"
      var options=det.types.length?det.types:[];
      var typeChecks=options.map(function(t){var checked=f.overrideTypes.indexOf(t)>=0;return '<label style="display:flex;align-items:center;gap:5px;white-space:nowrap"><input type="checkbox" '+(checked?'checked':'')+' onchange="centralToggleType('+idx+',\''+t+'\',this.checked)"> '+centralTypeLabel(t)+'</label>';}).join('');
      typeChecks='<div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start">'+typeChecks+'</div>';
      if(unrecognized)typeChecks='<span style="color:var(--text-secondary)">Não identificado — não será importado</span>';
      var devSel=needsDevice?('<select class="fsel" style="font-size:11px" onchange="centralSetDevice('+idx+',this.value)"><option value="">—</option><option value="mobile"'+(f.overrideDevice==='mobile'?' selected':'')+'>Celular</option><option value="desktop"'+(f.overrideDevice==='desktop'?' selected':'')+'>Computador</option><option value="tablet"'+(f.overrideDevice==='tablet'?' selected':'')+'>Tablet</option></select>'):'—';
      var dailyChk=(needsDevice||f.overrideTypes.indexOf('seo_general')>=0)?('<input type="checkbox" '+(f.dailyMode?'checked':'')+' onchange="centralSetDaily('+idx+',this.checked)">'):'—';
      var rowStyle=ambiguous?' style="background:rgba(245,158,11,.08)"':(f.skip?' style="opacity:.5"':'');
      h+='<tr'+rowStyle+'><td style="text-align:left;max-width:220px;overflow:hidden;text-overflow:ellipsis" title="'+anEsc(f.fname)+'">'+(ambiguous?'<i class="ti ti-alert-triangle" style="color:var(--warning);font-size:11px"></i> ':'')+anEsc(f.fname)+'</td>'
        +'<td style="text-align:left">'+typeChecks+'</td><td>'+devSel+'</td><td>'+dailyChk+'</td>'
        +'<td><button class="an-ic-btn del" onclick="centralRemoveFile('+idx+')"><i class="ti ti-trash" style="font-size:11px"></i></button></td></tr>';
    });
    h+='</tbody></table></div>';
    var validCount=_centralFiles.filter(function(f){return!f.skip;}).length;
    var totalDestinos=_centralFiles.reduce(function(s,f){return s+(f.skip?0:f.overrideTypes.length);},0);
    h+='<div class="mbb" style="margin-top:14px"><button onclick="document.getElementById(\'central-ov\').remove()">Cancelar</button><button class="pr" onclick="centralApplyAll()" '+(validCount?'':'disabled')+'><i class="ti ti-check" style="font-size:11px"></i> Importar '+validCount+' arquivo(s) → '+totalDestinos+' destino(s)</button></div>';
  }
  document.getElementById('central-body').innerHTML=h;
}
// aplica UM destino específico de um arquivo, usando os dados já parseados em f.detected.data (evita
// reparsear o arquivo a cada destino) — reaproveita 100% a lógica de armazenamento de cada tela
function centralApplyDestination(f,type){
  var data=f.detected.data||{};
  if(type==='pgview'){var p=data.pgview;if(!p||p.mode!=='month')return false;var o=pvObj(anYear,anProp);o[p.mi]=p.pages;return true;}
  if(type==='pages'){var p2=data.pages;if(!p2)return false;if(p2.mode==='month'){Object.keys(p2.pages).forEach(function(n){var rec=p2.pages[n];if(rec.ses!=null)anPgSetCell(anYear,anProp,n,'ses',p2.mi,rec.ses);});return true;}if(p2.mode==='wide'){var wmk=anPgCurMetric();Object.keys(p2.pages).forEach(function(n){var arr=p2.pages[n];for(var i=0;i<12;i++)anPgSetCell(anYear,anProp,n,wmk,i,arr[i]);});return true;}return false;}
  if(type==='trafch'){var p3=data.trafch;if(!p3||p3.mi<0)return false;Object.keys(p3.channels).forEach(function(name){var rec=p3.channels[name];AN_SECTIONS.trafch.metrics.forEach(function(m){if(rec[m.k]!=null)anTchSetCell(anYear,anProp,name,m.k,p3.mi,rec[m.k]);});});return true;}
  if(type==='traf_general'){var p3b=data.traf_general;if(!p3b||p3b.mode!=='month')return false;Object.keys(p3b.data).forEach(function(mk){var v=p3b.data[mk][p3b.monthIdx];if(v!=null)anSetCell(anYear,'traf',anProp,mk,p3b.monthIdx,v);});return true;}
  if(type==='user_general'){var p3c=data.user_general;if(!p3c||p3c.mode!=='month')return false;Object.keys(p3c.data).forEach(function(mk){var v=p3c.data[mk][p3c.monthIdx];if(v!=null)anSetCell(anYear,'user',anProp,mk,p3c.monthIdx,v);});return true;}
  if(type==='gsc_general'){var p3d=data.gsc_general;if(!p3d||p3d.mode!=='month')return false;
    // o "Gráfico.csv" não tem cabeçalho de comentários do GA4/GSC com a data — o mês já vem certo dentro de
    // cada array (12 posições, só uma preenchida), então acha o índice não-nulo em vez de usar monthIdx
    var mi3d=p3d.monthIdx;if(mi3d<0){Object.keys(p3d.data).some(function(mk){var arr=p3d.data[mk];for(var i=0;i<12;i++){if(arr[i]!=null){mi3d=i;return true;}}return false;});}
    if(mi3d<0)return false;
    Object.keys(p3d.data).forEach(function(mk){var v=p3d.data[mk][mi3d];if(v!=null)anSetCell(anYear,'gsc',anProp,mk,mi3d,v);});return true;}
  if(type==='camp'){var p4=data.camp;if(!p4||p4.mi<0)return false;
    var oc=anCampObj(anYear,anProp);Object.keys(p4.sources).forEach(function(name){oc[name]=oc[name]||{};var rec=p4.sources[name];Object.keys(rec).forEach(function(mk){if(!Array.isArray(oc[name][mk]))oc[name][mk]=Array(12).fill(null);oc[name][mk][p4.mi]=rec[mk];});});
    return true;}
  if(type==='seg'){var p5=data.seg;if(!p5||!p5.dim||!p5.rows.length)return false;var mi5=segMi!=null?segMi:new Date().getMonth();var o5=anSegObj(anYear,anProp);o5[p5.dim]=o5[p5.dim]||{};o5[p5.dim][mi5]=p5.rows;return true;}
  if(type==='seo_general'){var p6=data._;if(!p6||!p6.rows.length)return false;var mi6=f.dailyMode?(new Date().getDate()-1):new Date().getMonth();var o6=anSeoObj(anYear,anProp);o6[mi6]=p6.rows;anSeoDimSet(anYear,anProp,mi6,p6.dimLbl);return true;}
  if(type==='seo_pages_device'||type==='seo_query_device'){
    var p7=data._;if(!p7||!p7.rows.length||!f.overrideDevice)return false;
    var mi7=new Date().getMonth();var isQ=type==='seo_query_device';
    var o7=isQ?qDevObj(anYear,anProp):pgDevObj(anYear,anProp);o7[f.overrideDevice]=o7[f.overrideDevice]||{};o7[f.overrideDevice][mi7]=p7.rows;
    return true;
  }
  if(type==='seo_pages_device_d'||type==='seo_query_device_d'){
    var p8=data._;if(!p8||!p8.rows.length||!f.overrideDevice)return false;
    var now=new Date(),mi8=now.getMonth(),day8=now.getDate();var isQ8=type==='seo_query_device_d';
    var o8=isQ8?qDevDObj(anYear,anProp):pgDevDObj(anYear,anProp);o8[f.overrideDevice]=o8[f.overrideDevice]||{};o8[f.overrideDevice][mi8]=o8[f.overrideDevice][mi8]||{};o8[f.overrideDevice][mi8][day8]=p8.rows;
    return true;
  }
  return false;
}
function centralApplyAll(){
  _centralBusy=true;
  var toApply=_centralFiles.filter(function(f){return!f.skip;});
  var okCount=0,failCount=0;
  toApply.forEach(function(f){
    f.overrideTypes.forEach(function(type){
      try{if(centralApplyDestination(f,type))okCount++;else failCount++;}
      catch(err){console.error('central import error',f.fname,type,err);failCount++;}
    });
  });
  sv();
  _centralBusy=false;
  var ov=document.getElementById('central-ov');if(ov)ov.remove();
  anR();
  toast(okCount+' destino(s) importado(s)'+(failCount?(' · '+failCount+' falharam (confira os destinos marcados)'):'')+'.','ti-file-import');
}
</script>
